services:
  mysql:
    profiles: ["mysql"]
    image: mysql:9.7.4@sha256:df90258da46f6e7ff8574ff84f17618aba0765cac749928299c69fd4e7cb8ad8
    ports:
      - "127.0.0.1:${LOCAL_MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: tanah-dev
      MYSQL_ROOT_PASSWORD: test_123
    volumes:
      - mysql97_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --host=127.0.0.1 --user=root --execute='SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    profiles: ["backend"]
    image: bible-on-site-api:dev
    build:
      context: ../web
      dockerfile: api/Dockerfile
    ports:
      - "127.0.0.1:3003:3003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: ../web/api/.dev.env
    environment:
      HOST: "0.0.0.0"
      PORT: "3003"
      PROFILE: dev
      DB_URL: "${LOCAL_BACKEND_DB_URL:-mysql://root:test_123@host.docker.internal:3306/tanah-dev?ssl-mode=DISABLED}"
      S3_ENDPOINT: http://rustfs:9000
    depends_on:
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3003/health"]
      interval: 2s
      timeout: 5s
      retries: 60

  rustfs:
    # Pin the multi-platform manifest so local development and CI use one build.
    image: rustfs/rustfs:1.0.7@sha256:69bd3c4d8d79b74723bfd68c9fbd9085155d4d4b44a5a136d87502f3075cc68c
    ports:
      - "127.0.0.1:4566:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: test
      RUSTFS_SECRET_KEY: test_1234
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    volumes:
      # Never mount the legacy minio_data volume into a different storage engine.
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 60

  rustfs-init:
    profiles: ["init"]
    image: bible-on-site-s3-init:dev
    build:
      context: .
      dockerfile: rustfs/Dockerfile
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test_1234
      AWS_EC2_METADATA_DISABLED: "true"
      S3_ENDPOINT: http://rustfs:9000
    depends_on:
      rustfs:
        condition: service_healthy

volumes:
  mysql97_data:
  rustfs_data:
