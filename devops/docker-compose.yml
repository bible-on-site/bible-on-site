services:
  rustfs:
    # Pin the multi-platform manifest so local development and CI use one build.
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    ports:
      - "127.0.0.1:4566:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: test
      RUSTFS_SECRET_KEY: test_1234
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    volumes:
      # Never mount the legacy minio_data volume into a different storage engine.
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 60

  rustfs-init:
    profiles: ["init"]
    image: bible-on-site-s3-init:dev
    build:
      context: .
      dockerfile: rustfs/Dockerfile
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test_1234
      AWS_EC2_METADATA_DISABLED: "true"
      S3_ENDPOINT: http://rustfs:9000
    depends_on:
      rustfs:
        condition: service_healthy

volumes:
  rustfs_data:
