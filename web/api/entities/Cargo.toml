[package]
name = "entities"
version = "0.1.1"
edition = "2024"

[lib]
name = "entities"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
sea-orm = { version = "2.0.0", default-features = false, features = [
    "macros",
    "sqlx-mysql",
    "runtime-actix-native-tls",
    "with-chrono",
    "with-json",
    "with-rust_decimal",
] }

[dev-dependencies]
sea-orm = { version = "2.0.0", default-features = false, features = ["mock"] }
