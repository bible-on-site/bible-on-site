
[package]
name = "bible-on-site-api"
description = "Bible on Site API"
license-file = "../../license"
repository = "https://github.com/bible-on-site/bible-on-site"
publish = false
version = "0.1.98"
edition = "2024"

[dependencies]
actix-web = { version = "4.15.0", default-features = false, features = [
    "macros",
    "http2",
    "compress-brotli",
    "ws",
] }
async-graphql = { version = "7.2.1", default-features = false, features = [
    "playground",
] }
async-graphql-actix-web = "7.2.1"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-actix-web = "0.7.25"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-bunyan-formatter = { version = "0.3.10", default-features = false }
tracing-log = "0.2.0"
derive_more = { version = "2.1.1", features = ["display"] }
sea-orm = { version = "2.0.4", default-features = false, features = [
    "sqlx-mysql",
    "runtime-tokio-native-tls",
] }
# Use the same frozen binder as SeaORM for the retained retrain session.
sea-query-sqlx = { version = "0.9.1", default-features = false, features = ["sqlx-mysql"] }
entities = { path = "./entities" }
uuid = { version = "1.26.1", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
unicode-normalization = { version = "0.1.25", default-features = false, features = [
    "std",
] }
# Plain HTTP only: the website revalidate endpoint is reached over Cloud Map
# service discovery (http://website.bible-on-site.local:3000), so no TLS
# features — that keeps extra TLS stacks out of the build graph.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
percent-encoding = "2.3.2"

[dev-dependencies]
cargo-llvm-cov = "0.9.1"
sea-orm = { version = "2.0.4", default-features = false, features = ["mock"] }

[[bin]]
name = "api"
path = "src/main.rs"

[workspace]
members = [".", "./entities"]

[profile.dev]
incremental = true

[package.metadata.release]
pre-release-commit-message = "chore(release): {{version}} [skip ci]"
