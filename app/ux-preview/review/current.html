<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>על הפרק - המסכים הנוכחיים</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#f5f7fb; color:#192b45; font-family:system-ui,sans-serif; }
    header { padding:18px 24px 8px; text-align:center; }
    h1 { margin:0 0 6px; font-size:26px; }
    p { margin:0; color:#526b91; }
    a { color:#1552ac; }
    main { display:grid; grid-template-columns:repeat(4,1fr); gap:22px; max-width:1220px; margin:14px auto; padding:0 22px; }
    figure { margin:0; text-align:center; }
    figcaption { margin-bottom:10px; font-size:17px; font-weight:700; }
    img { display:block; height:520px; max-height:calc(100vh - 172px); max-width:100%; width:auto; margin:auto; border:1px solid #d7e1f2; border-radius:20px; box-shadow:0 8px 24px #192b4514; }
    @media(max-width:640px) { main { grid-template-columns:1fr; } img { height:auto; max-height:none; width:min(100%,300px); } }
  </style>
</head>
<body>
  <header>
    <h1>דף בית אחד. עוד דרכים ללמוד.</h1>
    <p>הפרק היומי, פרשות ומועדים באריחים רחבים, וביניהם אריחים קטנים. <a href="index.html">לפני ואחרי מול master</a></p>
  </header>
  <main>
    <figure><figcaption>הבית והפרק היומי</figcaption><img src="assets/after/home.png" width="1080" height="2400" alt="הבית עם כרטיס הפרק היומי הכהה והכפתור הכחול"></figure>
    <figure><figcaption>פרשות בין אריחים קטנים</figcaption><img src="assets/after/home-parasha.png" width="1080" height="2400" alt="אריח פרשות רחב, לצד תנכפדיה ומסורה באריחים בודדים"></figure>
    <figure><figcaption>מועדים בהמשך הבית</figcaption><img src="assets/after/home-moadim.png" width="1080" height="2400" alt="אריח מועדים רחב בין אריחי תוכן קטנים"></figure>
    <figure><figcaption>יצירת קשר ותרומות</figcaption><img src="assets/after/home-community.png" width="1080" height="2400" alt="אריחים בודדים ליצירת קשר ולתרומות בהמשך הבית"></figure>
  </main>
</body>
</html>
