[workspace]
resolver = "2"
members = [
    "authors",
    "mysql/db-populator",
    "s3/s3-populator",
    "sefaria/setup-and-population",
    "sefaria/pipelines/tanah-view",
    "sefaria/pipelines/perushim-view",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
authors = ["doradsoft <doradsoft@gmail.com>"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
mongodb = { version = "3", default-features = false, features = ["bson-3", "rustls-tls", "dns-resolver", "compat-3-3-0"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
chrono-tz = "0.10"
icu_calendar = "2.3"
dotenvy = "0.15"
rusqlite = { version = "0.40", features = ["bundled"] }
flate2 = "1"
bson = "3"
sunrise = "3"
