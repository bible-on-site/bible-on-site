[package]
name = "s3-populator"
version = "0.1.1"
edition = "2021"
description = "Populate S3 buckets with test data for development and testing"

[dependencies]
anyhow = "1.0"
aws-config = { version = "1.12", features = ["behavior-version-latest"] }
# Keep the current HTTPS client; the legacy rustls feature pulls vulnerable webpki 0.101.
aws-sdk-s3 = { version = "1.150", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-smithy-http-client = "1.4.2"
clap = { version = "4.6", features = ["derive", "env"] }
crc32fast = "1.5"
dotenvy = "0.15"
miniz_oxide = "0.9"
reqwest = { version = "0.13", features = ["blocking"] }
tokio = { version = "1.53", features = ["full"] }
