[package]
name = "db-populator"
description = "Populate MySQL database with Tanah structure and test data"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
tokio.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
dotenvy.workspace = true
sqlx-core = { version = "0.9.1", features = ["_rt-tokio", "_tls-native-tls"] }
# Local servers can still use RSA for a cold caching_sha2_password login
# when TLS is unavailable.
sqlx-mysql = { version = "0.9.1", features = ["rsa"] }

[dev-dependencies]
tempfile = "3"
