<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ארכיון בדיקת הקלטות</title><style>body{font-family:system-ui;background:#f3f5f7;color:#17283c;max-width:760px;margin:40px auto;padding:24px}article{background:white;padding:20px;margin:12px 0;border-radius:12px}p{white-space:pre-wrap}a{color:#315b9a}</style><a href="/">חזרה לבדיקה</a><h1>ארכיון התשובות</h1><p>התשובות וההערות מהסבב הקודם נשמרו. חיתוכים ששונו דורשים בדיקה חדשה.</p><main id="records"></main><script>fetch('/api/archive').then(r=>r.json()).then(rounds=>{for(const round of rounds){for(const item of round.cases){const article=document.createElement('article'),title=document.createElement('h2'),note=document.createElement('p');title.textContent=item.label+' - '+({good:'החיתוכים טובים',problem:'דווחה בעיה',skip:'דילוג'}[item.decision?.verdict]??'טרם נבדק');note.textContent=item.decision?.note??'';article.append(title,note);document.getElementById('records').append(article)}}}).catch(()=>{document.getElementById('records').textContent='לא ניתן לטעון את הארכיון'})</script></html>
