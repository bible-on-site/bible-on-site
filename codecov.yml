codecov:
  require_ci_to_pass: true
coverage:
  status:
    project:
      default:
        # Informational only: flag-specific checks enforce coverage per module.
        # The default (unflagged) check aggregates ALL files, including those
        # outside any flag path (devops/, docs/, .github/, etc.) which always
        # have 0% coverage and can cause false-positive regressions.
        target: auto
        threshold: 0%
        informational: true
      api:
        target: auto
        threshold: 1%
        flags:
          - api
      app:
        target: auto
        threshold: 0%
        flags:
          - app
      website:
        # Enforce no regression from the current base coverage. A fixed 99%
        # target is stale: current master website LCOV is ~85% once Tanahpedia
        # source files are included in the website flag.
        target: auto
        threshold: 0%
        flags:
          - website
      bulletin:
        target: auto
        threshold: 1%
        informational: true
        flags:
          - bulletin
      admin:
        target: auto
        threshold: 1%
        informational: true
        flags:
          - admin
      data:
        target: auto
        threshold: 1%
        flags:
          - data
    patch:
      default:
        target: auto
        threshold: 0%
comment:
  layout: "reach, diff, flags, files, footer"
  behavior: default
  require_changes: false # if true: only post the comment if coverage changes
  require_base: false # [true :: must have a base report to post]
  require_head: false # [true :: must have a head report to post]
  hide_project_coverage: false # [true :: only show coverage on the git diff aka patch coverage]]
flags:
  api:
    paths:
      - web/api/src/
  app:
    paths:
      - app/BibleOnSite/
  website:
    paths:
      - web/bible-on-site/src/
  bulletin:
    paths:
      - web/bulletin/src/
  admin:
    paths:
      - web/admin/src/
  data:
    paths:
      - data/
