AWSTemplateFormatVersion: "2010-09-09"
Description: Additive private upload storage and administrator-provisioned Cognito accounts. Deploy only after explicit approval.
Parameters:
  WebsiteOrigin:
    Type: String
    Default: https://xn--febl3a.co.il
    AllowedPattern: https://[^/]+
  CognitoDomainPrefix:
    Type: String
    Default: bible-on-site-private-upload
  WebsiteTaskRoleName:
    Type: String
    Default: bible-on-site-website-task-role
  WebsiteTaskRoleArn:
    Type: String
    AllowedPattern: arn:aws:iam::[0-9]{12}:role/.+
Resources:
  UploadUsers:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: bible-on-site-upload-users
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      MfaConfiguration: "OFF"
  UploadClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: private-upload-website
      UserPoolId: !Ref UploadUsers
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, aws.cognito.signin.user.admin]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub "${WebsiteOrigin}/upload/auth/callback"]
      LogoutURLs: [!Sub "${WebsiteOrigin}/upload"]
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
  UploadDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UploadUsers
  UploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "bible-on-site-private-upload-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: AbortAbandonedUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt UploadBucket.Arn, !Sub "${UploadBucket.Arn}/*"]
            Condition:
              Bool: { "aws:SecureTransport": "false" }
          - Sid: OnlyWebsiteServiceMayAccessData
            Effect: Deny
            Principal: "*"
            Action: ["s3:GetObject*", "s3:PutObject*", "s3:DeleteObject*", "s3:ListBucket*", s3:AbortMultipartUpload, s3:ListMultipartUploadParts]
            Resource: [!GetAtt UploadBucket.Arn, !Sub "${UploadBucket.Arn}/*"]
            Condition:
              ArnNotEquals: { "aws:PrincipalArn": !Ref WebsiteTaskRoleArn }
  UploadServicePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: PrivateUploadStorage
      Roles: [!Ref WebsiteTaskRoleName]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:AbortMultipartUpload, s3:ListMultipartUploadParts]
            Resource: !Sub "${UploadBucket.Arn}/users/*"
Outputs:
  BucketName:
    Value: !Ref UploadBucket
  UserPoolId:
    Value: !Ref UploadUsers
  ClientId:
    Value: !Ref UploadClient
  CognitoDomain:
    Value: !Sub "${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  WebsiteOrigin:
    Value: !Ref WebsiteOrigin
