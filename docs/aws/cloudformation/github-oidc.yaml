# ============================================================================
# ⚠️ DISCLAIMER: This CloudFormation template has NEVER been tested or deployed.
# It is maintained as Infrastructure as Code DOCUMENTATION ONLY to reflect the
# de-facto AWS configuration. Do not assume it will work without thorough testing.
# ============================================================================

AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC provider and ECR deployment role (documentation only).

# This template sets up OpenID Connect (OIDC) authentication between GitHub Actions
# and AWS, allowing GitHub workflows to assume an IAM role without storing long-lived
# AWS credentials as secrets. Keep setup notes outside CloudFormation's 1024-character
# Description limit. The documentation-only warning above still applies.
#
# Sensitive Information Restoration:
# | Placeholder | Description | Restoration Command |
# |---|---|---|
# | `<AWS_ACCOUNT_ID>` | AWS Account ID | `aws sts get-caller-identity --query Account --output text` |
#
# GITHUB REPOSITORY SECRETS:
# | Name                | Value                                                            | Description       |
# |---------------------|------------------------------------------------------------------|-------------------|
# | AWS_DEPLOY_ROLE_ARN | arn:aws:iam::<AWS_ACCOUNT_ID>:role/GitHubActionsECRDeployRole    | IAM role for OIDC |
# | AWS_REGION          | il-central-1                                                     | AWS region        |
# | AWS_ACCOUNT_ID      | <AWS_ACCOUNT_ID>                                                 | AWS account ID    |

Parameters:
  GitHubOrg:
    Type: String
    Default: bible-on-site
    Description: GitHub organization name

  GitHubRepo:
    Type: String
    Default: bible-on-site
    Description: GitHub repository name

  # Optional: Restrict to specific branches
  # GitHubBranch:
  #   Type: String
  #   Default: '*'
  #   Description: GitHub branch pattern (e.g., 'main', 'refs/heads/main', or '*' for all)

Resources:
  # =============================================================================
  # OIDC Identity Provider for GitHub Actions
  # =============================================================================
  # This allows GitHub Actions to authenticate with AWS using OIDC tokens
  # instead of long-lived access keys
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS validates GitHub's certificate chain directly, so we use a placeholder
      # See: https://github.com/aws-actions/configure-aws-credentials#oidc-subject-claims
      ThumbprintList:
        - ffffffffffffffffffffffffffffffffffffffff
      Tags:
        - Key: Project
          Value: bible-on-site
        - Key: Purpose
          Value: github-actions-oidc

  # =============================================================================
  # IAM Policy: ECR Deploy Permissions
  # =============================================================================
  GitHubActionsECRDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: GitHubActionsECRDeployPolicy
      Description: Allows GitHub Actions to push/pull images to ECR repositories
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # ECR Authentication - required to get Docker login token
          - Sid: ECRAuth
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: "*"

          # ECR Repository Operations - scoped to specific repositories
          - Sid: ECRRepository
            Effect: Allow
            Action:
              - ecr:CreateRepository
              - ecr:DescribeRepositories
              - ecr:DescribeImages
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
            Resource:
              - !Sub "arn:aws:ecr:*:${AWS::AccountId}:repository/bible-on-site"
              - !Sub "arn:aws:ecr:*:${AWS::AccountId}:repository/bible-on-site-api"
              - !Sub "arn:aws:ecr:*:${AWS::AccountId}:repository/bible-on-site-admin"

          # ECS Service Update - force new deployment after ECR push
          - Sid: ECSServiceUpdate
            Effect: Allow
            Action:
              - ecs:UpdateService
              - ecs:DescribeServices
            Resource:
              - !Sub "arn:aws:ecs:*:${AWS::AccountId}:service/bible-on-site-cluster/bible-on-site-website"
              - !Sub "arn:aws:ecs:*:${AWS::AccountId}:service/bible-on-site-cluster/bible-on-site-api"

          # STS - allows the workflow to verify its identity
          - Sid: STSGetCallerIdentity
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
            Resource: "*"

          # SSM Parameter Store - read database connection info
          - Sid: SSMParameterStoreRead
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource:
              - !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/bible-on-site-tanah-db-*"

          # RDS - describe instances to get endpoint (host/port)
          - Sid: RDSDescribe
            Effect: Allow
            Action:
              - rds:DescribeDBInstances
            Resource:
              - !Sub "arn:aws:rds:*:${AWS::AccountId}:db:tanah-mysql"

          # S3 - upload SQL files for data deployment
          - Sid: S3DataDeploy
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !Sub "arn:aws:s3:::bible-on-site-data-deploy/*"

          # S3 - publish pre-generated calendar-PDF artifacts (#2608).
          # Object-level only, scoped to the generated/calendar-pdf/ prefix:
          # the publisher uploads content-addressed objects, verifies them,
          # then flips manifest.json. Objects are never deleted so an older
          # manifest stays roll-back-able.
          - Sid: S3CalendarPdfArtifacts
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource:
              - !Sub "arn:aws:s3:::bible-on-site-assets/generated/calendar-pdf/*"

          # Lambda - invoke data deploy function; the deployer delivers the
          # DB URL inside the invoke payload (see data-deploy/data-deploy.yaml),
          # so no lambda configuration permissions are needed here.
          - Sid: LambdaInvoke
            Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !Sub "arn:aws:lambda:*:${AWS::AccountId}:function:bible-on-site-db-populator"

          # Lambda - deploy bulletin function code and configure env vars
          - Sid: LambdaBulletinDeploy
            Effect: Allow
            Action:
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:GetFunction
            Resource:
              - !Sub "arn:aws:lambda:*:${AWS::AccountId}:function:bible-on-site-bulletin"

          # EC2 Security Groups - dynamically whitelist GitHub runner IP for RDS access during SSG build
          # Note: Both security-group and security-group-rule resources are required
          - Sid: EC2SecurityGroupSSGBuild
            Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:CreateTags
            Resource:
              - !Sub "arn:aws:ec2:*:${AWS::AccountId}:security-group/*"
              - !Sub "arn:aws:ec2:*:${AWS::AccountId}:security-group-rule/*"

  # =============================================================================
  # IAM Role: GitHub Actions ECR Deploy Role
  # =============================================================================
  GitHubActionsECRDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActionsECRDeployRole
      Description: Role assumed by GitHub Actions for ECR deployments
      MaxSessionDuration: 3600 # 1 hour
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOIDCProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # Ensure the token is intended for AWS
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Restrict to specific GitHub repository
                # Format: repo:<org>/<repo>:<branch/ref>
                # Using * allows any branch/ref in the repository
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
      ManagedPolicyArns:
        - !Ref GitHubActionsECRDeployPolicy
      # Keep the ownership read on this exact role, leaving the existing shared
      # managed policy untouched. This Describe API has no resource-level scope.
      Policies:
        - PolicyName: GitHubActionsSSGBuildRuleOwnershipRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EC2DescribeSSGBuildRuleOwnership
                Effect: Allow
                Action: ec2:DescribeSecurityGroupRules
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
      Tags:
        - Key: Project
          Value: bible-on-site
        - Key: Purpose
          Value: github-actions-ecr-deploy

  # API releases use a separate role: enforce the exact master subject in its
  # trust policy, without widening the shared role used by PR/SSG builds.
  # Preserve shared managed policy v9 and the SSG ownership-read inline policy.
  GitHubActionsAPIDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActionsAPIDeployRole
      Description: Master-only API image publication and protected task handover
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Fn::Sub: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Federated": "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
                },
                "Action": "sts:AssumeRoleWithWebIdentity",
                "Condition": {
                  "StringEquals": {
                    "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
                    "token.actions.githubusercontent.com:sub": "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/master"
                  }
                }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: bible-on-site
        - Key: Purpose
          Value: github-actions-api-deploy

  GitHubActionsAPIPublishPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: GitHubActionsAPIPublish
      Roles: [!Ref GitHubActionsAPIDeployRole]
      PolicyDocument:
        Fn::Sub: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "APIRegistryAuthentication",
                "Effect": "Allow",
                "Action": "ecr:GetAuthorizationToken",
                "Resource": "*",
                "Condition": {
                  "StringEquals": {
                    "aws:RequestedRegion": "il-central-1"
                  }
                }
              },
              {
                "Sid": "APIRepositoryPublication",
                "Effect": "Allow",
                "Action": [
                  "ecr:DescribeRepositories",
                  "ecr:DescribeImages",
                  "ecr:BatchCheckLayerAvailability",
                  "ecr:GetDownloadUrlForLayer",
                  "ecr:BatchGetImage",
                  "ecr:InitiateLayerUpload",
                  "ecr:UploadLayerPart",
                  "ecr:CompleteLayerUpload",
                  "ecr:PutImage"
                ],
                "Resource": "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/bible-on-site-api",
                "Condition": {
                  "StringEquals": {
                    "aws:RequestedRegion": "il-central-1"
                  }
                }
              }
            ]
          }

  # Task protection has cluster-task scope; the coordinator also verifies API group.
  GitHubActionsAPIHandoverPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: GitHubActionsAPIHandover
      Roles: [!Ref GitHubActionsAPIDeployRole]
      PolicyDocument:
        Fn::Sub: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "APIServiceRead",
                "Effect": "Allow",
                "Action": [
                  "ecs:DescribeServices",
                  "ecs:ListServiceDeployments"
                ],
                "Resource": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/bible-on-site-cluster/bible-on-site-api",
                "Condition": {
                  "StringEquals": {
                    "aws:RequestedRegion": "il-central-1"
                  }
                }
              },
              {
                "Sid": "APIServiceUpdate",
                "Effect": "Allow",
                "Action": "ecs:UpdateService",
                "Resource": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/bible-on-site-cluster/bible-on-site-api",
                "Condition": {
                  "StringEquals": {
                    "aws:RequestedRegion": "il-central-1"
                  },
                  "ArnLike": {
                    "ecs:task-definition": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/bible-on-site-api:*"
                  }
                }
              },
              {
                "Sid": "APIServiceRecovery",
                "Effect": "Allow",
                "Action": [
                  "ecs:DescribeServiceDeployments",
                  "ecs:DescribeServiceRevisions",
                  "ecs:StopServiceDeployment"
                ],
                "Resource": [
                  "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/bible-on-site-cluster/bible-on-site-api",
                  "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service-deployment/bible-on-site-cluster/bible-on-site-api/*",
                  "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service-revision/bible-on-site-cluster/bible-on-site-api/*"
                ],
                "Condition": {
                  "StringEquals": {
                    "aws:RequestedRegion": "il-central-1"
                  }
                }
              },
              {
                "Sid": "ClusterTaskReadAndProtection",
                "Effect": "Allow",
                "Action": [
                  "ecs:DescribeTasks",
                  "ecs:GetTaskProtection",
                  "ecs:UpdateTaskProtection"
                ],
                "Resource": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/bible-on-site-cluster/*",
                "Condition": {
                  "StringEquals": {
                    "aws:RequestedRegion": "il-central-1"
                  },
                  "ArnEquals": {
                    "ecs:cluster": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/bible-on-site-cluster"
                  }
                }
              },
              {
                "Sid": "APITagsRead",
                "Effect": "Allow",
                "Action": "ecs:ListTagsForResource",
                "Resource": [
                  "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/bible-on-site-cluster/*",
                  "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/bible-on-site-api:*"
                ],
                "Condition": {
                  "StringEquals": {
                    "aws:RequestedRegion": "il-central-1"
                  }
                }
              },
              {
                "Sid": "OwnedLeaseMarkersOnly",
                "Effect": "Allow",
                "Action": [
                  "ecs:TagResource",
                  "ecs:UntagResource"
                ],
                "Resource": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/bible-on-site-cluster/*",
                "Condition": {
                  "StringEquals": {
                    "aws:RequestedRegion": "il-central-1"
                  },
                  "ForAllValues:StringLike": {
                    "aws:TagKeys": [
                      "tanahpedia:api-handover:*"
                    ]
                  },
                  "Null": {
                    "aws:TagKeys": "false"
                  }
                }
              },
              {
                "Sid": "APIRegisterExistingSize",
                "Effect": "Allow",
                "Action": "ecs:RegisterTaskDefinition",
                "Resource": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/bible-on-site-api:*",
                "Condition": {
                  "StringEquals": {
                    "aws:RequestedRegion": "il-central-1"
                  },
                  "NumericEquals": {
                    "ecs:task-cpu": "256",
                    "ecs:task-memory": "512"
                  },
                  "ForAllValues:StringEquals": {
                    "ecs:compute-compatibility": [
                      "FARGATE"
                    ]
                  },
                  "Null": {
                    "ecs:compute-compatibility": "false"
                  }
                }
              },
              {
                "Sid": "PreserveAPIDefinitionTagsOnCreate",
                "Effect": "Allow",
                "Action": "ecs:TagResource",
                "Resource": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/bible-on-site-api:*",
                "Condition": {
                  "StringEquals": {
                    "aws:RequestedRegion": "il-central-1",
                    "ecs:CreateAction": "RegisterTaskDefinition"
                  }
                }
              },
              {
                "Sid": "ReadDefinitions",
                "Effect": "Allow",
                "Action": "ecs:DescribeTaskDefinition",
                "Resource": "*",
                "Condition": {
                  "StringEquals": {
                    "aws:RequestedRegion": "il-central-1"
                  }
                }
              },
              {
                "Sid": "ListOnlyThisCluster",
                "Effect": "Allow",
                "Action": "ecs:ListTasks",
                "Resource": "*",
                "Condition": {
                  "StringEquals": {
                    "aws:RequestedRegion": "il-central-1"
                  },
                  "ArnEquals": {
                    "ecs:cluster": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/bible-on-site-cluster"
                  }
                }
              },
              {
                "Sid": "APICloudMapRead",
                "Effect": "Allow",
                "Action": [
                  "servicediscovery:GetService",
                  "servicediscovery:ListInstances",
                  "servicediscovery:GetInstancesHealthStatus"
                ],
                "Resource": "arn:${AWS::Partition}:servicediscovery:${AWS::Region}:${AWS::AccountId}:service/srv-mgck3ttvkcu6xa72",
                "Condition": {
                  "StringEquals": {
                    "aws:RequestedRegion": "il-central-1"
                  }
                }
              },
              {
                "Sid": "APIRuleStateRead",
                "Effect": "Allow",
                "Action": "events:DescribeRule",
                "Resource": "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/ecr-push-bible-on-site-api",
                "Condition": {
                  "StringEquals": {
                    "aws:RequestedRegion": "il-central-1"
                  }
                }
              },
              {
                "Sid": "PassExistingExecutionRoleOnly",
                "Effect": "Allow",
                "Action": "iam:PassRole",
                "Resource": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ecsTaskExecutionRole",
                "Condition": {
                  "StringEquals": {
                    "iam:PassedToService": "ecs-tasks.amazonaws.com"
                  }
                }
              }
            ]
          }

Outputs:
  APIDeployRoleArn:
    Description: Master-only role for API releases
    Value: !GetAtt GitHubActionsAPIDeployRole.Arn

  OIDCProviderArn:
    Description: ARN of the GitHub OIDC Provider
    Value: !GetAtt GitHubOIDCProvider.Arn
    Export:
      Name: !Sub "${AWS::StackName}-OIDCProviderArn"

  RoleArn:
    Description: |
      ARN of the IAM Role for GitHub Actions.
      Add this to your GitHub repository secrets as AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubActionsECRDeployRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RoleArn"

  PolicyArn:
    Description: ARN of the ECR Deploy Policy
    Value: !Ref GitHubActionsECRDeployPolicy
    Export:
      Name: !Sub "${AWS::StackName}-PolicyArn"

  # =============================================================================
  # GitHub Repository Configuration
  # =============================================================================
  # After deploying this stack, configure your GitHub repository:
  #
  # 1. Go to: Repository Settings → Secrets and variables → Actions
  #
  # 2. Add these secrets:
  #    - AWS_DEPLOY_ROLE_ARN: (use the RoleArn output above)
  #    - AWS_REGION: il-central-1
  #    - AWS_ACCOUNT_ID: (run: aws sts get-caller-identity --query Account --output text)
  #
  # 3. In your GitHub Actions workflow:
  #    ```yaml
  #    - uses: aws-actions/configure-aws-credentials@v4
  #      with:
  #        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
  #        aws-region: ${{ secrets.AWS_REGION }}
  #    ```
