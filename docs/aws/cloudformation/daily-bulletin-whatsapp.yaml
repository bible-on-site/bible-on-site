AWSTemplateFormatVersion: "2010-09-09"
Description: Optional exact-parameter access for GREEN-API token injection by the existing admin ECS execution role. Does not create a secret, group, queue, or task.

Parameters:
  AdminExecutionRoleName:
    Type: String
    Default: ecsTaskExecutionRole
    AllowedPattern: "[A-Za-z0-9+=,.@_-]+"
    MaxLength: 64
    Description: Existing executionRoleArn role, not the application task role. Deploy only if this exact parameter is not already covered.

Resources:
  WhatsAppTokenInjectionPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: DailyBulletinWhatsAppTokenInjection
      Roles:
        - !Ref AdminExecutionRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadOnlyWhatsAppTokenForContainerStartup
            Effect: Allow
            Action:
              - ssm:GetParameters
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bible-on-site-whatsapp-api-token"

Outputs:
  ApiTokenParameterArn:
    Description: Operator-created SecureString ARN for the admin container's secrets valueFrom. Never a token value.
    Value: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bible-on-site-whatsapp-api-token"
  ApiTokenContainerVariable:
    Value: BULLETIN_WHATSAPP_API_TOKEN
  AdminExecutionRoleName:
    Value: !Ref AdminExecutionRoleName
