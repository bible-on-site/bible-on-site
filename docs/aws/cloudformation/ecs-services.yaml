AWSTemplateFormatVersion: "2010-09-09"
Description: "ECS Cluster, Services, Task Definitions, and Cloud Map Service Discovery Reference documentation only; not a deployed stack."

Metadata:
  Documentation: |
    ECS Cluster, Services, Task Definitions, and Cloud Map Service Discovery
    for Bible On Site project.

    ⚠️ WARNING: This template is DOCUMENTATION ONLY and has never been deployed.

    This template creates:
    - ECS Cluster (Fargate)
    - Cloud Map namespace for service discovery
    - ECS Task Execution Role with ECR and CloudWatch permissions
    - Task definitions and services

    Sensitive Information Restoration:
    | Placeholder | Description | Restoration Command |
    |---|---|---|
    | `<AWS_ACCOUNT_ID>` | AWS Account ID | `aws sts get-caller-identity --query Account --output text` |
    | `<NGINX_PUBLIC_IP>` | Nginx Public IP | `aws ec2 describe-instances --filters "Name=tag:Name,Values=nginx-router" --query "Reservations[0].Instances[0].PublicIpAddress" --output text` |
    | `<VPC_ID>` | VPC ID | `aws ec2 describe-vpcs --filters "Name=isDefault,Values=true" --query "Vpcs[0].VpcId" --output text` |
    | `<SUBNET_IDS>` | Subnet IDs | `aws ec2 describe-subnets --filters "Name=vpc-id,Values=<VPC_ID>" --query "Subnets[*].SubnetId" --output text` |
    | `<ECS_SECURITY_GROUP_ID>` | ECS Security Group ID | `aws ec2 describe-security-groups --filters "Name=group-name,Values=bible-on-site-ecs-sg" --query "SecurityGroups[0].GroupId" --output text` |

    Architecture:
    ┌─────────────────┐      ┌─────────────────────────────────────────────┐
    │  nginx (EC2)    │      │              ECS Fargate                    │
    │  <NGINX_PUBLIC_IP>│──────│  ┌─────────────────────────────────────┐    │
    │                 │      │  │  bible-on-site-website              │    │
    │  Resolves:      │      │  │  website.bible-on-site.local:3000   │    │
    │  website.bible- │      │  │  Image: ECR/bible-on-site:latest    │    │
    │  on-site.local  │      │  └─────────────────────────────────────┘    │
    │  via Cloud Map  │      │                                             │
    └─────────────────┘      │  ┌─────────────────────────────────────┐    │
                            │  │  bible-on-site-api (future)         │    │
                            │  │  api.bible-on-site.local:3003       │    │
                            │  │  Image: ECR/bible-on-site-api       │    │
                            │  └─────────────────────────────────────┘    │
                            │                                             │
                            │  ┌─────────────────────────────────────┐    │
                            │  │  bible-on-site-admin                │    │
                            │  │  admin.bible-on-site.local:3101     │    │
                            │  │  Image: ECR/bible-on-site-admin     │    │
                            │  └─────────────────────────────────────┘    │
                            └─────────────────────────────────────────────┘

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - production
      - staging

  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: <VPC_ID>
    Description: VPC ID for ECS tasks and Cloud Map

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: <SUBNET_IDS>
    Description: Subnet IDs for ECS tasks (should be in multiple AZs)

  ECSSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: <ECS_SECURITY_GROUP_ID>
    Description: Security group for ECS tasks

  AdminServiceName:
    Type: String
    Default: bible-on-site-admin
    Description: Name of the admin ECS service

  AdminCapacityProvider:
    Type: String
    Default: FARGATE_SPOT
    AllowedValues:
      - FARGATE
      - FARGATE_SPOT
    Description: Admin-only cost option; use FARGATE for on-demand recovery

  WebsiteImageUri:
    Type: String
    Default: <AWS_ACCOUNT_ID>.dkr.ecr.il-central-1.amazonaws.com/bible-on-site:latest
    Description: |
      ECR image URI for website.
      To get latest: aws ecr describe-images --repository-name bible-on-site --query "sort_by(imageDetails,&imagePushedAt)[-1].imageTags[0]" --region il-central-1

Resources:
  # =============================================================================
  # ECS Cluster
  # =============================================================================
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: bible-on-site-cluster
      # Association only; do not change shared defaults to Spot. Existing
      # launch-type website/API services remain on-demand.
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy: []
      ClusterSettings:
        - Name: containerInsights
          Value: enabled # Required for deployment/health CloudWatch alarms (see cloudwatch.yaml)
      Tags:
        - Key: Project
          Value: bible-on-site
        - Key: Environment
          Value: !Ref Environment

  # =============================================================================
  # Cloud Map Namespace (Private DNS for Service Discovery)
  # =============================================================================
  # This creates a private DNS namespace that allows services to discover
  # each other using DNS names like: website.bible-on-site.local
  ServiceDiscoveryNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: bible-on-site.local
      Vpc: !Ref VpcId
      Description: Private DNS namespace for ECS service discovery
      Properties:
        DnsProperties:
          SOA:
            TTL: 15
      Tags:
        - Key: Project
          Value: bible-on-site

  # =============================================================================
  # Cloud Map Service: Website
  # =============================================================================
  # Registers as: website.bible-on-site.local
  # nginx resolves this DNS name to get the ECS task IPs
  WebsiteServiceDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: website
      NamespaceId: !Ref ServiceDiscoveryNamespace
      Description: Service discovery for bible-on-site website
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1

  # =============================================================================
  # ECS Task Execution Role
  # =============================================================================
  # This role is used by ECS to:
  # - Pull images from ECR
  # - Write logs to CloudWatch
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecsTaskExecutionRole
      Description: ECS task execution role for pulling images and logging
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # AWS managed policy for basic ECS task execution (ECR pull, basic logging)
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        # Additional permissions for creating CloudWatch log groups
        - PolicyName: CloudWatchLogsFullAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
        # Permissions to read SSM parameters for database credentials
        # and the shared website revalidation secret.
        - PolicyName: SSMParameterReadAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bible-on-site-tanah-db-*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bible-on-site-revalidate-secret"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bible-on-site-indexnow-key"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bible-on-site-tanahpedia-revision-api-key"
      Tags:
        - Key: Project
          Value: bible-on-site

  # =============================================================================
  # Website Task Role (for application-level AWS API calls)
  # =============================================================================
  WebsiteTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bible-on-site-website-task-role
      Description: Task role for website container — allows invoking bulletin Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeBulletinLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:bible-on-site-bulletin"
      Tags:
        - Key: Project
          Value: bible-on-site
        - Key: Component
          Value: website

  # =============================================================================
  # Admin Task Role (for application-level AWS API calls)
  # =============================================================================
  AdminTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bible-on-site-admin-task-role
      Description: Task role for admin container — allows S3 access and bulletin previews
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AdminS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - arn:aws:s3:::bible-on-site-assets
                  - arn:aws:s3:::bible-on-site-assets/*
        - PolicyName: AdminBulletinPreview
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:bible-on-site-bulletin"
      Tags:
        - Key: Project
          Value: bible-on-site
        - Key: Component
          Value: admin

  # =============================================================================
  # Task Definition: Website (Next.js)
  # =============================================================================
  WebsiteTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: bible-on-site-website
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: "256" # 0.25 vCPU
      Memory: "2048" # 2 GB (reduced OOM; was 1024)
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt WebsiteTaskRole.Arn
      ContainerDefinitions:
        - Name: website
          Image: !Ref WebsiteImageUri
          Essential: true
          # 90 seconds for cached DNS requests, then 30 seconds for Next shutdown.
          StopTimeout: 120
          PortMappings:
            - ContainerPort: 3000
              HostPort: 3000
              Protocol: tcp
          # Warm each critical route bundle before ECS replaces the old task.
          # Keep these settings aligned with the website Dockerfile.
          HealthCheck:
            Command:
              - CMD-SHELL
              # Three bounded requests fit within the ten-second check timeout.
              - 'for route in api/health/ready api/recitation api/recitation/2; do curl -sf --max-time 3 "http://localhost:3000/$route" > /dev/null || exit 1; done'
            Interval: 30
            Timeout: 10
            Retries: 5
            StartPeriod: 120 # Grace period for container startup before health checks count
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/bible-on-site-website
              awslogs-create-group: "true"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            # HOSTNAME must be 0.0.0.0 so Next.js binds to all interfaces.
            # The Dockerfile ENV can be overridden by Fargate; set it explicitly here.
            - Name: HOSTNAME
              Value: "0.0.0.0"
            # NEXT_PUBLIC_ENV: Enables production features like Google Analytics
            - Name: NEXT_PUBLIC_ENV
              Value: production
            # Bulletin Lambda function name — used by AWS SDK to invoke directly
            - Name: BULLETIN_LAMBDA_NAME
              Value: bible-on-site-bulletin
            # ASSETS_BASE_URL is intentionally unset in production. Enable
            # only after an approved additive CDN rollout passes the legacy
            # S3 URL, CORS, Range and freshness checks in the cost risk audit.
          # Database credentials injected from SSM Parameter Store
          # Required for runtime database queries (dynamic pages, ISR, etc.)
          # Each parameter must exist before the task starts — see the
          # one-time prerequisites block at the bottom of this file.
          Secrets:
            - Name: DB_URL
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bible-on-site-tanah-db-url"
            # Guards POST /api/revalidate; must match the admin task's
            # REVALIDATE_SECRET (same SSM parameter).
            - Name: REVALIDATE_SECRET
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bible-on-site-revalidate-secret"
            # IndexNow ownership key: also served at /<key>.txt and used to
            # sign URL submissions. A value that fails the protocol key
            # format (8-128 [a-zA-Z0-9-]) disables the feature with a
            # warning, so a placeholder can stand in until enrollment.
            - Name: INDEXNOW_KEY
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bible-on-site-indexnow-key"
      Tags:
        - Key: Project
          Value: bible-on-site
        - Key: Component
          Value: website

  # =============================================================================
  # ECS Service: Website
  # =============================================================================
  WebsiteService:
    Type: AWS::ECS::Service
    DependsOn:
      - WebsiteServiceDiscovery
    Properties:
      ServiceName: bible-on-site-website
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref WebsiteTaskDefinition
      # Readiness and MinimumHealthyPercent retain the old task during cold loading.
      # DesiredCount: 1 still has no redundancy outside a rollout.
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref ECSSecurityGroupId
          AssignPublicIp: ENABLED # Required for pulling from ECR without NAT Gateway
      # Service Discovery - registers task IPs with Cloud Map
      ServiceRegistries:
        - RegistryArn: !GetAtt WebsiteServiceDiscovery.Arn
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: false
          Rollback: false
      EnableExecuteCommand: false
      Tags:
        - Key: Project
          Value: bible-on-site
        - Key: Component
          Value: website

  # =============================================================================
  # Cloud Map Service: API
  # =============================================================================
  # Registers as: api.bible-on-site.local
  # nginx resolves this DNS name to get the ECS task IPs
  ApiServiceDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: api
      NamespaceId: !Ref ServiceDiscoveryNamespace
      Description: Service discovery for bible-on-site API
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1

  # =============================================================================
  # Cloud Map Service: Admin
  # =============================================================================
  # Registers as: admin.bible-on-site.local
  # nginx resolves this DNS name to get the ECS task IPs
  AdminServiceDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: admin
      NamespaceId: !Ref ServiceDiscoveryNamespace
      Description: Service discovery for bible-on-site admin
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1

  # =============================================================================
  # Task Definition: API (Rust)
  # =============================================================================
  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: bible-on-site-api
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: "256" # 0.25 vCPU
      Memory: "512" # 512 MB
      # Apply only after the dual-platform latest index and completed pinned
      # x86 recovery deployment are verified; see ../api-arm64-cutover.md.
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/bible-on-site-api:latest"
          Essential: true
          PortMappings:
            - ContainerPort: 3003
              HostPort: 3003
              Protocol: tcp
          HealthCheck:
            Command:
              - CMD-SHELL
              - wget -T 2 -qO- http://127.0.0.1:3003/health/ready >/dev/null
            Interval: 5
            Timeout: 3
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/bible-on-site-api
              awslogs-create-group: "true"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: PROFILE
              Value: prod
            - Name: HOST
              Value: "0.0.0.0" # Required to accept connections from nginx
            # API reaches the website task over Cloud Map service discovery
            # to expire pedia caches after committed alias writes.
            - Name: WEBSITE_URL
              Value: http://website.bible-on-site.local:3000
          # Database credentials injected from SSM Parameter Store
          # Each parameter must exist before the task starts — see the
          # one-time prerequisites block at the bottom of this file.
          Secrets:
            - Name: DB_URL
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bible-on-site-tanah-db-url"
            # Shared with the website/admin tasks' REVALIDATE_SECRET
            # (same parameter) — the x-revalidate-secret header.
            - Name: REVALIDATE_SECRET
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bible-on-site-revalidate-secret"
            # Bearer token for the authorized Tanahpedia revision API
            # (revision submissions, family writes, alias management).
            - Name: TANAHPEDIA_REVISION_API_KEY
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bible-on-site-tanahpedia-revision-api-key"
      Tags:
        - Key: Project
          Value: bible-on-site
        - Key: Component
          Value: api

  # =============================================================================
  # Task Definition: Admin (TanStack Start)
  # =============================================================================
  AdminTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: bible-on-site-admin
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: "256" # 0.25 vCPU
      Memory: "512" # 512 MB
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt AdminTaskRole.Arn
      ContainerDefinitions:
        - Name: admin
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/bible-on-site-admin:latest"
          Essential: true
          PortMappings:
            - ContainerPort: 3101
              HostPort: 3101
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/bible-on-site-admin
              awslogs-create-group: "true"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: HOST
              Value: "0.0.0.0"
            - Name: PORT
              Value: "3101"
            - Name: S3_REGION
              Value: il-central-1
            - Name: S3_BUCKET
              Value: bible-on-site-assets
            # Keep ASSETS_BASE_URL unset, matching the website. Existing S3
            # asset URLs must remain public even after a future CDN rollout.
            # Admin reaches the website task over Cloud Map service discovery
            # (MULTIVALUE A records) to expire its content caches post-commit.
            - Name: VITE_WEBSITE_URL
              Value: http://website.bible-on-site.local:3000
          Secrets:
            - Name: DB_URL
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bible-on-site-tanah-db-url"
            # Shared with the website task's REVALIDATE_SECRET (same parameter).
            # Server-side only — never VITE_*, which Vite would inline into
            # the admin browser bundle and expose the secret.
            - Name: REVALIDATE_SECRET
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bible-on-site-revalidate-secret"
      Tags:
        - Key: Project
          Value: bible-on-site
        - Key: Component
          Value: admin

  # =============================================================================
  # ECS Service: API
  # =============================================================================
  ApiService:
    Type: AWS::ECS::Service
    DependsOn:
      - ApiServiceDiscovery
    Properties:
      ServiceName: bible-on-site-api
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref ECSSecurityGroupId
          AssignPublicIp: ENABLED # Required for pulling from ECR without NAT Gateway
      # Service Discovery - registers task IPs with Cloud Map
      ServiceRegistries:
        - RegistryArn: !GetAtt ApiServiceDiscovery.Arn
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      EnableExecuteCommand: false
      Tags:
        - Key: Project
          Value: bible-on-site
        - Key: Component
          Value: api

  # =============================================================================
  # ECS Service: Admin
  # =============================================================================
  AdminService:
    Type: AWS::ECS::Service
    DependsOn:
      - AdminServiceDiscovery
    Properties:
      ServiceName: bible-on-site-admin
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref AdminTaskDefinition
      DesiredCount: 1
      # Dorad accepts admin-only outages for savings. Apply only after the
      # atomic family-save fix is deployed and rollout/recovery checks pass.
      # Keep the shared cluster default and website/API launch types unchanged.
      CapacityProviderStrategy:
        - CapacityProvider: !Ref AdminCapacityProvider
          Weight: 1
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref ECSSecurityGroupId
          AssignPublicIp: ENABLED # Required for pulling from ECR without NAT Gateway
      ServiceRegistries:
        - RegistryArn: !GetAtt AdminServiceDiscovery.Arn
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: false
          Rollback: false
      EnableExecuteCommand: false
      Tags:
        - Key: Project
          Value: bible-on-site
        - Key: Component
          Value: admin

Outputs:
  ClusterArn:
    Description: ECS Cluster ARN
    Value: !GetAtt ECSCluster.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ClusterArn"

  ClusterName:
    Description: ECS Cluster Name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub "${AWS::StackName}-ClusterName"

  NamespaceId:
    Description: Cloud Map Namespace ID
    Value: !Ref ServiceDiscoveryNamespace
    Export:
      Name: !Sub "${AWS::StackName}-NamespaceId"

  NamespaceName:
    Description: Cloud Map Namespace DNS Name
    Value: bible-on-site.local

  WebsiteServiceArn:
    Description: ECS Website Service ARN
    Value: !Ref WebsiteService
    Export:
      Name: !Sub "${AWS::StackName}-WebsiteServiceArn"

  WebsiteServiceDiscoveryDNS:
    Description: DNS name for website service discovery
    Value: website.bible-on-site.local

  AdminServiceArn:
    Description: ECS Admin Service ARN
    Value: !Ref AdminService
    Export:
      Name: !Sub "${AWS::StackName}-AdminServiceArn"

  AdminServiceDiscoveryDNS:
    Description: DNS name for admin service discovery
    Value: admin.bible-on-site.local

  TaskExecutionRoleArn:
    Description: ECS Task Execution Role ARN
    Value: !GetAtt ECSTaskExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TaskExecutionRoleArn"
# =============================================================================
# One-time prerequisites (SecureString SSM parameters)
# =============================================================================
#
# ECS resolves every `Secrets:` ValueFrom at task start, so a missing
# parameter prevents the task (website AND admin) from starting. Create
# these parameters before deploying a stack that references them.
# CloudFormation cannot create SecureString parameters — they are provisioned
# once per account/region via CLI (same mechanism as the DB_URL parameter,
# see rds-mysql.yaml):
#
#   # Shared admin <-> website revalidation credential
#   aws ssm put-parameter --name bible-on-site-revalidate-secret \
#     --type SecureString --value "$(openssl rand -hex 32)" \
#     --region il-central-1
#
#   # IndexNow ownership key for the website's search-engine notifications.
#   # Generate the value in Bing Webmaster Tools (or any 8-128 char
#   # [a-zA-Z0-9-] string); a non-matching value disables the feature.
#   aws ssm put-parameter --name bible-on-site-indexnow-key \
#     --type SecureString --value "$(openssl rand -hex 16)" \
#     --region il-central-1
#
#   # Bearer token authorizing the Tanahpedia revision API surface on the
#   # api task (revision submits/applies, family writes, alias writes).
#   aws ssm put-parameter --name bible-on-site-tanahpedia-revision-api-key \
#     --type SecureString --value "$(openssl rand -hex 32)" \
#     --region il-central-1
#
#   # Database URL (mysql://admin:<password>@<host>:3306/tanah)
