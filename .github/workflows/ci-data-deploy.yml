name: Data Deployment Tests

on:
  pull_request:
    paths:
      - devops/deploy/data-deploy/**
      - devops/package.json
      - docs/aws/cloudformation/data-deploy/data-deploy-lambda.py
      - docs/aws/cloudformation/data-deploy/requirements.txt
      - .github/workflows/ci-data-deploy.yml
  push:
    branches: [master]
    paths:
      - devops/deploy/data-deploy/**
      - devops/package.json
      - docs/aws/cloudformation/data-deploy/data-deploy-lambda.py
      - docs/aws/cloudformation/data-deploy/requirements.txt
      - .github/workflows/ci-data-deploy.yml
  merge_group:

permissions:
  contents: read

jobs:
  # Merge groups have no path filters: the shared router decides whether the
  # combined head is docs-only and skips this validation for it (#3621).
  detect_docs:
    timeout-minutes: 10
    name: Docs-only change detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: devops/package.json
      - name: Detect docs-only change
        id: detect
        run: node devops/github/ci/determine-changes.ts
  test:
    timeout-minutes: 60
    name: Lambda restoration recovery
    needs: detect_docs
    if: ${{ needs.detect_docs.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: devops/package.json
      - name: Test data deployment recovery without AWS or database writes
        run: bun run --cwd devops test:deploy-data
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14" # Lambda runtime of bible-on-site-db-populator
      - name: Test additive migration preservation without AWS
        run: python -m unittest discover -s devops/deploy/data-deploy -p "test_*.py"
      - name: Rehearse the article fingerprint migration on MySQL 8.4
        run: python devops/deploy/data-deploy/mysql_fingerprint_regression.py
      - name: Test the packaged Lambda connector against MySQL 9.7 with TLS required
        shell: bash
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          container="lambda-mysql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; rm -rf -- "$fixture"' EXIT
          mkdir "$fixture/tls" "$fixture/package"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=mysql-fixture.test -addext subjectAltName=DNS:mysql-fixture.test \
            -keyout "$fixture/tls/server.key" -out "$fixture/tls/server.pem"
          chmod 644 "$fixture/tls/server.key"
          install -m 644 docs/aws/cloudformation/data-deploy/data-deploy-lambda.py "$fixture/package/index.py"
          cp "$fixture/tls/server.pem" "$fixture/package/rds-ca.pem"
          python -m pip install --requirement docs/aws/cloudformation/data-deploy/requirements.txt \
            --target "$fixture/package"
          docker run --detach --rm --name "$container" --publish 127.0.0.1::3306 \
            --mount "type=bind,source=$fixture/tls,target=/fixture-tls,readonly" \
            --env MYSQL_ROOT_PASSWORD=fixture-root --env MYSQL_DATABASE=lambda_test \
            --env MYSQL_USER=lambda_fixture --env MYSQL_PASSWORD=fixture-only \
            --health-cmd 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --host=127.0.0.1 --user=root --execute="SELECT 1"' \
            --health-interval 2s --health-timeout 3s --health-retries 30 \
            mysql:9.7.4 --require-secure-transport=ON --ssl-ca=/fixture-tls/server.pem \
            --ssl-cert=/fixture-tls/server.pem --ssl-key=/fixture-tls/server.key
          if ! timeout 60 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" "$1")" = healthy ]; do sleep 1; done' _ "$container"; then
            docker logs "$container"
            exit 1
          fi
          binding=$(docker port "$container" 3306/tcp)
          python devops/deploy/data-deploy/lambda_mysql_package_test.py "$fixture/package" "${binding##*:}"
