name: Perek Image Tools

on:
  pull_request:
    branches: [master]
    paths:
      - "devops/perek-images/**"
      - "package.json"
      - ".github/workflows/perek-images.yml"
  push:
    branches: [master]
    paths:
      - "devops/perek-images/**"
      - "package.json"
      - ".github/workflows/perek-images.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-images:
    name: Encode and validate images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: devops/perek-images/package.json
      - name: Restore bun store cache
        id: bun-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-perek-images-${{ hashFiles('devops/perek-images/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-perek-images-
      - run: bun install --cwd devops/perek-images --frozen-lockfile
      - name: Save bun store cache
        if: ${{ github.ref == 'refs/heads/master' && steps.bun-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
      - run: bun run --cwd devops/perek-images test
