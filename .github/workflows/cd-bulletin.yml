name: Continuous Deployment - Bulletin

on:
  repository_dispatch:
    types: [deploy-bulletin]

# Keep every dispatch; never interrupt a production write.
concurrency:
  group: ${{ github.repository }}-cd-bulletin
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    permissions:
      contents: read
      actions: read
      deployments: write
      id-token: write # Required for OIDC authentication with AWS
    runs-on: ubuntu-latest

    env:
      DEVOPS_DIRECTORY: devops
      DEVOPS_NODE_CACHE_PATH: devops/bun.lock
      DEVOPS_NODE_VERSION_FILE: devops/package.json
      MODULE_NAME: ${{ github.event.client_payload.module_name }}
      MODULE_DIRECTORY: ${{ github.event.client_payload.module_directory }}
      MODULE_VERSION: ${{ github.event.client_payload.module_version }}
      RELEASED_ARTIFACT_NAME: ${{ github.event.client_payload.released_artifact_name }}
      LAMBDA_ZIP_OUTPUT_DIR: ${{ github.event.client_payload.module_directory }}/.release
      CI_RUN_ID: ${{ github.event.client_payload.ci_run_id }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout deployment automation
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Check deployment source and freshness
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_MODULE: bulletin
        run: node devops/github/release/check-deployment.mjs

      - name: Checkout artifact source
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.guard.outputs.ref }}

      - name: Setup devops bun, Node.js and dependencies
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        id: devops-bun-cache
        uses: ./.github/actions/setup-js
        with:
          module: devops
          directory: ${{ env.DEVOPS_DIRECTORY }}

      - name: Save bun store cache
        if: ${{ steps.guard.outputs.deploy == 'true' && github.ref == 'refs/heads/master' && steps.devops-bun-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/save-bun-store
        with:
          key: ${{ steps.devops-bun-cache.outputs.cache-primary-key }}

      - name: Configure AWS Credentials (OIDC)
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare Lambda ZIP Restore
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        id: prepare_restore
        run: |
          mkdir -p "$LAMBDA_ZIP_OUTPUT_DIR"

      - name: Restore Lambda ZIP
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_FILE_ID: ${{ steps.guard.outputs.recovery_file_id }}
          RECOVERY_FILE_NAME: ${{ steps.guard.outputs.recovery_file_name }}
          RECOVERY_FILE_DIGEST: ${{ steps.guard.outputs.recovery_file_digest }}
          RECOVERY_FILE_SIZE: ${{ steps.guard.outputs.recovery_file_size }}
        run: |
          set -euo pipefail
          if [ -n "$RECOVERY_FILE_ID" ]; then
            [[ "$RECOVERY_FILE_ID" =~ ^[1-9][0-9]*$ ]]
            test "$RECOVERY_FILE_NAME" = "bulletin-lambda-v${MODULE_VERSION}.zip"
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$RECOVERY_FILE_ID" -H 'Accept: application/octet-stream' > "$LAMBDA_ZIP_OUTPUT_DIR/$RECOVERY_FILE_NAME"
            node devops/github/release/recovery-request.mjs --verify-file --file "$LAMBDA_ZIP_OUTPUT_DIR/$RECOVERY_FILE_NAME"
          else
            gh release download "bulletin-v${MODULE_VERSION}" --pattern '*.zip' --dir "$LAMBDA_ZIP_OUTPUT_DIR"
          fi

      - name: Find Lambda ZIP
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        id: find_zip
        env:
          RECOVERY_FILE_NAME: ${{ steps.guard.outputs.recovery_file_name }}
        run: |
          if [ -n "$RECOVERY_FILE_NAME" ]; then
            test "$RECOVERY_FILE_NAME" = "bulletin-lambda-v${MODULE_VERSION}.zip"
            LAMBDA_ZIP="$LAMBDA_ZIP_OUTPUT_DIR/$RECOVERY_FILE_NAME"
            test -f "$LAMBDA_ZIP"
          else
            LAMBDA_ZIP=$(find "${{ env.LAMBDA_ZIP_OUTPUT_DIR }}" -name "*.zip" | head -1)
          fi
          echo "LAMBDA_ZIP=${LAMBDA_ZIP}" >> $GITHUB_OUTPUT
          echo "Found Lambda ZIP: ${LAMBDA_ZIP}"

      - name: Deploy to Lambda
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        id: deploy
        working-directory: ${{ env.DEVOPS_DIRECTORY }}
        run: |
          bun run deploy:bulletin -- \
            --module-version "${{ env.MODULE_VERSION }}" \
            --lambda-zip "${{ github.workspace }}/${{ steps.find_zip.outputs.LAMBDA_ZIP }}"

      - name: Record deployment result
        if: ${{ always() && steps.guard.outputs.deployment_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.guard.outputs.deployment_id }}
          DEPLOYMENT_RESULT: ${{ job.status }}
        run: node "${{ runner.temp }}/deployment-state.mjs"
