name: Auto Bump Versions

# Bump every module a branch changes above both master and its latest release,
# so Verify * Version passes on branches that forgot to (Renovate never bumps
# the app or Cargo modules). Renovate cannot run this itself: Mend-hosted
# postUpgradeTasks need a self-hosted allowedCommands list. renovate.json ignores
# this commit author, so Renovate keeps rebasing its branches and this job
# re-bumps after each rebase. Fork branches are out of reach of the deploy key.
on:
  push:
    branches-ignore:
      - master
      - gh-readonly-queue/**

permissions:
  contents: read

concurrency:
  group: auto-bump-versions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump_changed_module_versions:
    name: Bump Changed Module Versions
    # Skip branch deletions and this job's own bump commits.
    if: ${{ !github.event.deleted && github.event.head_commit.author.email != 'actions@github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Deploy-key pushes trigger CI on the bumped head; GITHUB_TOKEN pushes would not.
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: devops/package.json
          cache-dependency-path: devops/package-lock.json
          cache: npm
      - name: Install devops dependencies
        working-directory: devops
        run: npm ci --no-audit --no-fund
      - name: Bump changed module versions
        working-directory: devops
        run: npm run bump:changed-modules
      - name: Commit and push version bumps
        run: |
          if git diff --quiet; then
            echo "All changed modules are already ahead of master and their releases"
            exit 0
          fi
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git commit --all -m "chore: bump versions of changed modules"
          git push origin "HEAD:$GITHUB_REF_NAME"
