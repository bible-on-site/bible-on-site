# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required, PRs introducing known-vulnerable
# packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
# Public documentation: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review#dependency-review-enforcement
name: 'Dependency review'
on:
  pull_request:
    branches: [ "master" ]

# A superseded review must not overwrite the current head's PR report.
concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# If using a dependency submission action in this workflow this permission will need to be set to:
#
# permissions:
#   contents: write
#
# https://docs.github.com/en/enterprise-cloud@latest/code-security/supply-chain-security/understanding-your-software-supply-chain/using-the-dependency-submission-api
permissions:
  contents: read
  # Write permissions for pull-requests are required for using the `comment-summary-in-pr` option, comment out if you aren't using this option
  pull-requests: write

jobs:
  nuget-snapshots:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/dependency-submission.yml
  # Reusable jobs have prefixed check names; retain the repository's PR gate.
  submit-nuget:
    needs: nuget-snapshots
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify both dependency graphs were submitted
        env:
          SUBMISSION_RESULT: ${{ needs.nuget-snapshots.result }}
        run: test "$SUBMISSION_RESULT" = success
  dependency-review:
    needs: submit-nuget
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: devops/package.json
      - name: Test dependency snapshot verification
        run: npm --prefix devops run test:dependency-snapshots
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5
        # Commonly enabled options, see https://github.com/actions/dependency-review-action#configuration-options for all available options.
        with:
          comment-summary-in-pr: always
          # Wait for GitHub to index the completed base/head submissions.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
          # flowbite-react uses npm aliases ("tailwind-merge-v2": "npm:tailwind-merge@2.6.1")
          # which install the LEGITIMATE tailwind-merge package under alias names.
          # The scanner falsely matches these alias names against known malware advisories.
          allow-dependencies-licenses: >-
            pkg:npm/tailwind-merge-v2,
            pkg:npm/tailwind-merge-v3,
            pkg:npm/%40tanstack/history,
            pkg:npm/%40tanstack/start-fn-stubs,
            pkg:npm/h3-v2,
            pkg:npm/%40asamuzakjp/css-color,
            pkg:npm/%40bramus/specificity,
            pkg:githubactions/actions/download-artifact
      # The action can finish green after its snapshot retry timeout. A green
      # review is usable only when GitHub confirms the comparison is complete.
      - name: Verify complete dependency snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEPENDENCY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm --prefix devops run verify:dependency-snapshots
