name: App Mobile E2E

on:
  workflow_call:
    inputs:
      e2e_selection_mode:
        # workflow_call inputs cannot be `choice`; only the exact value
        # "enforce" narrows the run — anything else stays the shadow report.
        description: "shadow reports the affected subset; enforce runs only it (#2085)"
        type: string
        default: shadow
      force_full_suite:
        description: "Skip coverage selection and run every applicable test"
        type: boolean
        default: false
      perushim_notes_sqlite_artifact:
        description: "Artifact name for perushim notes SQLite (empty = use master baseline)"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      e2e_selection_mode:
        description: "shadow reports the affected subset; enforce runs only it (#2085)"
        type: choice
        options: [shadow, enforce]
        default: shadow
      force_full_suite:
        description: "Skip coverage selection and run every applicable test"
        type: boolean
        default: false
      perushim_notes_sqlite_artifact:
        description: "Artifact name for perushim notes SQLite (empty = use master baseline)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  # Reads the master coverage-tree baseline artifacts through the REST API.
  actions: read

env:
  PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_MASTER: perushim-sqlite-v2-indexed.master

jobs:
  # Standalone dispatch runs get no caller-provided artifact name; fetch the
  # master baseline artifact from a previous run and re-upload it so the
  # appium job can resolve it through actions/download-artifact exactly like
  # the CI-provided artifact (mirrors app-package.yml).
  resolve_perushim_artifact:
    name: Resolve Perushim Notes Artifact
    if: ${{ inputs.perushim_notes_sqlite_artifact == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download master baseline artifact via API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="${{ env.PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_MASTER }}"
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME" \
            --jq "[.artifacts[] | select(.expired == false)] | first | .id")
          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "::error::No master baseline artifact '$ARTIFACT_NAME' found. Run perushim_data on master first."
            exit 1
          fi
          mkdir -p /tmp/$ARTIFACT_NAME
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/$ARTIFACT_NAME.zip
          unzip -o /tmp/$ARTIFACT_NAME.zip -d /tmp/$ARTIFACT_NAME

      - name: Re-upload for current workflow
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_MASTER }}
          path: /tmp/${{ env.PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_MASTER }}
          retention-days: 1
          overwrite: true

  # Android owns its original build/device job and never waits for iOS.
  android:
    name: Appium Android
    needs: [resolve_perushim_artifact]
    if: ${{ always() && !cancelled() && !failure() }}
    uses: ./.github/workflows/app-mobile-e2e-runner.yml
    with:
      platform: Android
      platform_id: android
      artifact: android
      runner: ubuntu-latest
      workload: maui-android
      mode: build-and-run
      e2e_selection_mode: ${{ inputs.e2e_selection_mode }}
      force_full_suite: ${{ inputs.force_full_suite }}
      perushim_notes_sqlite_artifact: ${{ inputs.perushim_notes_sqlite_artifact }}

  # Release-configuration startup guard (#2373): the Debug suite above can
  # never execute the analytics initialization that crashed #2247 store
  # launches — Debug compiles it out under DISABLE_ANALYTICS. This leg builds
  # the Release pipeline for the emulator ABI and cold-starts it, so the same
  # class of startup regression fails the workflow before merge and — through
  # the release job's cross_module_ci need — before an AAB can be promoted.
  # It needs no perushim/test-harness inputs, so it starts without the resolve
  # job and runs beside the Debug leg.
  android_release_smoke:
    name: Android Release startup smoke
    if: ${{ always() && !cancelled() && !failure() }}
    uses: ./.github/workflows/app-mobile-e2e-runner.yml
    with:
      platform: Android
      platform_id: android
      artifact: android-release-smoke
      runner: ubuntu-latest
      workload: maui-android
      mode: release-smoke

  # Build exactly once without a simulator competing for CPU and memory.
  build_ios:
    name: Build shared iOS app
    needs: [resolve_perushim_artifact]
    if: ${{ always() && !cancelled() && !failure() }}
    uses: ./.github/workflows/app-mobile-e2e-runner.yml
    with:
      platform: iOS
      platform_id: ios
      artifact: ios-build
      runner: xcode-27
      workload: maui-ios
      mode: build
      perushim_notes_sqlite_artifact: ${{ inputs.perushim_notes_sqlite_artifact }}

  # Selection and shard planning run exactly once, before the iOS matrix
  # expands (#2263): the planner discovers the suite statically, applies the
  # published baseline's impact map and rolling per-case runtimes, then emits
  # one bounded shard assignment per runner. Matrix legs execute the manifest
  # they are assigned — they never re-select — and a legitimately empty
  # selection produces zero shards, so no simulator starts.
  plan_ios:
    name: Plan iOS shards
    runs-on: ubuntu-latest
    outputs:
      ios-matrix: ${{ steps.matrix.outputs.matrix }}
      ios-shards: ${{ steps.matrix.outputs.ios-shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: devops/package.json
      # The published baseline carries both the impact map and the rolling
      # per-case timing history (#2263). A missing or unreadable tree means no
      # trustworthy evidence at all: selection falls back to the full suite
      # and every case is scheduled at the unmeasured weight.
      - name: Download iOS coverage and timing baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node devops/github/ci/e2e-impact/e2e-impact.ts baseline-download \
            --name "app-mobile-e2e-coverage.master.ios" \
            --out "$RUNNER_TEMP/ios-baseline"
      - name: Select affected iOS tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASELINE_ARGS=()
          if [ -f "$RUNNER_TEMP/ios-baseline/coverage-tree.json" ]; then
            BASELINE_ARGS=(--baseline "$RUNNER_TEMP/ios-baseline/coverage-tree.json")
          fi
          FORCE_ARGS=()
          if [ "${{ inputs.force_full_suite }}" == "true" ]; then
            FORCE_ARGS=(--force-full)
          fi
          # --allow-empty: today's smoke policy always selects ≥1 case, but a
          # future policy could legitimately empty the set — the ios-shards==0
          # guards on the ios/merge_ios jobs then skip the whole iOS leg.
          node devops/github/ci/e2e-impact/e2e-impact.ts select \
            --suite app/mobile-e2e \
            --platform ios \
            --tested-sha "${{ github.sha }}" \
            --out "$RUNNER_TEMP/ios-plan/selection-manifest.json" \
            --compare --allow-empty "${BASELINE_ARGS[@]}" "${FORCE_ARGS[@]}"
      - name: Plan runtime-balanced iOS shards
        run: |
          HISTORY_ARGS=()
          if [ -f "$RUNNER_TEMP/ios-baseline/coverage-tree.json" ]; then
            HISTORY_ARGS=(--history "$RUNNER_TEMP/ios-baseline/coverage-tree.json")
          fi
          node devops/github/ci/e2e-impact/e2e-impact.ts plan \
            --suite app/mobile-e2e \
            --platform ios \
            --manifest "$RUNNER_TEMP/ios-plan/selection-manifest.json" \
            --tested-sha "${{ github.sha }}" \
            --mode "${{ inputs.e2e_selection_mode }}" \
            --out "$RUNNER_TEMP/ios-plan/ios-shard-plan.json" \
            --shard-dir "$RUNNER_TEMP/ios-plan/shards" "${HISTORY_ARGS[@]}"
      - name: Emit iOS matrix
        id: matrix
        run: node app/mobile-e2e/appium-matrix.mjs "$RUNNER_TEMP/ios-plan/ios-shard-plan.json"
      - name: Upload iOS shard plan
        uses: actions/upload-artifact@v7
        with:
          name: app-mobile-e2e-plan.${{ github.run_id }}.ios
          path: ${{ runner.temp }}/ios-plan/
          retention-days: 1
          if-no-files-found: error

  ios:
    name: Appium iOS shard ${{ matrix.shard }}
    needs: [build_ios, plan_ios]
    # The job-level if is evaluated before the matrix expands, so a zero-shard
    # plan skips cleanly instead of failing on an empty matrix.
    if: ${{ always() && !cancelled() && needs.build_ios.result == 'success' && needs.plan_ios.result == 'success' && needs.plan_ios.outputs.ios-shards != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan_ios.outputs.ios-matrix) }}
    uses: ./.github/workflows/app-mobile-e2e-runner.yml
    with:
      platform: iOS
      platform_id: ios
      artifact: ios-shard${{ matrix.shard }}
      runner: xcode-27
      workload: maui-ios
      shard: ${{ matrix.shard }}
      ios_plan_artifact: app-mobile-e2e-plan.${{ github.run_id }}.ios
      mode: prebuilt-run
      e2e_selection_mode: ${{ inputs.e2e_selection_mode }}
      force_full_suite: ${{ inputs.force_full_suite }}

  merge_ios:
    name: Merge complete iOS suite
    needs: [ios, plan_ios]
    # Skips with the runner matrix on a legitimately empty plan; a failed plan
    # or a failed shard still fails the workflow before reaching this gate.
    if: ${{ always() && !cancelled() && needs.plan_ios.result == 'success' && needs.plan_ios.outputs.ios-shards != '0' && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: devops/package.json
      - name: Download iOS shard plan
        uses: actions/download-artifact@v8
        with:
          name: app-mobile-e2e-plan.${{ github.run_id }}.ios
          path: app/.artifacts/mobile-e2e/ios-plan
      # One directory per shard artifact — the merge discovers them by their
      # ios-shard<N> names and requires exactly one per planned shard.
      - name: Download iOS runner artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: app-mobile-e2e-shard.${{ github.run_id }}.ios-shard*
          path: app/.artifacts/mobile-e2e/ios-runners
      - name: Verify full disjoint suite and merge native coverage
        id: merge
        run: node app/mobile-e2e/merge-runner-shards.mjs app/.artifacts/mobile-e2e/ios "${{ github.sha }}" --inputs app/.artifacts/mobile-e2e/ios-runners --plan app/.artifacts/mobile-e2e/ios-plan/ios-shard-plan.json
      # Timing history descends from the same trusted baseline as the impact
      # map; the merge's case-timings.json and --overhead-ms roll this run's
      # observations into the tree the publish steps below write back.
      - name: Download iOS timing and coverage history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node devops/github/ci/e2e-impact/e2e-impact.ts baseline-download \
            --name "app-mobile-e2e-coverage.master.ios" \
            --out "app/.artifacts/mobile-e2e/ios-history"
      - name: Collect complete iOS test coverage tree
        run: |
          INCOMPLETE_ARGS=()
          if [ "${{ steps.merge.outputs.complete }}" != "true" ]; then
            INCOMPLETE_ARGS=(--incomplete)
          fi
          HISTORY_ARGS=()
          if [ -f "app/.artifacts/mobile-e2e/ios-history/coverage-tree.json" ]; then
            HISTORY_ARGS=(--history "app/.artifacts/mobile-e2e/ios-history/coverage-tree.json")
          fi
          OVERHEAD_ARGS=()
          if [ -n "${{ steps.merge.outputs.overhead-ms }}" ]; then
            OVERHEAD_ARGS=(--overhead-ms "${{ steps.merge.outputs.overhead-ms }}")
          fi
          node devops/github/ci/e2e-impact/e2e-impact.ts collect-appium \
            --suite app/mobile-e2e --platform ios \
            --artifacts app/.artifacts/mobile-e2e/ios --snapshot-sha "${{ github.sha }}" \
            --exec-tree app/.artifacts/mobile-e2e/ios/exec-coverage-tree.json \
            --out app/.artifacts/mobile-e2e/ios/coverage-tree.json \
            "${INCOMPLETE_ARGS[@]}" "${HISTORY_ARGS[@]}" "${OVERHEAD_ARGS[@]}"
      - name: Upload combined iOS app coverage
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-coverage.${{ github.run_id }}.ios
          path: app/.artifacts/mobile-e2e/ios/coverage-app/
          retention-days: 90
          if-no-files-found: error
      - name: Upload complete iOS suite evidence
        uses: actions/upload-artifact@v7
        with:
          name: appium-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/.artifacts/mobile-e2e/ios/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish complete iOS selector baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.merge.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-mobile-e2e-coverage.master.ios
          path: app/.artifacts/mobile-e2e/ios/coverage-tree.json
          retention-days: 90
          overwrite: true
      - name: Publish complete iOS execution baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.merge.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-mobile-e2e-exec-coverage.master.ios
          path: app/.artifacts/mobile-e2e/ios/exec-coverage-tree.json
          retention-days: 90
          overwrite: true
      - name: Publish complete iOS app coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.merge.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-coverage.master.ios
          path: app/.artifacts/mobile-e2e/ios/coverage-app/
          retention-days: 90
          overwrite: true
