name: App Mobile E2E

on:
  workflow_call:
    inputs:
      e2e_selection_mode:
        # workflow_call inputs cannot be `choice`; only the exact value
        # "enforce" narrows the run — anything else stays the shadow report.
        description: "shadow reports the affected subset; enforce runs only it (#2085)"
        type: string
        default: shadow
      force_full_suite:
        description: "Skip coverage selection and run every applicable test"
        type: boolean
        default: false
      perushim_notes_sqlite_artifact:
        description: "Artifact name for perushim notes SQLite (empty = use master baseline)"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      e2e_selection_mode:
        description: "shadow reports the affected subset; enforce runs only it (#2085)"
        type: choice
        options: [shadow, enforce]
        default: shadow
      force_full_suite:
        description: "Skip coverage selection and run every applicable test"
        type: boolean
        default: false
      perushim_notes_sqlite_artifact:
        description: "Artifact name for perushim notes SQLite (empty = use master baseline)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  # The runner jobs fetch master baseline artifacts through the REST API.
  actions: read

jobs:
  # Android splits across planned emulator legs (#2263) and never waits for
  # iOS. Each leg builds its own app beside its own emulator and keeps the
  # fixed 15-minute pilot deadline, so the plan sizes legs to fit it: one
  # serial leg outgrew that deadline on slower runners.
  plan_android:
    timeout-minutes: 60
    name: Plan Android shards
    if: ${{ always() && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: devops/package.json
      - name: Plan Android shards
        id: plan
        uses: ./.github/actions/plan-appium-shards
        with:
          platform-id: android
          mode: ${{ inputs.e2e_selection_mode }}
          force-full-suite: ${{ inputs.force_full_suite }}
          max-shards: 2
          target-minutes: 6

  android:
    name: Appium Android shard ${{ matrix.shard }}
    needs: [plan_android]
    if: ${{ always() && !cancelled() && needs.plan_android.result == 'success' && needs.plan_android.outputs.shards != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan_android.outputs.matrix) }}
    uses: ./.github/workflows/app-mobile-e2e-runner.yml
    with:
      platform: Android
      platform_id: android
      artifact: android-shard${{ matrix.shard }}
      runner: ubuntu-latest
      workload: maui-android
      shard: ${{ matrix.shard }}
      shard_plan_artifact: app-mobile-e2e-plan.${{ github.run_id }}.android
      mode: build-and-run
      e2e_selection_mode: ${{ inputs.e2e_selection_mode }}
      force_full_suite: ${{ inputs.force_full_suite }}
      perushim_notes_sqlite_artifact: ${{ inputs.perushim_notes_sqlite_artifact }}

  merge_android:
    timeout-minutes: 60
    name: Merge complete Android suite
    needs: [android, plan_android]
    # Skips with the emulator matrix on a legitimately empty plan; a failed
    # plan or a failed shard still fails the workflow before reaching this.
    if: ${{ always() && !cancelled() && needs.plan_android.result == 'success' && needs.plan_android.outputs.shards != '0' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: devops/package.json
      - name: Merge Android shards
        uses: ./.github/actions/merge-appium-shards
        with:
          platform-id: android

  # In-process device-test layer (#3349): XHarness drives the dedicated test
  # app's instrumentation on the same emulator recipe — real handlers, XAML
  # inflation, RTL layout, platform services and UI-thread behavior at unit
  # speed. Additive to Appium, which keeps every packaged-app journey.
  android_device_tests:
    name: XHarness Android device tests
    if: ${{ always() && !cancelled() && !failure() }}
    uses: ./.github/workflows/app-mobile-e2e-runner.yml
    with:
      platform: Android
      platform_id: android
      artifact: android-device-tests
      runner: ubuntu-latest
      workload: maui-android
      mode: device-tests

  # Release-configuration startup guard (#2373): the Debug suite above can
  # never execute the analytics initialization that crashed #2247 store
  # launches — Debug compiles it out under DISABLE_ANALYTICS. This leg builds
  # the Release pipeline for the emulator ABI and cold-starts it, so the same
  # class of startup regression fails the workflow before merge and — through
  # the release job's cross_module_ci need — before an AAB can be promoted.
  # It needs no perushim/test-harness inputs, so it runs beside the Debug leg.
  android_release_smoke:
    name: Android Release startup smoke
    if: ${{ always() && !cancelled() && !failure() }}
    uses: ./.github/workflows/app-mobile-e2e-runner.yml
    with:
      platform: Android
      platform_id: android
      artifact: android-release-smoke
      runner: ubuntu-latest
      workload: maui-android
      mode: release-smoke

  # Build exactly once without a simulator competing for CPU and memory.
  build_ios:
    name: Build shared iOS app
    if: ${{ always() && !cancelled() && !failure() }}
    uses: ./.github/workflows/app-mobile-e2e-runner.yml
    with:
      platform: iOS
      platform_id: ios
      artifact: ios-build
      runner: xcode-27
      workload: maui-ios
      mode: build
      perushim_notes_sqlite_artifact: ${{ inputs.perushim_notes_sqlite_artifact }}

  # Selection and shard planning run exactly once, before the iOS matrix
  # expands (#2263); see .github/actions/plan-appium-shards.
  plan_ios:
    timeout-minutes: 60
    name: Plan iOS shards
    runs-on: ubuntu-latest
    outputs:
      ios-matrix: ${{ steps.plan.outputs.matrix }}
      ios-shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: devops/package.json
      - name: Plan iOS shards
        id: plan
        uses: ./.github/actions/plan-appium-shards
        with:
          platform-id: ios
          mode: ${{ inputs.e2e_selection_mode }}
          force-full-suite: ${{ inputs.force_full_suite }}
          max-shards: 4
          target-minutes: 26

  ios:
    name: Appium iOS shard ${{ matrix.shard }}
    needs: [build_ios, plan_ios]
    # The job-level if is evaluated before the matrix expands, so a zero-shard
    # plan skips cleanly instead of failing on an empty matrix.
    if: ${{ always() && !cancelled() && needs.build_ios.result == 'success' && needs.plan_ios.result == 'success' && needs.plan_ios.outputs.ios-shards != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan_ios.outputs.ios-matrix) }}
    uses: ./.github/workflows/app-mobile-e2e-runner.yml
    with:
      platform: iOS
      platform_id: ios
      artifact: ios-shard${{ matrix.shard }}
      runner: xcode-27
      workload: maui-ios
      shard: ${{ matrix.shard }}
      shard_plan_artifact: app-mobile-e2e-plan.${{ github.run_id }}.ios
      mode: prebuilt-run
      e2e_selection_mode: ${{ inputs.e2e_selection_mode }}
      force_full_suite: ${{ inputs.force_full_suite }}

  merge_ios:
    timeout-minutes: 60
    name: Merge complete iOS suite
    needs: [ios, plan_ios]
    # Skips with the runner matrix on a legitimately empty plan; a failed plan
    # or a failed shard still fails the workflow before reaching this gate.
    if: ${{ always() && !cancelled() && needs.plan_ios.result == 'success' && needs.plan_ios.outputs.ios-shards != '0' && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: devops/package.json
      - name: Merge iOS shards
        uses: ./.github/actions/merge-appium-shards
        with:
          platform-id: ios
