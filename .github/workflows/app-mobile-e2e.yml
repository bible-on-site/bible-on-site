name: App Mobile E2E

on:
  workflow_call:
    inputs:
      e2e_selection_mode:
        # workflow_call inputs cannot be `choice`; only the exact value
        # "enforce" narrows the run — anything else stays the shadow report.
        description: "shadow reports the affected subset; enforce runs only it (#2085)"
        type: string
        default: shadow
      force_full_suite:
        description: "Skip coverage selection and run every applicable test"
        type: boolean
        default: false
      perushim_notes_sqlite_artifact:
        description: "Artifact name for perushim notes SQLite (empty = use master baseline)"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      e2e_selection_mode:
        description: "shadow reports the affected subset; enforce runs only it (#2085)"
        type: choice
        options: [shadow, enforce]
        default: shadow
      force_full_suite:
        description: "Skip coverage selection and run every applicable test"
        type: boolean
        default: false
      perushim_notes_sqlite_artifact:
        description: "Artifact name for perushim notes SQLite (empty = use master baseline)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  # Reads the master coverage-tree baseline artifacts through the REST API.
  actions: read

env:
  PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_MASTER: perushim-sqlite-v2-indexed.master

jobs:
  # Standalone dispatch runs get no caller-provided artifact name; fetch the
  # master baseline artifact from a previous run and re-upload it so the
  # appium job can resolve it through actions/download-artifact exactly like
  # the CI-provided artifact (mirrors app-package.yml).
  resolve_perushim_artifact:
    name: Resolve Perushim Notes Artifact
    if: ${{ inputs.perushim_notes_sqlite_artifact == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download master baseline artifact via API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="${{ env.PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_MASTER }}"
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME" \
            --jq "[.artifacts[] | select(.expired == false)] | first | .id")
          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "::error::No master baseline artifact '$ARTIFACT_NAME' found. Run perushim_data on master first."
            exit 1
          fi
          mkdir -p /tmp/$ARTIFACT_NAME
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/$ARTIFACT_NAME.zip
          unzip -o /tmp/$ARTIFACT_NAME.zip -d /tmp/$ARTIFACT_NAME

      - name: Re-upload for current workflow
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_MASTER }}
          path: /tmp/${{ env.PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_MASTER }}
          retention-days: 1
          overwrite: true

  # Android owns its original build/device job and never waits for iOS.
  android:
    name: Appium Android
    needs: [resolve_perushim_artifact]
    if: ${{ always() && !cancelled() && !failure() }}
    uses: ./.github/workflows/app-mobile-e2e-runner.yml
    with:
      platform: Android
      platform_id: android
      artifact: android
      runner: ubuntu-latest
      workload: maui-android
      mode: build-and-run
      e2e_selection_mode: ${{ inputs.e2e_selection_mode }}
      force_full_suite: ${{ inputs.force_full_suite }}
      perushim_notes_sqlite_artifact: ${{ inputs.perushim_notes_sqlite_artifact }}

  # Build exactly once without a simulator competing for CPU and memory.
  build_ios:
    name: Build shared iOS app
    needs: [resolve_perushim_artifact]
    if: ${{ always() && !cancelled() && !failure() }}
    uses: ./.github/workflows/app-mobile-e2e-runner.yml
    with:
      platform: iOS
      platform_id: ios
      artifact: ios-build
      runner: xcode-27
      workload: maui-ios
      mode: build
      perushim_notes_sqlite_artifact: ${{ inputs.perushim_notes_sqlite_artifact }}

  ios:
    name: Appium iOS shard ${{ matrix.shard }}
    needs: [build_ios]
    if: ${{ always() && !cancelled() && needs.build_ios.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3"]
    uses: ./.github/workflows/app-mobile-e2e-runner.yml
    with:
      platform: iOS
      platform_id: ios
      artifact: ios-shard${{ matrix.shard }}
      workload: maui-ios
      shard: ${{ matrix.shard }}
      mode: prebuilt-run
      e2e_selection_mode: ${{ inputs.e2e_selection_mode }}
      force_full_suite: ${{ inputs.force_full_suite }}
      runner: namespace-profile-mac-os

  merge_ios:
    name: Merge complete iOS suite
    needs: [ios]
    # The optional resolver may be skipped even when all Appium legs pass.
    if: ${{ always() && !cancelled() && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: devops/package.json
      - name: Download first iOS runner
        uses: actions/download-artifact@v8
        with:
          name: app-mobile-e2e-shard.${{ github.run_id }}.ios-shard1
          path: app/.artifacts/mobile-e2e/ios/shard1
      - name: Download second iOS runner
        uses: actions/download-artifact@v8
        with:
          name: app-mobile-e2e-shard.${{ github.run_id }}.ios-shard2
          path: app/.artifacts/mobile-e2e/ios/shard2
      - name: Download third iOS runner
        uses: actions/download-artifact@v8
        with:
          name: app-mobile-e2e-shard.${{ github.run_id }}.ios-shard3
          path: app/.artifacts/mobile-e2e/ios/shard3
      - name: Verify full disjoint suite and merge native coverage
        id: merge
        run: node app/mobile-e2e/merge-runner-shards.mjs app/.artifacts/mobile-e2e/ios "${{ github.sha }}" "${{ inputs.e2e_selection_mode }}"
      - name: Collect complete iOS test coverage tree
        run: |
          INCOMPLETE_ARGS=()
          if [ "${{ steps.merge.outputs.complete }}" != "true" ]; then
            INCOMPLETE_ARGS=(--incomplete)
          fi
          node devops/github/ci/e2e-impact/e2e-impact.ts collect-appium \
            --suite app/mobile-e2e --platform ios \
            --artifacts app/.artifacts/mobile-e2e/ios --snapshot-sha "${{ github.sha }}" \
            --exec-tree app/.artifacts/mobile-e2e/ios/exec-coverage-tree.json \
            --out app/.artifacts/mobile-e2e/ios/coverage-tree.json "${INCOMPLETE_ARGS[@]}"
      - name: Upload combined iOS app coverage
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-coverage.${{ github.run_id }}.ios
          path: app/.artifacts/mobile-e2e/ios/coverage-app/
          retention-days: 90
          if-no-files-found: error
      - name: Upload complete iOS suite evidence
        uses: actions/upload-artifact@v7
        with:
          name: appium-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/.artifacts/mobile-e2e/ios/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish complete iOS selector baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.merge.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-mobile-e2e-coverage.master.ios
          path: app/.artifacts/mobile-e2e/ios/coverage-tree.json
          retention-days: 90
          overwrite: true
      - name: Publish complete iOS execution baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.merge.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-mobile-e2e-exec-coverage.master.ios
          path: app/.artifacts/mobile-e2e/ios/exec-coverage-tree.json
          retention-days: 90
          overwrite: true
      - name: Publish complete iOS app coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.merge.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-coverage.master.ios
          path: app/.artifacts/mobile-e2e/ios/coverage-app/
          retention-days: 90
          overwrite: true
