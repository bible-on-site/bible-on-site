name: Continuous Deployment - App

on:
  repository_dispatch:
    types: [deploy-app]
  workflow_dispatch:
    inputs:
      ios_artifact_name:
        description: "iOS artifact name (e.g., app-ios-v4.0.35)"
        required: false
        type: string
      ci_run_id:
        description: "CI run ID that created the artifact"
        required: false
        type: string
      inspect_ios_build:
        description: "Read the exact Apple build state without deploying"
        required: false
        default: false
        type: boolean

# Keep every dispatch; never interrupt a production write.
concurrency:
  group: ${{ github.repository }}-cd-app
  cancel-in-progress: false
  queue: max

jobs:
  deploy_google_play:
    name: Deploy to Google Play (Internal Track)
    if: ${{ github.event.client_payload.android_artifact_name != '' }}
    permissions:
      contents: read
      actions: read
      deployments: write
    runs-on: ubuntu-latest

    env:
      MODULE_VERSION: ${{ github.event.client_payload.module_version }}
      ANDROID_ARTIFACT_NAME: ${{ github.event.client_payload.android_artifact_name }}
      CI_RUN_ID: ${{ github.event.client_payload.ci_run_id }}
      APP_DIRECTORY: app

    steps:
      - name: Checkout deployment automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Check deployment source and freshness
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_MODULE: app
          DEPLOY_TARGET: app-android
        run: node devops/github/release/check-deployment.mjs

      - name: Checkout artifact source
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.guard.outputs.ref }}

      - name: Restore Android AAB
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "app-v${{ env.MODULE_VERSION }}" --pattern "*.aab" --dir "${{ env.APP_DIRECTORY }}/.artifacts"

      - name: Find AAB file
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        id: find_aab
        run: |
          AAB_FILE=$(find ${{ env.APP_DIRECTORY }}/.artifacts -name "*.aab" | head -1)
          if [ -z "$AAB_FILE" ]; then
            echo "Error: No AAB file found"
            exit 1
          fi
          # NUKE requires absolute paths
          AAB_FILE=$(realpath "$AAB_FILE")
          echo "AAB_FILE=$AAB_FILE" >> $GITHUB_OUTPUT
          echo "Found AAB: $AAB_FILE"

      - name: Setup .NET
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Write service account key
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        run: |
          echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > ${{ runner.temp }}/service-account.json

      - name: Restore dotnet tools
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        working-directory: ${{ env.APP_DIRECTORY }}
        run: dotnet tool restore

      - name: Upload to Google Play
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        working-directory: ${{ env.APP_DIRECTORY }}
        run: |
          dotnet run --project devops -- DeployGooglePlay \
            --aab-path "${{ steps.find_aab.outputs.AAB_FILE }}" \
            --google-play-key-file "${{ runner.temp }}/service-account.json"

      - name: Record deployment result
        if: ${{ always() && steps.guard.outputs.deployment_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.guard.outputs.deployment_id }}
          DEPLOYMENT_RESULT: ${{ job.status }}
        run: node "${{ runner.temp }}/deployment-state.mjs"

      - name: Cleanup
        if: ${{ always() && steps.guard.outputs.deploy == 'true' }}
        run: rm -f ${{ runner.temp }}/service-account.json

      - name: Deployment Summary
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        run: |
          echo "## Android Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ env.MODULE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Track:** Internal" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Deployed ✅" >> $GITHUB_STEP_SUMMARY

  deploy_microsoft_store:
    name: Deploy to Microsoft Store
    if: ${{ github.event.client_payload.windows_artifact_name != '' }}
    permissions:
      contents: read
      actions: read
      deployments: write
    runs-on: windows-latest

    env:
      MODULE_VERSION: ${{ github.event.client_payload.module_version }}
      WINDOWS_ARTIFACT_NAME: ${{ github.event.client_payload.windows_artifact_name }}
      CI_RUN_ID: ${{ github.event.client_payload.ci_run_id }}
      APP_DIRECTORY: app

    steps:
      - name: Checkout deployment automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Check deployment source and freshness
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_MODULE: app
          DEPLOY_TARGET: app-windows
        run: node devops/github/release/check-deployment.mjs

      - name: Checkout artifact source
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.guard.outputs.ref }}

      - name: Restore Windows MSIX
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "app-v${{ env.MODULE_VERSION }}" --pattern "BibleOnSite*.msix" --dir "${{ env.APP_DIRECTORY }}/.artifacts"

      - name: Find MSIX file
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        id: find_msix
        shell: pwsh
        run: |
          # Find the app MSIX (not dependencies like WindowsAppRuntime)
          $msixFiles = Get-ChildItem -Path "${{ env.APP_DIRECTORY }}/.artifacts" -Recurse -Include "BibleOnSite*.msix","BibleOnSite*.msixupload" | Select-Object -First 1
          if (-not $msixFiles) {
            Write-Error "No app MSIX file found"
            Get-ChildItem -Path "${{ env.APP_DIRECTORY }}/.artifacts" -Recurse -Include "*.msix*"
            exit 1
          }
          $msixPath = $msixFiles.FullName
          "MSIX_FILE=$msixPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Found MSIX: $msixPath"

      - name: Setup .NET
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Microsoft Store Developer CLI
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        uses: microsoft/setup-msstore-cli@v1

      - name: Configure Microsoft Store Developer CLI
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.MS_STORE_TENANT_ID }} `
            --sellerId ${{ secrets.MS_STORE_SELLER_ID }} `
            --clientId ${{ secrets.MS_STORE_CLIENT_ID }} `
            --clientSecret ${{ secrets.MS_STORE_CLIENT_SECRET }}

      - name: Restore dotnet tools
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        working-directory: ${{ env.APP_DIRECTORY }}
        run: dotnet tool restore

      - name: Upload to Microsoft Store
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        working-directory: ${{ env.APP_DIRECTORY }}
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        run: |
          # Create a new flight for each deployment (avoids issues with Partner Center-created submissions)
          # MaxFlightsToKeep=15 ensures we stay well under the 25 flight limit
          dotnet run --project devops -- DeployMsStore `
            --msix-path "${{ steps.find_msix.outputs.MSIX_FILE }}" `
            --ms-store-flight-group-id "${{ secrets.MS_STORE_FLIGHT_GROUP_ID }}" `
            --max-flights-to-keep 15

      - name: Record deployment result
        if: ${{ always() && steps.guard.outputs.deployment_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.guard.outputs.deployment_id }}
          DEPLOYMENT_RESULT: ${{ job.status }}
        run: node "${{ runner.temp }}/deployment-state.mjs"

      - name: Deployment Summary
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        shell: pwsh
        run: |
          "## Windows Deployment Summary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "**Version:** ${{ env.MODULE_VERSION }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "**Target:** Microsoft Store (Internal Flight)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "**Status:** Submitted ✅" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  deploy_app_store:
    name: Deploy to App Store (TestFlight)
    if: ${{ (github.event.client_payload.ios_artifact_name != '' || inputs.ios_artifact_name != '') && !inputs.inspect_ios_build }}
    permissions:
      contents: read
      actions: read
      deployments: write
    runs-on: macos-15

    env:
      MODULE_VERSION: ${{ github.event.client_payload.module_version || '0.0.0' }}
      IOS_ARTIFACT_NAME: ${{ github.event.client_payload.ios_artifact_name || inputs.ios_artifact_name }}
      CI_RUN_ID: ${{ github.event.client_payload.ci_run_id || inputs.ci_run_id }}
      APP_DIRECTORY: app

    steps:
      - name: Checkout deployment automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Check deployment source and freshness
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_MODULE: app
          DEPLOY_TARGET: app-ios
        run: node devops/github/release/check-deployment.mjs

      - name: Preserve TestFlight recovery automation
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        run: cp devops/github/release/testflight-build.mjs "$RUNNER_TEMP/testflight-build.mjs"

      - name: Checkout artifact source
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.guard.outputs.ref }}

      - name: Restore iOS IPA
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "app-v${{ env.MODULE_VERSION }}" --pattern "*.ipa" --dir "${{ env.APP_DIRECTORY }}/.artifacts"

      - name: Find IPA file
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        id: find_ipa
        run: |
          IPA_FILE=$(find ${{ env.APP_DIRECTORY }}/.artifacts -name "*.ipa" | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "Error: No IPA file found"
            exit 1
          fi
          IPA_FILE=$(realpath "$IPA_FILE")
          echo "IPA_FILE=$IPA_FILE" >> $GITHUB_OUTPUT
          echo "Found IPA: $IPA_FILE"

      - name: Setup App Store Connect API Key
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          mkdir -p $HOME/private_keys
          # Decode the .p8 key file
          echo -n "$API_KEY_BASE64" | base64 --decode > $HOME/private_keys/AuthKey_${API_KEY_ID}.p8
          # Create JSON file that Fastlane expects
          cat > $HOME/private_keys/api_key.json << EOF
          {
            "key_id": "${API_KEY_ID}",
            "issuer_id": "${API_ISSUER_ID}",
            "key": "$(cat $HOME/private_keys/AuthKey_${API_KEY_ID}.p8 | sed 's/$/\\n/' | tr -d '\n')",
            "in_house": false
          }
          EOF
          echo "API_KEY_PATH=$HOME/private_keys/api_key.json" >> $GITHUB_ENV

      - name: Install Fastlane
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        run: gem install fastlane -NV

      - name: Check the exact TestFlight build before uploading
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        id: testflight
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_FILE: ${{ steps.find_ipa.outputs.IPA_FILE }}
          ARTIFACT_REF: ${{ steps.guard.outputs.ref }}
          DEPLOYMENT_ID: ${{ steps.guard.outputs.deployment_id }}
        run: node "$RUNNER_TEMP/testflight-build.mjs" preflight

      - name: Upload the missing TestFlight build once
        if: ${{ steps.guard.outputs.deploy == 'true' && steps.testflight.outputs.upload == 'true' }}
        id: upload
        env:
          IPA_FILE: ${{ steps.find_ipa.outputs.IPA_FILE }}
        run: |
          set +e
          fastlane pilot upload --ipa "$IPA_FILE" --api_key_path "$API_KEY_PATH" \
            --skip_submission true --skip_waiting_for_build_processing true
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Apple's API check below decides whether the exact build was accepted.
          exit 0

      - name: Verify Apple accepted and processed the exact build
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        env:
          IPA_FILE: ${{ steps.find_ipa.outputs.IPA_FILE }}
          UPLOAD_EXIT_CODE: ${{ steps.upload.outputs.exit_code || '0' }}
        run: node "$RUNNER_TEMP/testflight-build.mjs" postflight

      # Upload success remains independent of external submission limits (#1183).
      - name: Distribute the verified TestFlight build to the beta group
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        env:
          TESTFLIGHT_BETA_GROUP: ${{ secrets.TESTFLIGHT_BETA_GROUP_NAME }}
          APP_IDENTIFIER: ${{ steps.testflight.outputs.app_identifier }}
          APP_VERSION: ${{ steps.testflight.outputs.app_version }}
          BUILD_NUMBER: ${{ steps.testflight.outputs.build_number }}
        run: |
          if ! fastlane pilot distribute \
            --api_key_path "$API_KEY_PATH" \
            --app_identifier "$APP_IDENTIFIER" --app_version "$APP_VERSION" --build_number "$BUILD_NUMBER" \
            --distribute_external true --groups "$TESTFLIGHT_BETA_GROUP" \
            --beta_app_description "בכ\"ט כסלו תשע\"ה(21 דצמ' 14) התחילה תכנית לימוד תנ\"ך יומי של משרד החינוך, פרק ליום. כחודש לאחר מכן עלה לרשת אתר לימוד תנך באותו פורמט אשר מתעדכן מיום ליום במאמרים של רבנים. כמו כן יש רעיונות נוספים שעתידים להתחדש, תעקבו אחרינו! לימוד פורה, תנך.co.il" \
            --beta_app_feedback_email "tanah.site@gmail.com" \
            --beta_app_review_info '{"contact_email":"tanah.site@gmail.com","contact_first_name":"Dorad","contact_last_name":"Levinshtein","contact_phone":"+372 5707 8640"}' \
            --changelog "Automated build v${{ env.MODULE_VERSION }}"; then
            echo "::warning::The exact build was uploaded and processed; external distribution failed and may need manual recovery (#1183)"
          fi

      - name: Record deployment result
        if: ${{ always() && steps.guard.outputs.deployment_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.guard.outputs.deployment_id }}
          DEPLOYMENT_RESULT: ${{ job.status }}
        run: node "${{ runner.temp }}/deployment-state.mjs"

      - name: Cleanup
        if: ${{ always() && steps.guard.outputs.deploy == 'true' }}
        run: rm -rf $HOME/private_keys

      - name: Deployment Summary
        if: ${{ steps.guard.outputs.deploy == 'true' }}
        run: |
          echo "## iOS Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ env.MODULE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** TestFlight" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Uploaded ✅" >> $GITHUB_STEP_SUMMARY

  inspect_app_store:
    if: ${{ inputs.inspect_ios_build }}
    permissions:
      contents: read
    uses: ./.github/workflows/testflight-status.yml
    with:
      ios_artifact_name: ${{ inputs.ios_artifact_name }}
    secrets: inherit
