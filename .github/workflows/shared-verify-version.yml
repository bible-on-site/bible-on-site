name: Shared Version Verification
on:
  workflow_call:
    inputs:
      module_name:
        description: "Module name (app, website, api)"
        required: true
        type: string

permissions:
  contents: read

env:
  DEVOPS_DIRECTORY: devops

jobs:
  verify:
    name: Verify Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags origin

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: devops/package.json

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-devops-${{ hashFiles('devops/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-devops-

      - name: Install dependencies
        working-directory: ${{ env.DEVOPS_DIRECTORY }}
        run: npm ci --no-audit

      - name: Save npm cache
        if: ${{ github.ref == 'refs/heads/master' && steps.npm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Test version verification
        working-directory: ${{ env.DEVOPS_DIRECTORY }}
        run: npm run test:version

      - name: Verify version
        working-directory: ${{ env.DEVOPS_DIRECTORY }}
        env:
          MODULE_NAME: ${{ inputs.module_name }}
        # PR and merge-queue runs must also exceed the version they merge onto
        # (origin/master or the merge-queue base); see againstRefForEvent.
        run: npm run verify-version -- --module "$MODULE_NAME"
