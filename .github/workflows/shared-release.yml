name: Shared Release Flow
on:
  workflow_call:
    inputs:
      module_name:
        description: Short module name (website, api, app)
        required: true
        type: string
      module_directory:
        description: Module directory path (e.g., web/bible-on-site, web/api, app)
        required: true
        type: string
      module_version:
        description: The version of the module
        required: true
        type: string
      artifacts_json:
        description: |
          JSON array of artifacts to download and attach to the release.
          Each artifact object should have:
            - name: artifact name to download (empty names are skipped)
            - path: directory to download artifact to
            - glob: file pattern for release attachment
            - label: (optional) human-readable label for release notes
            - cd_key: (optional) key name for CD payload, defaults to artifact name
          Example: [{"name": "my-artifact", "path": ".artifacts", "glob": "**/*.zip", "label": "Windows", "cd_key": "windows_artifact_name"}]
        required: true
        type: string
      cd_event_type:
        description: Event type for the CD workflow trigger (e.g., deploy-aws, deploy-app)
        required: true
        type: string
    outputs:
      released:
        description: Whether the module was successfully released (for version bump coordination)
        value: ${{ jobs.release.outputs.released }}
      needs_bump:
        description: Whether the module needs a retry version bump on master
        value: ${{ jobs.release.outputs.needs_bump }}
    secrets:
      DEPLOY_KEY:
        required: true
      BOT_PAT:
        required: true

permissions:
  contents: write
  actions: read

jobs:
  trigger_cd:
    name: Trigger CD Workflow
    needs: release
    # A rerun or overlapping CI build may have packaged an already released
    # version. Only deploy the exact tag commit, including interrupted-release recovery.
    if: ${{ needs.release.outputs.released == 'true' && needs.release.outputs.cd_payload != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CD Workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.BOT_PAT }}
          event-type: ${{ inputs.cd_event_type }}
          client-payload: ${{ needs.release.outputs.cd_payload }}

  release:
    name: Release
    outputs:
      released: ${{ steps.mark_released.outputs.released }}
      needs_bump: ${{ steps.check_tag.outputs.NEEDS_BUMP }}
      cd_payload: ${{ steps.mark_released.outputs.CD_PAYLOAD }}
    # Queue (don't cancel) concurrent releases for the same module so that
    # checking and creating the version tag is serialized.
    concurrency:
      group: ${{ github.repository }}-release-${{ inputs.module_name }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Setup release Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: devops/package.json

      - name: Build CD Payload
        id: build_payload
        run: |
          ARTIFACTS='${{ inputs.artifacts_json }}'

          # Start with base payload
          PAYLOAD=$(jq -n \
            --arg ref "${{ github.sha }}" \
            --arg module_name "${{ inputs.module_name }}" \
            --arg module_directory "${{ inputs.module_directory }}" \
            --arg module_version "${{ inputs.module_version }}" \
            --arg ci_run_id "${{ github.run_id }}" \
            --arg ci_run_attempt "${{ github.run_attempt }}" \
            '{ref: $ref, module_name: $module_name, module_directory: $module_directory, module_version: $module_version, ci_run_id: $ci_run_id, ci_run_attempt: $ci_run_attempt}')

          # Add artifact names to payload using cd_key or default key
          while read -r artifact; do
            NAME=$(echo "$artifact" | jq -r '.name // empty')
            CD_KEY=$(echo "$artifact" | jq -r '.cd_key // empty')

            # Skip empty artifacts
            if [ -z "$NAME" ] || [ "$NAME" = "null" ]; then
              continue
            fi

            # Use cd_key if provided, otherwise use a sanitized version of the name or "released_artifact_name" as default
            if [ -z "$CD_KEY" ] || [ "$CD_KEY" = "null" ]; then
              # For single artifact releases, use "released_artifact_name"
              ARTIFACT_COUNT=$(echo "$ARTIFACTS" | jq '[.[] | select(.name != null and .name != "")] | length')
              if [ "$ARTIFACT_COUNT" -eq 1 ]; then
                CD_KEY="released_artifact_name"
              else
                # Sanitize name: replace dashes/dots with underscores
                CD_KEY=$(echo "$NAME" | sed 's/[-.]/_/g')
              fi
            fi

            PAYLOAD=$(echo "$PAYLOAD" | jq --arg key "$CD_KEY" --arg val "$NAME" '. + {($key): $val}')
          done < <(echo "$ARTIFACTS" | jq -c '.[]')

          # Compact JSON to single line for GITHUB_OUTPUT compatibility
          PAYLOAD_COMPACT=$(echo "$PAYLOAD" | jq -c '.')
          echo "CD_PAYLOAD=$PAYLOAD_COMPACT" >> $GITHUB_OUTPUT
          echo "Generated CD payload: $PAYLOAD"

      - name: Check Tag
        id: check_tag
        run: |
          TAG_NAME="${{ inputs.module_name }}-v${{ inputs.module_version }}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "${TAG_NAME}"; then
            # A rerun or slower overlapping build is already part of the tag.
            # Any other commit reused the version and would never deploy.
            STATUS=$(gh api "repos/${{ github.repository }}/compare/${TAG_NAME}...${{ github.sha }}" --jq .status)
            if [ "$STATUS" != "identical" ] && [ "$STATUS" != "behind" ]; then
              echo "::warning::${TAG_NAME} was released from another commit, so ${{ github.sha }} (${STATUS} of it) needs a retry version bump."
              echo "NEEDS_BUMP=true" >> $GITHUB_OUTPUT
              echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
              echo "SKIP_RELEASE=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            if [ "$STATUS" = "identical" ]; then
              # Published assets never change; drafts resume with this passing CI build.
              if gh api "repos/${{ github.repository }}/releases/tags/${TAG_NAME}" > release.json 2> release-error.txt; then
                ORIGINAL_PAYLOAD=$(node devops/github/release/release-assets.mjs)
                if [ -n "$ORIGINAL_PAYLOAD" ]; then
                  ORIGINAL_REF=$(echo "$ORIGINAL_PAYLOAD" | jq -r .ref)
                  if [ "$ORIGINAL_REF" != "${{ github.sha }}" ]; then
                    echo "Release metadata source does not match the tag commit" >&2
                    exit 1
                  fi
                fi
                echo "NEEDS_BUMP=false" >> $GITHUB_OUTPUT
                echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
                if jq -e '.draft == true' release.json > /dev/null; then
                  echo "SKIP_RELEASE=false" >> $GITHUB_OUTPUT
                  echo "Resuming draft release with this passing CI build"
                else
                  if [ -n "$ORIGINAL_PAYLOAD" ]; then
                    echo "CD_PAYLOAD=$ORIGINAL_PAYLOAD" >> $GITHUB_OUTPUT
                  fi
                  echo "SKIP_RELEASE=true" >> $GITHUB_OUTPUT
                  echo "Release already published; preserving its original artifacts"
                fi
                exit 0
              elif ! grep -q '(HTTP 404)' release-error.txt; then
                cat release-error.txt >&2
                exit 1
              fi
              echo "NEEDS_BUMP=false" >> $GITHUB_OUTPUT
              echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
              echo "SKIP_RELEASE=false" >> $GITHUB_OUTPUT
              echo "Resuming tag-only release from this exact commit"
              exit 0
            fi
            echo "ANCESTOR=true" >> $GITHUB_OUTPUT
            echo "::notice::Tag ${TAG_NAME} already exists on remote and contains this commit — skipping tag/release creation"
            echo "NEEDS_BUMP=false" >> $GITHUB_OUTPUT
            echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
            echo "SKIP_RELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "NEEDS_BUMP=false" >> $GITHUB_OUTPUT
            echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Tag
        if: steps.check_tag.outputs.TAG_EXISTS != 'true'
        run: git tag -a "${{ steps.check_tag.outputs.TAG_NAME }}" -m "Release ${{ steps.check_tag.outputs.TAG_NAME }}"

      - name: Add Deploy Key
        if: steps.check_tag.outputs.TAG_EXISTS != 'true'
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Push Tag
        if: steps.check_tag.outputs.TAG_EXISTS != 'true'
        run: |
          git remote set-url origin git@github.com:${{ github.repository }}
          git push origin ${{ steps.check_tag.outputs.TAG_NAME }}

      - name: Download Artifacts
        if: steps.check_tag.outputs.SKIP_RELEASE != 'true'
        run: |
          set -e

          ARTIFACTS='${{ inputs.artifacts_json }}'
          DELIVERY_PAYLOAD='${{ steps.check_tag.outputs.CD_PAYLOAD || steps.build_payload.outputs.CD_PAYLOAD }}'
          SOURCE_RUN=$(echo "$DELIVERY_PAYLOAD" | jq -r .ci_run_id)
          echo "Processing artifacts: $ARTIFACTS"

          SOURCE_ATTEMPT=$(echo "$DELIVERY_PAYLOAD" | jq -r .ci_run_attempt)
          test "$(gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN" --jq .run_attempt)" = "$SOURCE_ATTEMPT"
          gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN/artifacts" --paginate --jq '.artifacts[]' > "$RUNNER_TEMP/release-artifacts.jsonl"

          # Pin each archive before downloading; never follow a replaced artifact name.
          echo "$ARTIFACTS" | jq -c '.[]' | while read -r artifact; do
            NAME=$(echo "$artifact" | jq -r '.name // empty')
            PATH_DIR=$(echo "$artifact" | jq -r '.path')

            # Skip if artifact name is empty or null
            if [ -z "$NAME" ] || [ "$NAME" = "null" ]; then
              echo "Skipping artifact with empty name"
              continue
            fi

            echo "Downloading artifact '$NAME' to '$PATH_DIR'"
            mkdir -p "$PATH_DIR"

            SOURCE=$(jq -s -e --arg name "$NAME" --arg run_id "$SOURCE_RUN" --arg ref "${{ github.sha }}" '
              [.[] | select(.name == $name and .expired == false and (.workflow_run.id | tostring) == $run_id and .workflow_run.head_sha == $ref)]
              | max_by(.id) | select(. != null and (.digest | test("^sha256:[a-f0-9]{64}$")))' "$RUNNER_TEMP/release-artifacts.jsonl")
            ID=$(echo "$SOURCE" | jq -r .id)
            DIGEST=$(echo "$SOURCE" | jq -r .digest)
            ARCHIVE="$RUNNER_TEMP/release-$ID.zip"
            gh api "repos/${{ github.repository }}/actions/artifacts/$ID/zip" > "$ARCHIVE"
            printf '%s  %s\n' "${DIGEST#sha256:}" "$ARCHIVE" | sha256sum --check --status
            unzip -q "$ARCHIVE" -d "$PATH_DIR"
            ls -la "$PATH_DIR"
          done

      - name: Prepare Release
        if: steps.check_tag.outputs.SKIP_RELEASE != 'true'
        id: prepare_release
        run: |
          set -e

          ARTIFACTS='${{ inputs.artifacts_json }}'
          MODULE_NAME_CAP="$(echo '${{ inputs.module_name }}' | awk '{print toupper(substr($0,1,1)) substr($0,2)}')"

          # Build file patterns for release
          FILE_PATTERNS=$(echo "$ARTIFACTS" | jq -r '.[] | select(.name != null and .name != "" and .glob != null) | "\(.path)/\(.glob)"')

          echo "FILE_PATTERNS<<EOF" >> $GITHUB_OUTPUT
          echo "$FILE_PATTERNS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Build release body dynamically
          # Check if any artifacts have labels (indicating multi-artifact release)
          HAS_LABELS=$(echo "$ARTIFACTS" | jq '[.[] | select(.label != null and .label != "")] | length')

          if [ "$HAS_LABELS" -gt 0 ]; then
            # Multi-artifact release with download section
            BODY="Automated release for ${MODULE_NAME_CAP} version ${{ inputs.module_version }}."
            BODY="${BODY}"$'\n\n'"## Downloads"

            while read -r artifact; do
              NAME=$(echo "$artifact" | jq -r '.name // empty')
              LABEL=$(echo "$artifact" | jq -r '.label // empty')

              if [ -n "$NAME" ] && [ "$NAME" != "null" ] && [ -n "$LABEL" ] && [ "$LABEL" != "null" ]; then
                BODY="${BODY}"$'\n'"- **${LABEL}**"
              fi
            done < <(echo "$ARTIFACTS" | jq -c '.[]')
          else
            # Simple single-artifact release
            BODY="Automated release for ${MODULE_NAME_CAP} version ${{ inputs.module_version }}."
          fi

          DELIVERY_PAYLOAD='${{ steps.check_tag.outputs.CD_PAYLOAD || steps.build_payload.outputs.CD_PAYLOAD }}'
          BODY="${BODY}"$'\n\n'"<!-- release-delivery:${DELIVERY_PAYLOAD} -->"
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "MODULE_NAME_CAP=$MODULE_NAME_CAP" >> $GITHUB_OUTPUT

          echo "File patterns:"
          echo "$FILE_PATTERNS"
          echo ""
          echo "Release body:"
          echo "$BODY"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.SKIP_RELEASE != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.check_tag.outputs.TAG_NAME }}
          name: Release ${{ steps.prepare_release.outputs.MODULE_NAME_CAP }} v${{ inputs.module_version }}
          body: ${{ steps.prepare_release.outputs.BODY }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ steps.prepare_release.outputs.FILE_PATTERNS }}
          fail_on_unmatched_files: true
          draft: true

      - name: Verify and publish complete release
        if: steps.check_tag.outputs.SKIP_RELEASE != 'true'
        env:
          RELEASE_ARTIFACTS: ${{ inputs.artifacts_json }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/${{ steps.check_tag.outputs.TAG_NAME }}" > release.json
          node devops/github/release/release-assets.mjs --verify
          gh release edit "${{ steps.check_tag.outputs.TAG_NAME }}" --draft=false

      # Recovery must finish the bump even when publishing or dispatch succeeded earlier.
      - name: Mark Release Complete
        id: mark_released
        if: steps.check_tag.outputs.ANCESTOR != 'true' && steps.check_tag.outputs.NEEDS_BUMP != 'true' && (steps.check_tag.outputs.SKIP_RELEASE != 'true' || steps.check_tag.outputs.TAG_EXISTS == 'true')
        env:
          NEW_PAYLOAD: ${{ steps.build_payload.outputs.CD_PAYLOAD }}
          ORIGINAL_PAYLOAD: ${{ steps.check_tag.outputs.CD_PAYLOAD }}
          SKIP_RELEASE: ${{ steps.check_tag.outputs.SKIP_RELEASE }}
        run: |
          echo "released=true" >> $GITHUB_OUTPUT
          if [ "$SKIP_RELEASE" = "true" ]; then
            # Legacy releases lack provenance: advance the version, but do not redeploy rebuilt assets.
            echo "CD_PAYLOAD=$ORIGINAL_PAYLOAD" >> $GITHUB_OUTPUT
          else
            echo "CD_PAYLOAD=${ORIGINAL_PAYLOAD:-$NEW_PAYLOAD}" >> $GITHUB_OUTPUT
          fi
