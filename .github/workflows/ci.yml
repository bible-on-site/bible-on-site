# ====================================================================================
# CI WORKFLOW - Continuous Integration Pipeline
# ====================================================================================
#
# IMPORTANT: Reusable Workflow Result Evaluation Bug (see #1065)
# -------------------------------------------------------------
# GitHub Actions has a known issue where jobs depending on reusable workflows may be
# incorrectly skipped, even when the upstream workflow completes successfully.
#
# WORKAROUND: When adding jobs that depend on reusable workflows (like cross_module_ci
# or package_* jobs), you MUST use this pattern:
#
#   if: ${{ always() && needs.upstream_job.result == 'success' && <your conditions> }}
#
# Rule: When adding job X that depends on reusable workflow Y:
#   1. Start with always()
#   2. Check needs.Y.result == 'success' for EACH reusable workflow dependency
#   3. Then add your business logic conditions (outputs, branch checks, etc.)
#
# See docs/github/workflows/ci/ci.md for detailed documentation and examples.
# ====================================================================================

# TODO: cleanup artifacts using geekyeggo/delete-artifact
name: Continuous Integration
permissions:
  contents: read

on:
  # Better practice is to run on any push instead of just either master push or PR.
  # Just that there is some issues with the way the CI is implemented now.
  # I.E. the module determination tstep depends on it.
  # TODO: (1) Resolve this dependency (2) remove the pull_request trigger (3) set push trigger on ** branches
  push:
    branches: master
  pull_request:
    branches: master
  merge_group:
  # Use the dispatch's native branch/tag selector so execution and cache scope match.
  workflow_dispatch:
    inputs:
      # e2e-impact (#2085): shadow computes selections for evidence; enforce
      # actually runs the selected subset in the Playwright suites. The mobile
      # suite has its own dispatch inputs on app-mobile-e2e.yml.
      e2e_selection_mode:
        description: "E2E impact selection mode (mobile suite uses its own workflow inputs)"
        required: false
        type: choice
        options: ["shadow", "enforce"]
        default: "shadow"
      force_full_suite:
        description: "Force the full E2E suite regardless of the selection manifest"
        required: false
        type: boolean
        default: false

# Only the latest commit of a PR needs validation. Keep master, dispatched and
# merge-queue runs independent so publication and queue validation are preserved.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  API_CARGO_FILE: web/api/Cargo.toml
  API_COVERAGE_ARTIFACT_NAME_MASTER: api-coverage.master
  API_COVERAGE_ARTIFACT_NAME_WF: api-coverage.${{ github.run_id }}
  API_COVERAGE_DIRECTORY: web/api/.coverage
  API_COVERAGE_REPORT: web/api/.coverage/merged/lcov.info
  API_DIRECTORY: web/api
  API_E2E_JUNIT_REPORT_ARTIFACT_NAME: api-e2e-junit-report-${{ github.run_id }}
  API_MERGED_COVERAGE_DIRECTORY: web/api/.coverage/merged
  API_TESTS_DIRECTORY: web/api/tests
  API_TESTS_NODE_CACHE_PATH: web/api/tests/bun.lock
  API_TESTS_NODE_VERSION_FILE: web/api/tests/package.json
  API_UNIT_JUNIT_REPORT_ARTIFACT_NAME: api-unit-junit-report-${{ github.run_id }}
  # Deterministic e2e-impact coverage-tree baselines (#2085): published only
  # by successful default-branch runs; every run downloads them for the
  # shadow-mode selection manifest. Evidence lives under each suite's
  # .coverage/e2e-impact/.
  API_E2E_IMPACT_ARTIFACT_NAME_MASTER: api-e2e-coverage.master
  ADMIN_E2E_IMPACT_ARTIFACT_NAME_MASTER: admin-e2e-coverage.master
  WEBSITE_E2E_IMPACT_ARTIFACT_NAME_MASTER: website-e2e-coverage.master
  APP_COVERAGE_ARTIFACT_NAME_MASTER: app-coverage.master
  APP_COVERAGE_ARTIFACT_NAME_WF: app-coverage.${{ github.run_id }}
  APP_COVERAGE_DIRECTORY: app/.coverage
  APP_COVERAGE_REPORT: app/.coverage/merged/lcov.info
  APP_MERGED_COVERAGE_DIRECTORY: app/.coverage/merged
  # Real app-process coverage collected by the instrumented mobile E2E legs
  # (#1232). Per-run artifacts merge into the app report; the master artifacts
  # are trusted baselines reused only when a run produces no fresh layer.
  APP_E2E_COVERAGE_ARTIFACT_NAME_WF: app-e2e-coverage.${{ github.run_id }}
  APP_E2E_COVERAGE_ARTIFACT_NAME_MASTER_ANDROID: app-e2e-coverage.master.android
  APP_E2E_COVERAGE_ARTIFACT_NAME_MASTER_IOS: app-e2e-coverage.master.ios
  APP_E2E_COVERAGE_DIRECTORY: app/.coverage/e2e
  APP_DIRECTORY: app
  CROSS_MODULE_COVERAGE_REPORT: .coverage/lcov.info
  DATA_COVERAGE_ARTIFACT_NAME_MASTER: data-coverage.master
  DATA_COVERAGE_ARTIFACT_NAME_WF: data-coverage.${{ github.run_id }}
  DATA_COVERAGE_DIRECTORY: data/.coverage
  DATA_COVERAGE_REPORT: data/.coverage/merged/lcov.info
  DATA_DIRECTORY: data
  DATA_MERGED_COVERAGE_DIRECTORY: data/.coverage/merged
  DEVOPS_DIRECTORY: devops
  DEVOPS_NODE_CACHE_PATH: devops/bun.lock
  DEVOPS_NODE_VERSION_FILE: devops/package.json
  # e2e-impact (#2085): the dispatch input or the E2E_SELECTION_MODE repo
  # variable opt the Playwright suites into running the selected subset;
  # every other run stays in shadow mode (diagnostics only). The selector
  # itself honors FORCE_FULL_SUITE.
  E2E_SELECTION_MODE: ${{ inputs.e2e_selection_mode || vars.E2E_SELECTION_MODE || 'shadow' }}
  # Queue checks cover every entry in the combined head, not just its last delta.
  FORCE_FULL_SUITE: ${{ github.event_name == 'merge_group' && 'true' || inputs.force_full_suite || vars.E2E_FORCE_FULL_SUITE || '' }}
  IS_MASTER_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
  TMP_WEBSITE_JUNIT_REPORTS_DIRECTORY: tmp-website-junit-reports
  WEBSITE_COVERAGE_ARTIFACT_NAME_MASTER: website-coverage.master
  WEBSITE_COVERAGE_ARTIFACT_NAME_WF: website-coverage.${{ github.run_id }}
  WEBSITE_DIRECTORY: web/bible-on-site
  WEBSITE_E2E_JUNIT_REPORT_ARTIFACT_NAME: website-e2e-junit-report-${{ github.run_id }}
  WEBSITE_MERGED_COVERAGE_DIRECTORY: web/bible-on-site/.coverage/merged
  WEBSITE_MERGED_COVERAGE_REPORT: web/bible-on-site/.coverage/merged/lcov.info
  WEBSITE_NODE_CACHE_PATH: web/bible-on-site/bun.lock
  WEBSITE_NODE_VERSION_FILE: web/bible-on-site/package.json
  WEBSITE_PERF_JUNIT_REPORT_ARTIFACT_NAME: website-perf-junit-report-${{ github.run_id }}
  WEBSITE_UNIT_JUNIT_REPORT_ARTIFACT_NAME: website-unit-junit-report-${{ github.run_id }}
  APP_UNIT_JUNIT_REPORT_ARTIFACT_NAME: app-unit-junit-report-${{ github.run_id }}
  APP_INTEGRATION_JUNIT_REPORT_ARTIFACT_NAME: app-integration-junit-report-${{ github.run_id }}
  ADMIN_DIRECTORY: web/admin
  ADMIN_DOCKER_ARTIFACT_NAME: bible-on-site-admin-docker-${{ github.run_id }}
  ADMIN_DOCKER_IMAGE_NAME: bible-on-site-admin
  ADMIN_NODE_CACHE_PATH: web/admin/bun.lock
  ADMIN_NODE_VERSION_FILE: web/admin/package.json
  ADMIN_UNIT_JUNIT_REPORT_ARTIFACT_NAME: admin-unit-junit-report-${{ github.run_id }}
  ADMIN_E2E_JUNIT_REPORT_ARTIFACT_NAME: admin-e2e-junit-report-${{ github.run_id }}
  ADMIN_COVERAGE_ARTIFACT_NAME_MASTER: admin-coverage.master
  ADMIN_COVERAGE_ARTIFACT_NAME_WF: admin-coverage.${{ github.run_id }}
  ADMIN_COVERAGE_DIRECTORY: web/admin/.coverage
  ADMIN_MERGED_COVERAGE_REPORT: web/admin/.coverage/merged/lcov.info
  ADMIN_UNIT_COVERAGE_REPORT: web/admin/.coverage/unit/lcov.info
  ADMIN_E2E_COVERAGE_REPORT: web/admin/.coverage/e2e/lcov.info
  BULLETIN_COVERAGE_ARTIFACT_NAME_MASTER: bulletin-coverage.master
  BULLETIN_COVERAGE_ARTIFACT_NAME_WF: bulletin-coverage.${{ github.run_id }}
  BULLETIN_COVERAGE_DIRECTORY: web/bulletin/.coverage/unit
  BULLETIN_COVERAGE_REPORT: web/bulletin/.coverage/unit/lcov.info
  BULLETIN_DIRECTORY: web/bulletin
  BULLETIN_UNIT_JUNIT_REPORT_ARTIFACT_NAME: bulletin-unit-junit-report-${{ github.run_id }}
  BULLETIN_LAMBDA_ZIP_ARTIFACT_NAME: bulletin-lambda-${{ github.run_id }}
  DATA_UNIT_JUNIT_REPORT_ARTIFACT_NAME: data-unit-junit-report-${{ github.run_id }}
  DATA_INTEGRATION_JUNIT_REPORT_ARTIFACT_NAME: data-integration-junit-report-${{ github.run_id }}
  PERUSHIM_DATA_SQL_ARTIFACT_NAME_MASTER: perushim-data-sql.master
  # Indexed v2 carries catalog, compressed notes and FTS; never reuse the older pair-only baseline.
  PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_MASTER: perushim-sqlite-v2-indexed.master
  PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_WF: perushim-sqlite-v2-indexed.${{ github.run_id }}
  PERUSHIM_NOTES_SQLITE_FILENAME: sefaria-dump-5784-sivan-4.perushim_notes.sqlite
  PERUSHIM_CATALOG_SQLITE_FILENAME: sefaria-dump-5784-sivan-4.perushim_catalog.sqlite
  # Prebuilt FTS5 search index riding in the same notes pack (CI artifacts only —
  # its .gz exceeds GitHub's 100 MB push limit).
  PERUSHIM_SEARCH_SQLITE_FILENAME: sefaria-dump-5784-sivan-4.hebrew_search.sqlite
  PERUSHIM_NOTES_ANDROID_ASSET_RELDIR: Platforms/Android/AssetPacks/perushim_notes
  PERUSHIM_NOTES_IOS_ASSETPACK_RELDIR: Platforms/iOS/AssetPacks/perushim-notes
  PERUSHIM_PIPELINE_DIRECTORY: data/sefaria/pipelines/perushim-view
  SEFARIA_MONGO_IMAGE_ARTIFACT_NAME: sefaria-mongo-image
  SEFARIA_MONGO_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/sefaria-mongo
  SEFARIA_MONGO_DOCKER_DIRECTORY: data/sefaria/mongodb-docker

jobs:
  setup_env:
    name: Setup Environment Variables
    runs-on: ubuntu-latest
    outputs:
      api_directory: ${{ env.API_DIRECTORY }} # a workaround for places where only needs.<job_id>.<output> is allowed
      app_directory: ${{ env.APP_DIRECTORY }} # a workaround for places where only needs.<job_id>.<output> is allowed
      admin_directory: ${{ env.ADMIN_DIRECTORY }} # a workaround for places where only needs.<job_id>.<output> is allowed
      bulletin_directory: ${{ env.BULLETIN_DIRECTORY }} # a workaround for places where only needs.<job_id>.<output> is allowed
      data_directory: ${{ env.DATA_DIRECTORY }} # a workaround for places where only needs.<job_id>.<output> is allowed
      is_master_branch: ${{ env.IS_MASTER_BRANCH }} # a workaround for places where only needs.<job_id>.<output> is allowed
      website_directory: ${{ env.WEBSITE_DIRECTORY }} # a workaround for places where only needs.<job_id>.<output> is allowed
      website_playwright_version: ${{ steps.get_website_playwright_version.outputs.PLAYWRIGHT_VERSION }}
      admin_playwright_version: ${{ steps.get_admin_playwright_version.outputs.PLAYWRIGHT_VERSION }}
    steps:
      - run: echo "Setting up environment variables"
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Get Website Playwright version
        id: get_website_playwright_version
        working-directory: ${{ env.WEBSITE_DIRECTORY }}
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")" >> $GITHUB_OUTPUT
      - name: Get Admin Playwright version
        id: get_admin_playwright_version
        working-directory: ${{ env.ADMIN_DIRECTORY }}
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")" >> $GITHUB_OUTPUT

  determine_baseline_availability:
    name: Determine Baseline Availability
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      is_api_master_coverage_available: ${{ steps.check_master_coverage_artifacts.outputs.is_api_master_coverage_available }}
      is_app_master_coverage_available: ${{ steps.check_master_coverage_artifacts.outputs.is_app_master_coverage_available }}
      is_bulletin_master_coverage_available: ${{ steps.check_master_coverage_artifacts.outputs.is_bulletin_master_coverage_available }}
      is_admin_master_coverage_available: ${{ steps.check_master_coverage_artifacts.outputs.is_admin_master_coverage_available }}
      is_website_master_coverage_available: ${{ steps.check_master_coverage_artifacts.outputs.is_website_master_coverage_available }}
      is_data_master_coverage_available: ${{ steps.check_master_coverage_artifacts.outputs.is_data_master_coverage_available }}
      is_perushim_data_sql_available: ${{ steps.check_master_coverage_artifacts.outputs.is_perushim_data_sql_available }}
      is_perushim_notes_sqlite_available: ${{ steps.check_master_coverage_artifacts.outputs.is_perushim_notes_sqlite_available }}
      is_app_e2e_android_coverage_available: ${{ steps.check_master_coverage_artifacts.outputs.is_app_e2e_android_coverage_available }}
      is_app_e2e_ios_coverage_available: ${{ steps.check_master_coverage_artifacts.outputs.is_app_e2e_ios_coverage_available }}
    steps:
      - name: Check master baseline artifacts
        id: check_master_coverage_artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Availability lookup only — consumers download each baseline via the
          # REST API by name where they need it.
          # Use ?name= filter to avoid pagination issues (25k+ artifacts in repo)
          check_artifact() {
            local artifact_name=$1
            local artifact_info=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$artifact_name" \
              --jq "[.artifacts[] | select(.expired == false)] | first")

            if [ "$artifact_info" != "null" ] && [ -n "$artifact_info" ]; then
              local artifact_id=$(echo "$artifact_info" | jq -r '.id')
              echo "Found artifact $artifact_name (id: $artifact_id)" >&2
              echo "true"
            else
              echo "false"
            fi
          }

          IS_API_MASTER_COVERAGE_AVAILABLE=$(check_artifact "${{ env.API_COVERAGE_ARTIFACT_NAME_MASTER }}")
          IS_APP_MASTER_COVERAGE_AVAILABLE=$(check_artifact "${{ env.APP_COVERAGE_ARTIFACT_NAME_MASTER }}")
          IS_BULLETIN_MASTER_COVERAGE_AVAILABLE=$(check_artifact "${{ env.BULLETIN_COVERAGE_ARTIFACT_NAME_MASTER }}")
          IS_ADMIN_MASTER_COVERAGE_AVAILABLE=$(check_artifact "${{ env.ADMIN_COVERAGE_ARTIFACT_NAME_MASTER }}")
          IS_WEBSITE_MASTER_COVERAGE_AVAILABLE=$(check_artifact "${{ env.WEBSITE_COVERAGE_ARTIFACT_NAME_MASTER }}")
          IS_DATA_MASTER_COVERAGE_AVAILABLE=$(check_artifact "${{ env.DATA_COVERAGE_ARTIFACT_NAME_MASTER }}")
          IS_PERUSHIM_DATA_SQL_AVAILABLE=$(check_artifact "${{ env.PERUSHIM_DATA_SQL_ARTIFACT_NAME_MASTER }}")
          IS_PERUSHIM_NOTES_SQLITE_AVAILABLE=$(check_artifact "${{ env.PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_MASTER }}")
          IS_APP_E2E_ANDROID_COVERAGE_AVAILABLE=$(check_artifact "${{ env.APP_E2E_COVERAGE_ARTIFACT_NAME_MASTER_ANDROID }}")
          IS_APP_E2E_IOS_COVERAGE_AVAILABLE=$(check_artifact "${{ env.APP_E2E_COVERAGE_ARTIFACT_NAME_MASTER_IOS }}")

          echo "API master coverage available: $IS_API_MASTER_COVERAGE_AVAILABLE"
          echo "App master coverage available: $IS_APP_MASTER_COVERAGE_AVAILABLE"
          echo "Bulletin master coverage available: $IS_BULLETIN_MASTER_COVERAGE_AVAILABLE"
          echo "Admin master coverage available: $IS_ADMIN_MASTER_COVERAGE_AVAILABLE"
          echo "Website master coverage available: $IS_WEBSITE_MASTER_COVERAGE_AVAILABLE"
          echo "Data master coverage available: $IS_DATA_MASTER_COVERAGE_AVAILABLE"
          echo "Perushim data SQL available: $IS_PERUSHIM_DATA_SQL_AVAILABLE"
          echo "Perushim notes SQLite available: $IS_PERUSHIM_NOTES_SQLITE_AVAILABLE"
          echo "App E2E Android coverage available: $IS_APP_E2E_ANDROID_COVERAGE_AVAILABLE"
          echo "App E2E iOS coverage available: $IS_APP_E2E_IOS_COVERAGE_AVAILABLE"

          echo "is_api_master_coverage_available=$IS_API_MASTER_COVERAGE_AVAILABLE" >> $GITHUB_OUTPUT
          echo "is_app_master_coverage_available=$IS_APP_MASTER_COVERAGE_AVAILABLE" >> $GITHUB_OUTPUT
          echo "is_bulletin_master_coverage_available=$IS_BULLETIN_MASTER_COVERAGE_AVAILABLE" >> $GITHUB_OUTPUT
          echo "is_admin_master_coverage_available=$IS_ADMIN_MASTER_COVERAGE_AVAILABLE" >> $GITHUB_OUTPUT
          echo "is_website_master_coverage_available=$IS_WEBSITE_MASTER_COVERAGE_AVAILABLE" >> $GITHUB_OUTPUT
          echo "is_data_master_coverage_available=$IS_DATA_MASTER_COVERAGE_AVAILABLE" >> $GITHUB_OUTPUT
          echo "is_perushim_data_sql_available=$IS_PERUSHIM_DATA_SQL_AVAILABLE" >> $GITHUB_OUTPUT
          echo "is_perushim_notes_sqlite_available=$IS_PERUSHIM_NOTES_SQLITE_AVAILABLE" >> $GITHUB_OUTPUT
          echo "is_app_e2e_android_coverage_available=$IS_APP_E2E_ANDROID_COVERAGE_AVAILABLE" >> $GITHUB_OUTPUT
          echo "is_app_e2e_ios_coverage_available=$IS_APP_E2E_IOS_COVERAGE_AVAILABLE" >> $GITHUB_OUTPUT

  determine_docker_image_availability:
    name: Determine Docker Image Availability
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    outputs:
      is_sefaria_mongo_available: ${{ steps.check_sefaria_mongo.outputs.is_sefaria_mongo_available }}
      sefaria_mongo_image: ${{ steps.check_sefaria_mongo.outputs.sefaria_mongo_image }}
      # Queue validation and read-only fork PRs use a workflow artifact instead of publishing.
      can_publish_sefaria_mongo: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Check Sefaria MongoDB image availability
        id: check_sefaria_mongo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag by the git tree hash of the build context, so any change to it rebuilds the image.
          docker_dir="${{ env.SEFARIA_MONGO_DOCKER_DIRECTORY }}"
          tree_sha=$(gh api "repos/${{ github.repository }}/contents/$(dirname "$docker_dir")?ref=${{ github.sha }}" \
            --jq ".[] | select(.name == \"$(basename "$docker_dir")\") | .sha")
          test -n "$tree_sha"
          image="${{ env.SEFARIA_MONGO_IMAGE_REPOSITORY }}:$tree_sha"
          echo "sefaria_mongo_image=$image" >> $GITHUB_OUTPUT
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" > /dev/null; then
            echo "Found Sefaria MongoDB image $image"
            echo "is_sefaria_mongo_available=true" >> $GITHUB_OUTPUT
          else
            echo "Sefaria MongoDB image $image not found - will need to build"
            echo "is_sefaria_mongo_available=false" >> $GITHUB_OUTPUT
          fi

  determine_changes:
    name: Determine Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      website_module_changed: ${{ steps.determine.outputs.website_module_changed }}
      website_ci_changed: ${{ steps.determine.outputs.website_ci_changed }}
      api_module_changed: ${{ steps.determine.outputs.api_module_changed == 'true' || steps.pending-api.outputs.api_release_pending == 'true' }}
      api_ci_changed: ${{ steps.determine.outputs.api_ci_changed == 'true' || steps.pending-api.outputs.api_release_pending == 'true' }}
      app_module_changed: ${{ steps.determine.outputs.app_module_changed }}
      app_ci_changed: ${{ steps.determine.outputs.app_ci_changed }}
      admin_module_changed: ${{ steps.determine.outputs.admin_module_changed }}
      admin_ci_changed: ${{ steps.determine.outputs.admin_ci_changed }}
      bulletin_module_changed: ${{ steps.determine.outputs.bulletin_module_changed }}
      bulletin_ci_changed: ${{ steps.determine.outputs.bulletin_ci_changed }}
      data_module_changed: ${{ steps.determine.outputs.data_module_changed }}
      data_ci_changed: ${{ steps.determine.outputs.data_ci_changed }}
      data_schema_only_changed: ${{ steps.determine.outputs.data_schema_only_changed }}
      data_deploy_changed: ${{ steps.determine.outputs.data_deploy_changed }}
      perushim_pipeline_module_changed: ${{ steps.determine.outputs.perushim_pipeline_module_changed }}
      perushim_pipeline_ci_changed: ${{ steps.determine.outputs.perushim_pipeline_ci_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.DEVOPS_NODE_VERSION_FILE }}
      - name: Test module change routing
        run: node --test devops/github/ci/determine-changes.test.ts
      - name: Determine module changes
        id: determine
        run: node devops/github/ci/determine-changes.ts
      - name: Verify pending API release reconciliation
        run: node --test devops/github/ci/pending-api-release.test.mjs
      - name: Reconcile previously blocked API release
        id: pending-api
        # Ordinary API changes keep their existing release/version-bump path.
        # Recovery only selects real API code left unpublished by an older run.
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.determine.outputs.api_module_changed != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node devops/github/ci/pending-api-release.mjs

  # Fixed ~30-second verification of the pre-generated calendar-PDF artifact
  # cache (#2608). Full (re)generation and S3 publication live in
  # calendar-pdf-publish.yml — a cold or broadly invalidated render must never
  # inflate this pipeline.
  calendar_pdf_artifacts:
    name: Calendar PDF Artifacts
    runs-on: ubuntu-latest
    needs: [setup_env, determine_changes]
    if: >-
      ${{ always() && !cancelled() &&
        needs.setup_env.result == 'success' &&
        needs.determine_changes.result == 'success' &&
        (needs.determine_changes.outputs.website_module_changed == 'true' || needs.determine_changes.outputs.website_ci_changed == 'true')
      }}
    defaults:
      run:
        working-directory: ${{ env.WEBSITE_DIRECTORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # The generated catalog is a fingerprinted input — regenerate before
      # hashing so the fingerprint always reflects current data.
      - name: Generate client catalog
        run: node scripts/generate-client-catalog.mjs

      - name: Compute calendar-PDF input fingerprint
        id: fp
        run: echo "fingerprint=$(node scripts/calendar-pdf-inputs.mjs)" >> "$GITHUB_OUTPUT"

      - name: Restore calendar-PDF artifact cache
        id: artifacts-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.WEBSITE_DIRECTORY }}/.cache/calendar-pdf
          # Content-addressed key: a relevant-input change opens a new cache
          # lineage while the previous lineage is still restored for partial
          # regeneration (per-artifact input shas decide what re-renders).
          key: ${{ runner.os }}-calendar-pdf-${{ steps.fp.outputs.fingerprint }}
          restore-keys: ${{ runner.os }}-calendar-pdf-

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.WEBSITE_NODE_VERSION_FILE }}

      - name: Restore bun store cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-website-${{ hashFiles(env.WEBSITE_NODE_CACHE_PATH) }}
          restore-keys: ${{ runner.os }}-bun-website-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # On an unchanged fingerprint this is an O(keys) manifest check plus a
      # small re-rendered byte-compare sample; on drift it measures the
      # partial-invalidation rate on a bounded sample. Never a full render.
      # The cache is write-owned by calendar-pdf-publish.yml (serialized by
      # its concurrency group) — this job only restores + verifies, so two
      # overlapping CI runs can never race on a cache save.
      - name: Verify calendar-PDF artifacts
        run: bun run check:calendar-pdf

  validate_website_architectures:
    name: Validate Website Architectures
    needs: determine_changes
    if: ${{ needs.determine_changes.outputs.website_module_changed == 'true' || needs.determine_changes.outputs.website_ci_changed == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/architecture-validation.yml
    with:
      service: website

  validate_api_architectures:
    name: Validate API Architectures
    needs: determine_changes
    if: ${{ needs.determine_changes.outputs.api_module_changed == 'true' || needs.determine_changes.outputs.api_ci_changed == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/architecture-validation.yml
    with:
      service: api

  validate_admin_architectures:
    name: Validate Admin Architectures
    needs: determine_changes
    if: ${{ needs.determine_changes.outputs.admin_module_changed == 'true' || needs.determine_changes.outputs.admin_ci_changed == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/architecture-validation.yml
    with:
      service: admin

  package_website:
    name: Package Website
    needs: [setup_env, determine_changes]
    if: ${{ needs.determine_changes.outputs.website_module_changed == 'true' && needs.setup_env.outputs.is_master_branch == 'true' && github.event_name == 'push' }}
    permissions:
      contents: write
      actions: read
      id-token: write # Required for AWS OIDC authentication to access RDS during SSG build
    secrets: inherit
    uses: ./.github/workflows/shared-dockerize.yml
    with:
      module_directory: ${{ needs.setup_env.outputs.website_directory }}

  # Master pushes package the release; other events (PR, merge queue) build the
  # same release Docker configuration as a pre-merge check without uploading it,
  # so base-image/toolchain breakage blocks the merge (#2292).
  package_api:
    name: Package API
    needs: [setup_env, determine_changes]
    if: ${{ (github.event_name == 'push' && needs.setup_env.outputs.is_master_branch == 'true' && needs.determine_changes.outputs.api_module_changed == 'true') || (github.event_name != 'push' && (needs.determine_changes.outputs.api_module_changed == 'true' || needs.determine_changes.outputs.api_ci_changed == 'true')) }}
    permissions:
      contents: write
      actions: read
      id-token: write # Required by shared-dockerize.yml
    secrets: inherit
    uses: ./.github/workflows/shared-dockerize.yml
    with:
      module_directory: ${{ needs.setup_env.outputs.api_directory }}

  package_app:
    name: Package App
    # Wait for perushim_data so the app is packaged with up-to-date perushim notes
    # when both app and perushim pipeline change in the same commit.
    needs: [setup_env, determine_changes, perushim_data]
    if: ${{ always() && !cancelled() && !failure() && needs.determine_changes.outputs.app_module_changed == 'true' && needs.setup_env.outputs.is_master_branch == 'true' && github.event_name == 'push' }}
    permissions:
      contents: read
      actions: read
    secrets: inherit
    uses: ./.github/workflows/app-package.yml
    with:
      platform: All
      perushim_notes_sqlite_artifact: ${{ needs.perushim_data.result != 'skipped' && format('perushim-sqlite-v2-indexed.{0}', github.run_id) || 'perushim-sqlite-v2-indexed.master' }}

  # Compile and inspect the actual signed distribution on relevant PRs too.
  # Simulator builds cannot detect missing App Groups provisioning or a broken
  # embedded downloader; publication remains in the master-only job above.
  package_ios_pr:
    name: Validate iOS Distribution
    needs: [setup_env, determine_changes, perushim_data]
    if: ${{ always() && !cancelled() && !failure() && github.event_name != 'push' && (needs.determine_changes.outputs.app_module_changed == 'true' || needs.determine_changes.outputs.app_ci_changed == 'true') }}
    permissions:
      contents: read
      actions: read
    secrets: inherit
    uses: ./.github/workflows/app-package.yml
    with:
      platform: iOS
      perushim_notes_sqlite_artifact: ${{ needs.perushim_data.result != 'skipped' && format('perushim-sqlite-v2-indexed.{0}', github.run_id) || 'perushim-sqlite-v2-indexed.master' }}

  # Windows-only source (#if WINDOWS) compiled nowhere before merge: package_app
  # is master-only and App CI builds Android/iOS only — a Windows-only compile
  # regression shipped in #2496 undetected (#2526). A compile-only Release build
  # gates the real Windows target without signing secrets or store upload.
  package_windows_pr:
    name: Validate Windows Compile
    needs: [setup_env, determine_changes]
    if: ${{ always() && !cancelled() && !failure() && github.event_name != 'push' && (needs.determine_changes.outputs.app_module_changed == 'true' || needs.determine_changes.outputs.app_ci_changed == 'true') }}
    # The caller's permissions ceiling is validated at workflow-compile time
    # (before `if:` evaluation): app-package.yml declares `actions: read` for its
    # master-baseline artifact fetches, so the ceiling must cover it even though
    # compile_only never runs them — otherwise the whole run dies at startup_failure.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/app-package.yml
    with:
      platform: Windows
      compile_only: true

  # Same release/pre-merge split as package_api (#2292).
  package_bulletin:
    name: Package Bulletin
    needs: [setup_env, determine_changes]
    if: ${{ (github.event_name == 'push' && needs.setup_env.outputs.is_master_branch == 'true' && needs.determine_changes.outputs.bulletin_module_changed == 'true') || (github.event_name != 'push' && (needs.determine_changes.outputs.bulletin_module_changed == 'true' || needs.determine_changes.outputs.bulletin_ci_changed == 'true')) }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      module_version: ${{ steps.get_version.outputs.MODULE_VERSION }}
      lambda_zip_artifact_name: ${{ env.BULLETIN_LAMBDA_ZIP_ARTIFACT_NAME }}
    env:
      SHARED_ROOT_DIR: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          # Current CLI ZIP dependency tracking: https://github.com/bible-on-site/bible-on-site/issues/2826
          tool: cargo-make@0.37.24

      - name: Get Module Version
        id: get_version
        working-directory: ${{ env.BULLETIN_DIRECTORY }}
        run: |
          MODULE_VERSION=$(cargo make version | grep -v 'INFO')
          echo "MODULE_VERSION=${MODULE_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:v0.22.0

      - name: Build Bulletin Binary (Docker)
        run: |
          docker buildx build --load \
            --cache-from type=gha,scope=bulletin \
            --cache-to type=gha,mode=max,scope=bulletin \
            --progress=plain \
            -f ${{ env.BULLETIN_DIRECTORY }}/Dockerfile \
            -t bulletin-build:latest \
            ${{ env.SHARED_ROOT_DIR }}

      - name: Extract Binary and Create Lambda ZIP
        run: |
          mkdir -p ${{ env.BULLETIN_DIRECTORY }}/.release
          CONTAINER_ID=$(docker create bulletin-build:latest)
          docker cp "${CONTAINER_ID}:/app/bulletin/target/release/bulletin" ./bootstrap
          docker rm "${CONTAINER_ID}"
          chmod +x ./bootstrap
          mkdir -p fonts
          cp ${{ env.BULLETIN_DIRECTORY }}/fonts/*.ttf fonts/
          zip -r "${{ env.BULLETIN_DIRECTORY }}/.release/bulletin-lambda-v${{ steps.get_version.outputs.MODULE_VERSION }}.zip" ./bootstrap fonts/
          rm -rf ./bootstrap fonts/

      - name: Store Lambda ZIP
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BULLETIN_LAMBDA_ZIP_ARTIFACT_NAME }}
          path: ${{ env.BULLETIN_DIRECTORY }}/.release/bulletin-lambda-v${{ steps.get_version.outputs.MODULE_VERSION }}.zip
          # Release artifact consumed by cd-bulletin (repository_dispatch). Must
          # outlive a single day so a failed/late CD can be re-run without the
          # artifact expiring (matches the website/api release artifacts at 90).
          retention-days: 90

  # Same release/pre-merge split as package_api (#2292).
  package_admin:
    name: Package Admin
    needs: [setup_env, determine_changes]
    if: ${{ (github.event_name == 'push' && needs.setup_env.outputs.is_master_branch == 'true' && needs.determine_changes.outputs.admin_module_changed == 'true') || (github.event_name != 'push' && (needs.determine_changes.outputs.admin_module_changed == 'true' || needs.determine_changes.outputs.admin_ci_changed == 'true')) }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      module_version: ${{ steps.get_version.outputs.MODULE_VERSION }}
      docker_artifact_name: ${{ env.ADMIN_DOCKER_ARTIFACT_NAME }}
    env:
      SHARED_ROOT_DIR: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get Module Version
        id: get_version
        working-directory: ${{ env.ADMIN_DIRECTORY }}
        run: |
          MODULE_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "MODULE_VERSION=${MODULE_VERSION}" >> $GITHUB_OUTPUT

      - name: Prepare Dockerizing
        id: prepare
        run: |
          mkdir -p ${{ env.ADMIN_DIRECTORY }}/.release
          DOCKER_IMAGE_TAR_NAME="${{ env.ADMIN_DOCKER_IMAGE_NAME }}-v${{ steps.get_version.outputs.MODULE_VERSION }}.tar"
          DOCKER_IMAGE_TAR_GZ_PATH="${{ env.ADMIN_DIRECTORY }}/.release/${DOCKER_IMAGE_TAR_NAME}.gz"
          echo "DOCKER_IMAGE_TAR_NAME=${DOCKER_IMAGE_TAR_NAME}" >> $GITHUB_OUTPUT
          echo "DOCKER_IMAGE_TAR_GZ_PATH=${DOCKER_IMAGE_TAR_GZ_PATH}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:v0.22.0

      - name: Dockerize Admin
        run: |
          docker buildx build --load \
            --cache-from type=gha,scope=admin \
            --cache-to type=gha,mode=max,scope=admin \
            --progress=plain \
            -f ${{ env.ADMIN_DIRECTORY }}/Dockerfile \
            -t ${{ env.ADMIN_DOCKER_IMAGE_NAME }}:v${{ steps.get_version.outputs.MODULE_VERSION }} \
            ${{ env.SHARED_ROOT_DIR }}

      - name: Export Docker Image
        run: |
          docker save ${{ env.ADMIN_DOCKER_IMAGE_NAME }}:v${{ steps.get_version.outputs.MODULE_VERSION }} \
            -o ${{ env.ADMIN_DIRECTORY }}/.release/${{ steps.prepare.outputs.DOCKER_IMAGE_TAR_NAME }}

      - name: GZip Docker Image
        working-directory: ${{ env.ADMIN_DIRECTORY }}/.release
        run: gzip -c -f ${{ steps.prepare.outputs.DOCKER_IMAGE_TAR_NAME }} > ${{ steps.prepare.outputs.DOCKER_IMAGE_TAR_NAME }}.gz

      - name: Store Docker Image
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ADMIN_DOCKER_ARTIFACT_NAME }}
          path: ${{ steps.prepare.outputs.DOCKER_IMAGE_TAR_GZ_PATH }}
          retention-days: 1

  build_sefaria_mongo_docker:
    name: Build Sefaria MongoDB Docker Image
    needs: [setup_env, determine_changes, determine_docker_image_availability]
    if: ${{ needs.determine_docker_image_availability.outputs.is_sefaria_mongo_available != 'true' && (needs.determine_changes.outputs.data_module_changed == 'true' || needs.determine_changes.outputs.data_ci_changed == 'true') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # GitHub caps fork PR tokens to read-only, so only trusted runs can publish.
      packages: write
    steps:
      # Free disk space for the MongoDB Docker image build (~10GB+ needed for mongorestore)
      # Enable large-packages and docker-images to maximize available space
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:v0.22.0

      - name: Log In To GitHub Container Registry
        if: ${{ needs.determine_docker_image_availability.outputs.can_publish_sefaria_mongo == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build And Publish Sefaria MongoDB Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.SEFARIA_MONGO_DOCKER_DIRECTORY }}/
          file: ${{ env.SEFARIA_MONGO_DOCKER_DIRECTORY }}/Dockerfile
          tags: ${{ needs.determine_docker_image_availability.outputs.sefaria_mongo_image }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: ${{ needs.determine_docker_image_availability.outputs.can_publish_sefaria_mongo == 'true' && 'type=registry,compression=zstd,force-compression=true,oci-mediatypes=true' || 'type=docker,dest=/tmp/sefaria-mongo-image.tar' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Store Docker Image
        if: ${{ needs.determine_docker_image_availability.outputs.can_publish_sefaria_mongo != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SEFARIA_MONGO_IMAGE_ARTIFACT_NAME }}
          path: /tmp/sefaria-mongo-image.tar
          retention-days: 90

  # ACTUAL JOBS
  website_performance:
    # Owns the production build gate; Website CI uses the instrumented dev server.
    name: Website Performance
    runs-on: ubuntu-latest
    needs: [setup_env, determine_changes, determine_baseline_availability, perushim_data]
    if: >-
      ${{ always() && !cancelled() &&
        needs.setup_env.result == 'success' &&
        needs.determine_changes.result == 'success' &&
        needs.determine_baseline_availability.result == 'success' &&
        (needs.determine_changes.outputs.website_module_changed == 'true' || needs.determine_changes.outputs.website_ci_changed == 'true' || needs.determine_baseline_availability.outputs.is_website_master_coverage_available == 'false')
      }}
    defaults:
      run:
        working-directory: ${{ env.WEBSITE_DIRECTORY }}
    permissions:
      actions: read # Required to fetch master baseline artifacts through the REST API
      checks: write # Required by Bencher to create GitHub Check on push to master
      pull-requests: write # Required by Bencher to add comment on PRs

    # sccache wraps every rustc call in jobs that install it; per-object cache
    # complements rust-cache's whole-target-dir reuse when a key misses. Set
    # per-job: version-only jobs (package_*, shared-dockerize) run cargo on the
    # runner without sccache on PATH, so a global wrapper breaks them.
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2 # Inspect the actual base of the tested PR merge.

      - name: Merge and audit approved recitation timings
        run: |
          python ../../data/recitation/publish.py
          python ../../data/recitation/audit.py

      - name: Setup bun, Node.js and dependencies
        id: bun-cache
        uses: ./.github/actions/setup-js
        with:
          module: website
          directory: ${{ env.WEBSITE_DIRECTORY }}
          playwright-version: ${{ needs.setup_env.outputs.website_playwright_version }}

      # bun install --frozen-lockfile is done here, so ~/.bun/install/cache is frozen — the tar+upload can run in
      # the background; the implicit wait-all before job cleanup completes it.
      - name: Save bun store cache
        if: ${{ github.ref == 'refs/heads/master' && steps.bun-cache.outputs.cache-hit != 'true' }}
        background: true
        uses: ./.github/actions/save-bun-store
        with:
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      # The browser install only needs node_modules; it runs in the background
      # across MySQL/Rust/populate/build and is gated before the perf test. On
      # a binary-cache hit only the system dependencies are installed.
      # Every suite runs headless, so --only-shell skips the headed Chromium
      # build and downloads only the headless shell.
      - name: Install Playwright Browsers
        id: playwright-install
        background: true
        run: |
          if [ "${{ steps.bun-cache.outputs.playwright-cache-hit }}" = "true" ]; then
            bun x playwright install-deps chromium
          else
            bun x playwright install --with-deps --only-shell chromium
          fi

      - name: Restore Next.js build cache
        id: nextjs-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.WEBSITE_DIRECTORY }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles(format('{0}/bun.lock', env.WEBSITE_DIRECTORY)) }}-${{ hashFiles(format('{0}/**/*.js', env.WEBSITE_DIRECTORY), format('{0}/**/*.jsx', env.WEBSITE_DIRECTORY), format('{0}/**/*.ts', env.WEBSITE_DIRECTORY), format('{0}/**/*.tsx', env.WEBSITE_DIRECTORY)) }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles(format('{0}/bun.lock', env.WEBSITE_DIRECTORY)) }}-

      # ============ MySQL + Perushim Setup for SSG ============
      # Populate MySQL with perushim data so `next build` can statically
      # generate perush pages without "Access denied" errors.
      # Prefers the current workflow's artifact (from perushim_data job) over
      # the master baseline so pipeline code changes take effect immediately.
      - name: Install and start MySQL
        if: ${{ needs.perushim_data.result == 'success' || needs.determine_baseline_availability.outputs.is_perushim_data_sql_available == 'true' }}
        id: mysql
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: "8.4"
          root-password: test_123
          distribution: "mysql"
          auto-start: true

      - name: Download perushim SQL
        if: ${{ needs.perushim_data.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: perushim-data-sql
          path: ${{ env.DATA_DIRECTORY }}/mysql/perushim-sql-master

      - name: Download perushim SQL master baseline
        if: ${{ needs.perushim_data.result != 'success' && needs.determine_baseline_availability.outputs.is_perushim_data_sql_available == 'true' }}
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="${{ env.PERUSHIM_DATA_SQL_ARTIFACT_NAME_MASTER }}"
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME" \
            --jq "[.artifacts[] | select(.expired == false)] | first | .id")
          test -n "$ARTIFACT_ID" && test "$ARTIFACT_ID" != "null"
          mkdir -p "${{ env.DATA_DIRECTORY }}/mysql/perushim-sql-master"
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/$ARTIFACT_NAME.zip"
          unzip -o "$RUNNER_TEMP/$ARTIFACT_NAME.zip" -d "${{ env.DATA_DIRECTORY }}/mysql/perushim-sql-master"

      - name: Setup Rust
        if: ${{ needs.perushim_data.result == 'success' || needs.determine_baseline_availability.outputs.is_perushim_data_sql_available == 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-make
        if: ${{ needs.perushim_data.result == 'success' || needs.determine_baseline_availability.outputs.is_perushim_data_sql_available == 'true' }}
        uses: taiki-e/install-action@v2
        with:
          # Current CLI ZIP dependency tracking: https://github.com/bible-on-site/bible-on-site/issues/2826
          tool: cargo-make@0.37.24

      - name: Cache Cargo dependencies
        if: ${{ needs.perushim_data.result == 'success' || needs.determine_baseline_availability.outputs.is_perushim_data_sql_available == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: ${{ env.DATA_DIRECTORY }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Populate MySQL for build
        if: ${{ needs.perushim_data.result == 'success' || needs.determine_baseline_availability.outputs.is_perushim_data_sql_available == 'true' }}
        working-directory: ${{ env.DATA_DIRECTORY }}
        env:
          DB_URL: mysql://root:test_123@127.0.0.1:3306/tanah_test
        run: |
          cp mysql/perushim-sql-master/perushim_data.sql mysql/perushim_data.sql
          cargo make mysql-populate

      - name: Build
        id: bun-build
        env:
          DB_URL: ${{ (needs.perushim_data.result == 'success' || needs.determine_baseline_availability.outputs.is_perushim_data_sql_available == 'true') && 'mysql://root:test_123@127.0.0.1:3306/tanah_test' || '' }}
        run: bun run build

      - name: Save Next.js build cache
        if: ${{ github.ref == 'refs/heads/master' && steps.nextjs-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.WEBSITE_DIRECTORY }}/.next/cache
          key: ${{ steps.nextjs-cache.outputs.cache-primary-key }}

      - name: Verify approved recitation in the production build
        run: node scripts/verify-recitation-build.mjs

      - name: Wait for Playwright install
        wait: playwright-install

      # Saved after the wait: the cache key's payload is what the background
      # install produced. The upload itself backgrounds too — nothing writes
      # ~/.cache/ms-playwright afterwards.
      - name: Save playwright binaries
        if: ${{ github.ref == 'refs/heads/master' && steps.bun-cache.outputs.playwright-cache-hit != 'true' }}
        background: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.bun-cache.outputs.playwright-cache-primary-key }}

      - name: Test performance reporting
        run: bun run test:perf-reporting

      - name: Perf Test
        id: bun-perf-test
        run: bun run test:perf

      - name: Store Website Performance Diagnostics
        id: perf-diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: website-perf-diagnostics-${{ github.run_id }}
          path: ${{ env.WEBSITE_DIRECTORY }}/.playwright-report/perf/diagnostics
          retention-days: 14
          if-no-files-found: error

      - name: Publish performance diagnostics summary
        if: ${{ !cancelled() }}
        shell: bash
        env:
          DIAGNOSTICS_URL: ${{ steps.perf-diagnostics.outputs.artifact-url }}
        run: |
          if [ -f .playwright-report/perf/diagnostics/lighthouse/summary.md ]; then
            printf '[Full Lighthouse diagnostics](%s)\n\n' "$DIAGNOSTICS_URL" >> "$GITHUB_STEP_SUMMARY"
            sed -E 's/\[(JSON|HTML)\]\([^)]*\)/\1 in artifact/g' .playwright-report/perf/diagnostics/lighthouse/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Bencher CLI
        uses: bencherdev/bencher@main

      - name: Track Performance with Bencher
        env:
          BENCHER_PROJECT: bible-on-site-website
          BENCHER_BRANCH: ${{ github.head_ref || github.ref_name }} # PR source branch, or branch name on push
        run: |
          # Fail before reporting if an event cannot identify its base. Keep
          # master push history intact; reset only feature/queue comparisons.
          node "$GITHUB_WORKSPACE/devops/github/ci/bencher-comparison.mjs" > "$RUNNER_TEMP/bencher-comparison-args.txt"
          mapfile -t BENCHER_COMPARISON_ARGS < "$RUNNER_TEMP/bencher-comparison-args.txt"
          # CLS gets a dedicated measure with a static boundary: a percentage
          # test on a zero CLS baseline collapses the upper boundary limit to
          # 0, so every nonzero (still-good) reading alerts (#2718). Static
          # tests reject the sample-size and window options. 0.1 is the
          # Lighthouse "good" CLS bound. Bencher zips repeated --threshold-*
          # options positionally across groups, so cls_ratio must pass
          # --threshold-max-sample-size _ to leave it unset (#2718).
          bencher run \
            --project "$BENCHER_PROJECT" \
            --token "${{ secrets.BENCHER_API_TOKEN }}" \
            --branch "$BENCHER_BRANCH" \
            "${BENCHER_COMPARISON_ARGS[@]}" \
            --testbed ubuntu-latest \
            --adapter json \
            --github-actions '${{ secrets.GITHUB_TOKEN }}' \
            --file .playwright-report/perf/bencher/benchmark.json \
            --threshold-measure time_ms --threshold-test percentage --threshold-max-sample-size 64 --threshold-upper-boundary 5.00 --threshold-lower-boundary _ \
            --threshold-measure memory_mb --threshold-test percentage --threshold-max-sample-size 64 --threshold-upper-boundary 5.00 --threshold-lower-boundary _ \
            --threshold-measure size_mb --threshold-test percentage --threshold-max-sample-size 64 --threshold-upper-boundary 5.00 --threshold-lower-boundary _ \
            --threshold-measure score --threshold-test percentage --threshold-max-sample-size 64 --threshold-upper-boundary _ --threshold-lower-boundary 5.00 \
            --threshold-measure ratio --threshold-test percentage --threshold-max-sample-size 64 --threshold-upper-boundary 20.00 --threshold-lower-boundary _ \
            --threshold-measure cls_ratio --threshold-test static --threshold-max-sample-size _ --threshold-upper-boundary 0.1 --threshold-lower-boundary _ \
            --threshold-measure bytes --threshold-test percentage --threshold-max-sample-size 64 --threshold-upper-boundary 5.00 --threshold-lower-boundary _ \
            --threshold-measure count --threshold-test percentage --threshold-max-sample-size 64 --threshold-upper-boundary 10.00 --threshold-lower-boundary _ \

      - name: Store Website Perf HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: website-perf-html-report-${{ github.run_id }}
          path: ${{ env.WEBSITE_DIRECTORY }}/.playwright-report/perf/html
          retention-days: 7
          overwrite: true

      - name: Store Website Perf JUnit Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WEBSITE_PERF_JUNIT_REPORT_ARTIFACT_NAME }}
          path: ${{ env.WEBSITE_DIRECTORY }}/.playwright-report/perf/junit/perf-results.xml
          retention-days: 1
          overwrite: true

  website_e2e:
    name: Website CI
    runs-on: ubuntu-latest
    needs:
      [
        setup_env,
        determine_changes,
        determine_baseline_availability,
        determine_docker_image_availability,
        perushim_data,
      ]
    if: >-
      ${{ always() && !cancelled() &&
        needs.setup_env.result == 'success' &&
        needs.determine_changes.result == 'success' &&
        needs.determine_baseline_availability.result == 'success' &&
        (needs.determine_docker_image_availability.result == 'success' || needs.determine_docker_image_availability.result == 'skipped') &&
        (needs.determine_changes.outputs.website_module_changed == 'true' || needs.determine_changes.outputs.website_ci_changed == 'true' || needs.determine_baseline_availability.outputs.is_website_master_coverage_available == 'false')
      }}
    defaults:
      run:
        working-directory: ${{ env.WEBSITE_DIRECTORY }}
    permissions:
      contents: read
      # Reads the master coverage-tree baseline artifacts through the REST API.
      actions: read

    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Merge and audit approved recitation timings
        run: |
          python ../../data/recitation/publish.py
          python ../../data/recitation/audit.py

      - name: Setup bun, Node.js and dependencies
        id: bun-cache
        uses: ./.github/actions/setup-js
        with:
          module: website
          directory: ${{ env.WEBSITE_DIRECTORY }}
          playwright-version: ${{ needs.setup_env.outputs.website_playwright_version }}

      # Unit tests verify the shipped native decoder through its app-owned
      # generator (scripts/check-opus-decoder.mjs), which resolves esbuild
      # and the decoder packages from this manifest (#2391).
      - name: Install recitation decoder dependencies
        run: bun install --cwd ../../app/devops/recitation-decoder --frozen-lockfile

      # Both bun install --frozen-lockfile runs are done here, so ~/.bun/install/cache is frozen — the tar+upload
      # can run in the background; the implicit wait-all before job cleanup completes it.
      - name: Save bun store cache
        if: ${{ github.ref == 'refs/heads/master' && steps.bun-cache.outputs.cache-hit != 'true' }}
        background: true
        uses: ./.github/actions/save-bun-store
        with:
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      - name: Verify Lockfile Sync With Packaging bun
        id: bun_lockfile_packaging_check
        # The Package Website Docker build runs `bun install --frozen-lockfile` with
        # the bun binary copied from the pinned oven/bun image, which may resolve a
        # desync the runner bun tolerates differently — so validate here with the
        # exact same image on every run (packaging jobs are master-only).
        # Mount read-only and copy inside so the install writes nothing to the
        # checkout.
        run: docker run --rm -v "$PWD":/src:ro oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a sh -c "mkdir /app && cp /src/package.json /src/bun.lock /src/bunfig.toml /app/ && cd /app && bun install --frozen-lockfile --ignore-scripts"

      # The browser install only needs node_modules; it runs in the background
      # across lint/unit/MySQL/Rust and is gated before E2E. On a binary-cache
      # hit only the system dependencies are installed.
      # Every suite runs headless, so --only-shell skips the headed Chromium
      # build and downloads only the headless shell.
      - name: Install Playwright Browsers
        id: playwright-install
        background: true
        run: |
          if [ "${{ steps.bun-cache.outputs.playwright-cache-hit }}" = "true" ]; then
            bun x playwright install-deps chromium
          else
            bun x playwright install --with-deps --only-shell chromium
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          # Current CLI ZIP dependency tracking: https://github.com/bible-on-site/bible-on-site/issues/2826
          tool: cargo-make@0.37.24

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: ${{ env.DATA_DIRECTORY }}
          # Release-profile cache shared with admin_ci; data_ci keeps its own
          # key because its coverage builds produce debug-profile artifacts.
          shared-key: "e2e-release-crates"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Build only the seeders used by the E2E launchers, not every data
      # pipeline. Both shared-key consumers must build the same crate set:
      # rust-cache never overwrites an existing key, so whichever job saves
      # first must persist the full artifact set (db-populator + s3-populator).
      # The build runs in the background across the JS track; `wait` before the
      # E2E step is the gate.
      - name: Pre-build data crate for E2E tests
        id: crates
        background: true
        working-directory: ${{ env.DATA_DIRECTORY }}
        run: cargo build --release -p db-populator -p s3-populator

      - name: Lint
        id: bun-lint
        run: bun run lint

      - name: Unit Test
        id: bun-unit-test
        run: bun run coverage:unit

      - name: Store Website Unit JUnit Report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WEBSITE_UNIT_JUNIT_REPORT_ARTIFACT_NAME }}
          path: ${{ env.WEBSITE_DIRECTORY }}/.jest-report/unit-results.xml
          retention-days: 1
          overwrite: true

      # ============ MySQL Setup for Articles ============
      - name: Install and start MySQL
        id: mysql
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: "8.4"
          root-password: test_123
          distribution: "mysql"
          auto-start: true

      # The E2E launcher populates MySQL once before starting next dev. Restore
      # its SQL input here, preferring this run's generated data over the baseline.
      - name: Download perushim SQL
        if: ${{ needs.perushim_data.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: perushim-data-sql
          path: ${{ env.DATA_DIRECTORY }}/mysql/perushim-sql-master

      - name: Download perushim SQL master baseline
        if: ${{ needs.perushim_data.result != 'success' && needs.determine_baseline_availability.outputs.is_perushim_data_sql_available == 'true' }}
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="${{ env.PERUSHIM_DATA_SQL_ARTIFACT_NAME_MASTER }}"
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME" \
            --jq "[.artifacts[] | select(.expired == false)] | first | .id")
          test -n "$ARTIFACT_ID" && test "$ARTIFACT_ID" != "null"
          mkdir -p "${{ env.DATA_DIRECTORY }}/mysql/perushim-sql-master"
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/$ARTIFACT_NAME.zip"
          unzip -o "$RUNNER_TEMP/$ARTIFACT_NAME.zip" -d "${{ env.DATA_DIRECTORY }}/mysql/perushim-sql-master"

      - name: Prepare perushim SQL for E2E database population
        if: ${{ needs.perushim_data.result == 'success' || needs.determine_baseline_availability.outputs.is_perushim_data_sql_available == 'true' }}
        working-directory: ${{ env.DATA_DIRECTORY }}
        run: cp mysql/perushim-sql-master/perushim_data.sql mysql/perushim_data.sql

      # Gates for the background installs started above: browsers on the JS
      # side, seeder crates for the E2E launcher.
      - name: Wait for Playwright install
        wait: playwright-install

      - name: Wait for data crate build
        wait: crates

      # Saved after the wait: the cache key's payload is what the background
      # install produced. The upload itself backgrounds too — nothing writes
      # ~/.cache/ms-playwright afterwards.
      - name: Save playwright binaries
        if: ${{ github.ref == 'refs/heads/master' && steps.bun-cache.outputs.playwright-cache-hit != 'true' }}
        background: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.bun-cache.outputs.playwright-cache-primary-key }}

      # The e2e-impact coverage tree is published only by successful master
      # push runs. A missing baseline is not an error — the selector falls
      # back to the full suite (#2085).
      - name: Download e2e-impact coverage baseline
        id: impact-baseline
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node devops/github/ci/e2e-impact/e2e-impact.ts baseline-download \
            --name "${{ env.WEBSITE_E2E_IMPACT_ARTIFACT_NAME_MASTER }}" \
            --out "$GITHUB_WORKSPACE/web/bible-on-site/.coverage/e2e-impact/baseline"

      # Shadow mode computes the deterministic subset for evidence while the
      # suite still runs everything. A missing, stale or incompatible baseline,
      # an undeterminable diff or a discovery problem resolves to selectAll —
      # never to a silently empty run.
      - name: Select affected E2E tests (shadow)
        id: impact-selection
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASELINE_ARGS=()
          if [ "${{ steps.impact-baseline.outputs.available }}" == "true" ]; then
            BASELINE_ARGS=(--baseline "${{ steps.impact-baseline.outputs.baseline-file }}")
          fi
          node devops/github/ci/e2e-impact/e2e-impact.ts select \
            --suite web/bible-on-site \
            --platform web \
            --tested-sha "${{ github.sha }}" \
            --out "$GITHUB_WORKSPACE/web/bible-on-site/.coverage/e2e-impact/selection-manifest.json" \
            --compare "${BASELINE_ARGS[@]}"

      # coverage:e2e starts next dev; the production build and standalone-server
      # checks run in Website Performance, which remains a Cross Module CI gate.
      # Enforce mode (#2085) consumes the manifest into concrete Playwright
      # args. Dynamic test files cannot be filtered by title, so a `--list`
      # enumeration (which still emits discovered.json under coverage)
      # supplies their titles first.
      - name: Resolve selection args (enforce)
        if: env.E2E_SELECTION_MODE == 'enforce'
        id: impact-args
        working-directory: ${{ github.workspace }}
        run: |
          DISCOVERED_ARGS=()
          DYNAMIC=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('$GITHUB_WORKSPACE/web/bible-on-site/.coverage/e2e-impact/selection-manifest.json','utf8')).dynamicTestFiles.length)")
          if [ "$DYNAMIC" != "0" ]; then
            (cd web/bible-on-site && bun run coverage:e2e -- --list)
            DISCOVERED_ARGS=(--discovered "$GITHUB_WORKSPACE/web/bible-on-site/.coverage/e2e-impact/discovered.json")
          fi
          node devops/github/ci/e2e-impact/e2e-impact.ts playwright-args \
            --suite web/bible-on-site \
            --package-dir web/bible-on-site \
            --manifest "$GITHUB_WORKSPACE/web/bible-on-site/.coverage/e2e-impact/selection-manifest.json" \
            --out "$GITHUB_WORKSPACE/web/bible-on-site/.coverage/e2e-impact/playwright-args.json" "${DISCOVERED_ARGS[@]}"

      # The run also drops e2e-impact evidence under .coverage/e2e-impact/.
      - name: E2E Test
        id: bun-e2e-test
        env:
          DB_URL: mysql://root:test_123@127.0.0.1:3306/tanah_test
        run: |
          if [ "${{ env.E2E_SELECTION_MODE }}" == "enforce" ] && [ "${{ steps.impact-args.outputs.select-all }}" != "true" ]; then
            FILES=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('.coverage/e2e-impact/playwright-args.json','utf8')).files.join(' '))")
            GREP=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('.coverage/e2e-impact/playwright-args.json','utf8')).grep ?? '')")
            if [ -n "$GREP" ]; then
              bun run coverage:e2e -- $FILES --grep "$GREP"
            else
              bun run coverage:e2e -- $FILES
            fi
          else
            bun run coverage:e2e
          fi

      # Evidence is collected even after a failed run — passed tests keep
      # their coverage — but the tree marks incomplete so a partial run can
      # never shrink the trusted baseline.
      - name: Collect per-test coverage evidence
        if: always()
        id: impact-collect
        working-directory: ${{ github.workspace }}
        env:
          E2E_OUTCOME: ${{ steps.bun-e2e-test.outcome }}
        run: |
          INCOMPLETE_ARGS=()
          if [ "$E2E_OUTCOME" != "success" ]; then
            INCOMPLETE_ARGS=(--incomplete)
          fi
          node devops/github/ci/e2e-impact/e2e-impact.ts collect-playwright \
            --suite web/bible-on-site \
            --platform web \
            --artifacts "$GITHUB_WORKSPACE/web/bible-on-site/.coverage/e2e-impact" \
            --snapshot-sha "${{ github.sha }}" \
            --out "$GITHUB_WORKSPACE/web/bible-on-site/.coverage/e2e-impact/coverage-tree.json" "${INCOMPLETE_ARGS[@]}"
          # Only a complete tree may replace the trusted master baseline.
          COMPLETE=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('$GITHUB_WORKSPACE/web/bible-on-site/.coverage/e2e-impact/coverage-tree.json','utf8')).complete === true)")
          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"

      # Shadow-mode parity (#2085): score the pre-run selection against the
      # outcomes this full run observed — an unselected failure is the parity
      # miss the rollout gate counts before enforcement. Pure diagnostics:
      # missing or mismatched inputs produce a problem report, never a red job.
      - name: Verify shadow selection parity
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          node devops/github/ci/e2e-impact/e2e-impact.ts verify \
            --manifest "$GITHUB_WORKSPACE/web/bible-on-site/.coverage/e2e-impact/selection-manifest.json" \
            --tree "$GITHUB_WORKSPACE/web/bible-on-site/.coverage/e2e-impact/coverage-tree.json" \
            --out "$GITHUB_WORKSPACE/web/bible-on-site/.coverage/e2e-impact/selection-verify.json"

      # Selection manifest + collected tree for shadow-mode inspection.
      - name: Store e2e-impact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: website-e2e-impact-${{ github.run_id }}
          path: |
            web/bible-on-site/.coverage/e2e-impact/selection-manifest.json
            web/bible-on-site/.coverage/e2e-impact/selection-verify.json
            web/bible-on-site/.coverage/e2e-impact/coverage-tree.json
            web/bible-on-site/.coverage/e2e-impact/test-results.json
            web/bible-on-site/.coverage/e2e-impact/discovered.json
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

      # The authoritative baseline is published only from a completed,
      # successful default-branch run; PR and merge-queue evidence stays
      # provisional inside the run's diagnostics artifact.
      - name: Publish e2e-impact coverage baseline
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.bun-e2e-test.outcome == 'success' && steps.impact-collect.outcome == 'success' && steps.impact-collect.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WEBSITE_E2E_IMPACT_ARTIFACT_NAME_MASTER }}
          path: web/bible-on-site/.coverage/e2e-impact/coverage-tree.json
          retention-days: 90
          overwrite: true

      - name: Store Website E2E HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: website-e2e-html-report-${{ github.run_id }}
          # `setup/` holds launcher.log + the teed next dev server.log, needed
          # to attribute dev-server errors on failures (#2005).
          path: |
            ${{ env.WEBSITE_DIRECTORY }}/.playwright-report/e2e/html
            ${{ env.WEBSITE_DIRECTORY }}/.playwright-report/setup
          retention-days: 7
          overwrite: true

      - name: Store Website E2E JUnit Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WEBSITE_E2E_JUNIT_REPORT_ARTIFACT_NAME }}
          path: ${{ env.WEBSITE_DIRECTORY }}/.playwright-report/e2e/junit/e2e-results.xml
          retention-days: 1
          overwrite: true

      - name: Show Website E2E Debug Logs
        if: ${{ failure() }}
        working-directory: ${{ env.WEBSITE_DIRECTORY }}
        run: |
          echo "=== launcher.log ==="
          cat .playwright-report/setup/launcher.log 2>/dev/null || echo "(no launcher.log)"
          echo "=== next dev server.log (tail) ==="
          tail -n 300 .playwright-report/setup/server.log 2>/dev/null || echo "(no server.log)"

      # The published website report merges both test layers as a plain
      # union of --require inputs. Both enumerate the same canonical
      # universe: sanitizeCoverage projects every collected record onto the
      # coordinates jest's transform emits for the file and drops records
      # that name no real instrumentable src file, so dev-server generated
      # modules and compile-variant coordinates can never reach the merge
      # (#2670).
      - name: Merge Test Coverage (Unit + E2E)
        run: bun run coverage:merge

      - name: Store Coverage Debug Snippets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: website-coverage-debug-${{ github.run_id }}
          path: ${{ env.WEBSITE_DIRECTORY }}/.coverage/debug
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

      - name: Store Website Coverage Report (wf)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WEBSITE_COVERAGE_ARTIFACT_NAME_WF }}
          path: ${{ env.WEBSITE_MERGED_COVERAGE_REPORT }}
          retention-days: 90
          overwrite: true
          if-no-files-found: error

      - name: Store Website Coverage Report (master)
        if: ${{ env.IS_MASTER_BRANCH == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WEBSITE_COVERAGE_ARTIFACT_NAME_MASTER }}
          path: ${{ env.WEBSITE_MERGED_COVERAGE_REPORT }}
          retention-days: 90
          overwrite: true

  admin_ci:
    name: Admin CI
    runs-on: ubuntu-latest
    needs: [setup_env, determine_changes, determine_baseline_availability]
    if: ${{ needs.determine_changes.outputs.admin_module_changed == 'true' || needs.determine_changes.outputs.admin_ci_changed == 'true' || needs.determine_baseline_availability.outputs.is_admin_master_coverage_available == 'false' }}
    defaults:
      run:
        working-directory: ${{ env.ADMIN_DIRECTORY }}
    permissions:
      contents: read
      # Reads the master coverage-tree baseline artifacts through the REST API.
      actions: read

    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # RustFS + bucket init only need the checked-out compose files and the
      # docker daemon, so the whole stack (image pulls included) runs in the
      # background across the JS toolchain installs; `wait` before the S3
      # compatibility check is the gate.
      - name: Start RustFS and initialize S3 buckets
        id: rustfs
        background: true
        working-directory: ${{ github.workspace }}
        run: |
          if ! docker compose -f devops/docker-compose.yml up -d --wait --wait-timeout 180; then
            docker compose -f devops/docker-compose.yml logs
            exit 1
          fi
          docker compose -f devops/docker-compose.yml run --build --rm --no-deps rustfs-init

      - name: Setup bun, Node.js and dependencies
        id: bun-cache
        uses: ./.github/actions/setup-js
        with:
          module: admin
          directory: ${{ env.ADMIN_DIRECTORY }}
          playwright-version: ${{ needs.setup_env.outputs.admin_playwright_version }}

      # bun install --frozen-lockfile is done here, so ~/.bun/install/cache is frozen — the tar+upload can run in
      # the background; the implicit wait-all before job cleanup completes it.
      - name: Save bun store cache
        if: ${{ github.ref == 'refs/heads/master' && steps.bun-cache.outputs.cache-hit != 'true' }}
        background: true
        uses: ./.github/actions/save-bun-store
        with:
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      - name: Verify Lockfile Sync With Packaging bun
        id: bun_lockfile_packaging_check
        # The Package Admin Docker build runs `bun install --frozen-lockfile` with
        # the bun binary copied from the pinned oven/bun image, which may resolve a
        # desync the runner bun tolerates differently — so validate here with the
        # exact same image on every run (packaging jobs are master-only).
        # Mount read-only and copy inside so the install writes nothing to the
        # checkout.
        run: docker run --rm -v "$PWD":/src:ro oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a sh -c "mkdir /app && cp /src/package.json /src/bun.lock /src/bunfig.toml /app/ && cd /app && bun install --frozen-lockfile --ignore-scripts"

      # The browser install only needs node_modules; it runs in the background
      # across lint/typecheck/unit/build and is gated before E2E. On a
      # binary-cache hit only the system dependencies are installed.
      # Every suite runs headless, so --only-shell skips the headed Chromium
      # build and downloads only the headless shell.
      - name: Install Playwright Browsers
        id: playwright-install
        background: true
        run: |
          if [ "${{ steps.bun-cache.outputs.playwright-cache-hit }}" = "true" ]; then
            bun x playwright install-deps chromium
          else
            bun x playwright install --with-deps --only-shell chromium
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          # Current CLI ZIP dependency tracking: https://github.com/bible-on-site/bible-on-site/issues/2826
          tool: cargo-make@0.37.24

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: ${{ env.DATA_DIRECTORY }}
          # Same release-profile populator cache as website_ci.
          shared-key: "e2e-release-crates"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Build only the two seeders used by the E2E launcher.
      # This prevents timeout when the E2E launcher runs cargo make mysql-populate and s3-populate-test.
      # The build runs in the background across the JS track; `wait` before the
      # E2E step is the gate.
      - name: Pre-build data crates for E2E tests
        id: crates
        background: true
        working-directory: ${{ env.DATA_DIRECTORY }}
        run: cargo build --release -p db-populator -p s3-populator

      - name: Lint
        id: bun-lint
        run: bun run lint

      - name: Type Check
        id: bun-typecheck
        run: bun x tsc --noEmit

      - name: Unit Test with Coverage
        id: bun-unit-test
        run: >-
          bun run coverage:unit --reporter=default --reporter=github-actions
          --reporter=junit --outputFile.junit=.junit-report/unit-results.xml

      - name: Build
        id: bun-build
        run: bun run build

      - name: Store Admin Unit JUnit Report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ADMIN_UNIT_JUNIT_REPORT_ARTIFACT_NAME }}
          path: ${{ env.ADMIN_DIRECTORY }}/.junit-report/unit-results.xml
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      # ============ MySQL Setup for E2E Tests ============
      - name: Install and start MySQL
        id: mysql
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: "8.4"
          root-password: test_123
          distribution: "mysql"
          auto-start: true

      # A fresh random schema exercises real locks, quota reservations and the
      # additive deployment parser without altering the E2E database.
      - name: Verify WhatsApp migration and concurrent claims with MySQL
        env:
          BULLETIN_MYSQL_TEST_DB_URL: mysql://root:test_123@127.0.0.1:3306/
        run: bun run test:mysql

      - name: Wait for RustFS and S3 buckets
        wait: rustfs

      - name: Verify local S3 compatibility
        working-directory: ${{ env.ADMIN_DIRECTORY }}
        env:
          S3_ENDPOINT: http://localhost:4566
        run: bun run test:s3

      - name: Wait for Playwright install
        wait: playwright-install

      - name: Wait for data crate build
        wait: crates

      # Saved after the wait: the cache key's payload is what the background
      # install produced. The upload itself backgrounds too — nothing writes
      # ~/.cache/ms-playwright afterwards.
      - name: Save playwright binaries
        if: ${{ github.ref == 'refs/heads/master' && steps.bun-cache.outputs.playwright-cache-hit != 'true' }}
        background: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.bun-cache.outputs.playwright-cache-primary-key }}

      # The e2e-impact coverage tree is published only by successful master
      # push runs. A missing baseline is not an error — the selector falls
      # back to the full suite (#2085).
      - name: Download e2e-impact coverage baseline
        id: impact-baseline
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node devops/github/ci/e2e-impact/e2e-impact.ts baseline-download \
            --name "${{ env.ADMIN_E2E_IMPACT_ARTIFACT_NAME_MASTER }}" \
            --out "$GITHUB_WORKSPACE/web/admin/.coverage/e2e-impact/baseline"

      # Shadow mode computes the deterministic subset for evidence while the
      # suite still runs everything. A missing, stale or incompatible baseline,
      # an undeterminable diff or a discovery problem resolves to selectAll —
      # never to a silently empty run.
      - name: Select affected E2E tests (shadow)
        id: impact-selection
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASELINE_ARGS=()
          if [ "${{ steps.impact-baseline.outputs.available }}" == "true" ]; then
            BASELINE_ARGS=(--baseline "${{ steps.impact-baseline.outputs.baseline-file }}")
          fi
          node devops/github/ci/e2e-impact/e2e-impact.ts select \
            --suite web/admin \
            --platform web \
            --tested-sha "${{ github.sha }}" \
            --out "$GITHUB_WORKSPACE/web/admin/.coverage/e2e-impact/selection-manifest.json" \
            --compare "${BASELINE_ARGS[@]}"

      # Enforce mode (#2085) consumes the manifest into concrete Playwright
      # args; a `--list` enumeration supplies dynamic files' titles first.
      - name: Resolve selection args (enforce)
        if: env.E2E_SELECTION_MODE == 'enforce'
        id: impact-args
        working-directory: ${{ github.workspace }}
        run: |
          DISCOVERED_ARGS=()
          DYNAMIC=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('$GITHUB_WORKSPACE/web/admin/.coverage/e2e-impact/selection-manifest.json','utf8')).dynamicTestFiles.length)")
          if [ "$DYNAMIC" != "0" ]; then
            (cd web/admin && bun run coverage:e2e -- --list)
            DISCOVERED_ARGS=(--discovered "$GITHUB_WORKSPACE/web/admin/.coverage/e2e-impact/discovered.json")
          fi
          node devops/github/ci/e2e-impact/e2e-impact.ts playwright-args \
            --suite web/admin \
            --package-dir web/admin \
            --manifest "$GITHUB_WORKSPACE/web/admin/.coverage/e2e-impact/selection-manifest.json" \
            --out "$GITHUB_WORKSPACE/web/admin/.coverage/e2e-impact/playwright-args.json" "${DISCOVERED_ARGS[@]}"

      - name: E2E Test with Coverage
        id: bun-e2e-test
        env:
          DB_URL: mysql://root:test_123@127.0.0.1:3306/tanah_test
          S3_ENDPOINT: http://localhost:4566
          S3_BUCKET: bible-on-site-assets-test
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: test
          S3_SECRET_ACCESS_KEY: test_1234
          S3_FORCE_PATH_STYLE: "true"
        run: |
          if [ "${{ env.E2E_SELECTION_MODE }}" == "enforce" ] && [ "${{ steps.impact-args.outputs.select-all }}" != "true" ]; then
            FILES=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('.coverage/e2e-impact/playwright-args.json','utf8')).files.join(' '))")
            GREP=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('.coverage/e2e-impact/playwright-args.json','utf8')).grep ?? '')")
            if [ -n "$GREP" ]; then
              bun run coverage:e2e -- $FILES --grep "$GREP"
            else
              bun run coverage:e2e -- $FILES
            fi
          else
            bun run coverage:e2e
          fi

      # Evidence is collected even after a failed run — passed tests keep
      # their coverage — but the tree marks incomplete so a partial run can
      # never shrink the trusted baseline.
      - name: Collect per-test coverage evidence
        if: always()
        id: impact-collect
        working-directory: ${{ github.workspace }}
        env:
          E2E_OUTCOME: ${{ steps.bun-e2e-test.outcome }}
        run: |
          INCOMPLETE_ARGS=()
          if [ "$E2E_OUTCOME" != "success" ]; then
            INCOMPLETE_ARGS=(--incomplete)
          fi
          node devops/github/ci/e2e-impact/e2e-impact.ts collect-playwright \
            --suite web/admin \
            --platform web \
            --artifacts "$GITHUB_WORKSPACE/web/admin/.coverage/e2e-impact" \
            --snapshot-sha "${{ github.sha }}" \
            --out "$GITHUB_WORKSPACE/web/admin/.coverage/e2e-impact/coverage-tree.json" "${INCOMPLETE_ARGS[@]}"
          # Only a complete tree may replace the trusted master baseline.
          COMPLETE=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('$GITHUB_WORKSPACE/web/admin/.coverage/e2e-impact/coverage-tree.json','utf8')).complete === true)")
          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"

      # Shadow-mode parity (#2085): score the pre-run selection against the
      # outcomes this full run observed — an unselected failure is the parity
      # miss the rollout gate counts before enforcement. Pure diagnostics:
      # missing or mismatched inputs produce a problem report, never a red job.
      - name: Verify shadow selection parity
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          node devops/github/ci/e2e-impact/e2e-impact.ts verify \
            --manifest "$GITHUB_WORKSPACE/web/admin/.coverage/e2e-impact/selection-manifest.json" \
            --tree "$GITHUB_WORKSPACE/web/admin/.coverage/e2e-impact/coverage-tree.json" \
            --out "$GITHUB_WORKSPACE/web/admin/.coverage/e2e-impact/selection-verify.json"

      # Selection manifest + collected tree for shadow-mode inspection.
      - name: Store e2e-impact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-e2e-impact-${{ github.run_id }}
          path: |
            web/admin/.coverage/e2e-impact/selection-manifest.json
            web/admin/.coverage/e2e-impact/selection-verify.json
            web/admin/.coverage/e2e-impact/coverage-tree.json
            web/admin/.coverage/e2e-impact/test-results.json
            web/admin/.coverage/e2e-impact/discovered.json
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

      # The authoritative baseline is published only from a completed,
      # successful default-branch run; PR and merge-queue evidence stays
      # provisional inside the run's diagnostics artifact.
      - name: Publish e2e-impact coverage baseline
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.bun-e2e-test.outcome == 'success' && steps.impact-collect.outcome == 'success' && steps.impact-collect.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ADMIN_E2E_IMPACT_ARTIFACT_NAME_MASTER }}
          path: web/admin/.coverage/e2e-impact/coverage-tree.json
          retention-days: 90
          overwrite: true

      # The published admin report merges both test layers: unit's V8 report
      # is the canonical universe (every eligible source file enumerated);
      # the istanbul-instrumented E2E layer only confirms hits on shared
      # coordinates (--hits-only, #2270) and can never extend or dilute the
      # denominator. Both inputs are required — a missing layer fails the
      # job instead of publishing a partial report as complete (#2707).
      - name: Merge test coverage (unit + E2E into one admin report)
        run: bun run coverage:merge

      - name: Store Admin Coverage Report (wf)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ADMIN_COVERAGE_ARTIFACT_NAME_WF }}
          # Unit + e2e files too: kept as per-layer diagnostics; the merged
          # file is the single report Codecov's `admin` flag and the
          # cross-module merge consume.
          path: |
            ${{ env.ADMIN_UNIT_COVERAGE_REPORT }}
            ${{ env.ADMIN_E2E_COVERAGE_REPORT }}
            ${{ env.ADMIN_MERGED_COVERAGE_REPORT }}
          retention-days: 90
          overwrite: true
          if-no-files-found: error

      - name: Store Admin Coverage Report (master)
        if: ${{ env.IS_MASTER_BRANCH == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ADMIN_COVERAGE_ARTIFACT_NAME_MASTER }}
          path: |
            ${{ env.ADMIN_UNIT_COVERAGE_REPORT }}
            ${{ env.ADMIN_E2E_COVERAGE_REPORT }}
            ${{ env.ADMIN_MERGED_COVERAGE_REPORT }}
          retention-days: 90
          overwrite: true

      - name: Store Admin E2E HTML Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: admin-e2e-html-report-${{ github.run_id }}
          # The configured report root is hidden; retain only this report tree.
          path: ${{ env.ADMIN_DIRECTORY }}/.playwright-report
          include-hidden-files: true
          retention-days: 7
          overwrite: true

  api_e2e:
    name: API CI
    runs-on: ubuntu-latest
    needs:
      [
        setup_env,
        determine_changes,
        determine_baseline_availability,
        determine_docker_image_availability,
      ]
    if: ${{ always() && !cancelled() && !failure() && (needs.determine_changes.outputs.api_module_changed == 'true' || needs.determine_changes.outputs.api_ci_changed == 'true' || needs.determine_baseline_availability.outputs.is_api_master_coverage_available == 'false') }}
    permissions:
      contents: read
      # Reads the master coverage-tree baseline artifacts through the REST API.
      actions: read

    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: taiki-e/install-action@v2
        with:
          # Current CLI ZIP dependency tracking: https://github.com/bible-on-site/bible-on-site/issues/2826
          tool: cargo-make@0.37.24, cargo-llvm-cov, cargo-nextest

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: |
            ${{ env.API_DIRECTORY }}
            ${{ env.DATA_DIRECTORY }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Lint
        id: lint
        working-directory: ${{ env.API_DIRECTORY }}
        run: cargo make lint

      - name: Unit Test
        id: unit-test
        working-directory: ${{ env.API_DIRECTORY }}
        run: cargo make coverage-unit

      - name: Setup devops bun, Node.js and dependencies
        id: devops-bun-cache
        uses: ./.github/actions/setup-js
        with:
          module: devops
          directory: ${{ env.DEVOPS_DIRECTORY }}

      # The save runs synchronously: the api-tests install below still mutates
      # ~/.bun/install/cache, so the tar must finish before it starts.
      - name: Save bun store cache
        if: ${{ github.ref == 'refs/heads/master' && steps.devops-bun-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/save-bun-store
        with:
          key: ${{ steps.devops-bun-cache.outputs.cache-primary-key }}

      - name: Install and start MySQL
        id: mysql
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: "8.4"
          root-password: test_123
          distribution: "mysql"
          auto-start: true

      # Mock connections cannot prove session-scoped MySQL advisory locks.
      # Run the ignored regression explicitly and add its production-code hits
      # to the existing unit LCOV report before E2E and the normal coverage merge.
      - name: Verify article-search advisory lock with MySQL and coverage
        working-directory: ${{ env.API_DIRECTORY }}
        env:
          MYSQL_PWD: test_123
          ARTICLE_SEARCH_LOCK_TEST_DB_URL: mysql://root:test_123@127.0.0.1:3306/article_search_lock_test
        run: |
          mysql --host=127.0.0.1 --user=root --execute='CREATE DATABASE article_search_lock_test'
          trap 'mysql --host=127.0.0.1 --user=root --execute="DROP DATABASE article_search_lock_test"' EXIT
          cargo make coverage-article-search-lock

      - name: Setup tests bun, Node.js and dependencies
        id: tests-bun-cache
        uses: ./.github/actions/setup-js
        with:
          module: api-tests
          directory: ${{ env.API_TESTS_DIRECTORY }}

      # Both bun install --frozen-lockfile runs are done here, so ~/.bun/install/cache is frozen — the tar+upload
      # can run in the background; implicit wait-all completes it at job end.
      - name: Save bun store cache
        if: ${{ github.ref == 'refs/heads/master' && steps.tests-bun-cache.outputs.cache-hit != 'true' }}
        background: true
        uses: ./.github/actions/save-bun-store
        with:
          key: ${{ steps.tests-bun-cache.outputs.cache-primary-key }}

      # The e2e-impact coverage tree is published only by successful master
      # push runs. A missing baseline is not an error — the selector falls
      # back to the full suite (#2085).
      - name: Download e2e-impact coverage baseline
        id: impact-baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node devops/github/ci/e2e-impact/e2e-impact.ts baseline-download \
            --name "${{ env.API_E2E_IMPACT_ARTIFACT_NAME_MASTER }}" \
            --out "$GITHUB_WORKSPACE/web/api/.coverage/e2e-impact/baseline"

      # Shadow mode computes the deterministic subset for evidence while the
      # suite still runs everything. A missing, stale or incompatible baseline,
      # an undeterminable diff or a discovery problem resolves to selectAll —
      # never to a silently empty run.
      - name: Select affected E2E tests (shadow)
        id: impact-selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASELINE_ARGS=()
          if [ "${{ steps.impact-baseline.outputs.available }}" == "true" ]; then
            BASELINE_ARGS=(--baseline "${{ steps.impact-baseline.outputs.baseline-file }}")
          fi
          node devops/github/ci/e2e-impact/e2e-impact.ts select \
            --suite web/api \
            --platform api \
            --tested-sha "${{ github.sha }}" \
            --out "$GITHUB_WORKSPACE/web/api/.coverage/e2e-impact/selection-manifest.json" \
            --compare "${BASELINE_ARGS[@]}"

      # Enforce mode (#2085) consumes the manifest into concrete Playwright
      # args; a `--list` enumeration supplies dynamic files' titles first.
      - name: Resolve selection args (enforce)
        if: env.E2E_SELECTION_MODE == 'enforce'
        id: impact-args
        working-directory: ${{ github.workspace }}
        run: |
          DISCOVERED_ARGS=()
          DYNAMIC=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('$GITHUB_WORKSPACE/web/api/.coverage/e2e-impact/selection-manifest.json','utf8')).dynamicTestFiles.length)")
          if [ "$DYNAMIC" != "0" ]; then
            (cd web/api && bun run --cwd tests coverage:e2e -- --list)
            DISCOVERED_ARGS=(--discovered "$GITHUB_WORKSPACE/web/api/.coverage/e2e-impact/discovered.json")
          fi
          node devops/github/ci/e2e-impact/e2e-impact.ts playwright-args \
            --suite web/api \
            --package-dir web/api/tests \
            --manifest "$GITHUB_WORKSPACE/web/api/.coverage/e2e-impact/selection-manifest.json" \
            --out "$GITHUB_WORKSPACE/web/api/.coverage/e2e-impact/playwright-args.json" "${DISCOVERED_ARGS[@]}"

      # API tests use Playwright's HTTP request fixture and node:http2 only;
      # they do not launch a browser or need browser/system-dependency installs.
      # The run drops e2e-impact evidence under .coverage/e2e-impact/.
      # Enforce passes the manifest args straight to the same package.json script
      # `cargo make coverage-e2e` wraps (`--prefix tests coverage:e2e`).
      - name: E2E Test
        id: api-e2e
        working-directory: ${{ env.API_DIRECTORY }}
        env:
          DB_URL: mysql://root:test_123@127.0.0.1:3306/tanah_test
        run: |
          if [ "${{ env.E2E_SELECTION_MODE }}" == "enforce" ] && [ "${{ steps.impact-args.outputs.select-all }}" != "true" ]; then
            FILES=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('.coverage/e2e-impact/playwright-args.json','utf8')).files.join(' '))")
            GREP=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('.coverage/e2e-impact/playwright-args.json','utf8')).grep ?? '')")
            if [ -n "$GREP" ]; then
              bun run --cwd tests coverage:e2e -- $FILES --grep "$GREP"
            else
              bun run --cwd tests coverage:e2e -- $FILES
            fi
          else
            cargo make coverage-e2e
          fi

      # Evidence is collected even after a failed run — passed tests keep
      # their coverage — but the tree marks incomplete so a partial run can
      # never shrink the trusted baseline.
      - name: Collect per-test coverage evidence
        if: always()
        id: impact-collect
        env:
          E2E_OUTCOME: ${{ steps.api-e2e.outcome }}
        run: |
          INCOMPLETE_ARGS=()
          if [ "$E2E_OUTCOME" != "success" ]; then
            INCOMPLETE_ARGS=(--incomplete)
          fi
          node devops/github/ci/e2e-impact/e2e-impact.ts collect-playwright \
            --suite web/api \
            --platform api \
            --artifacts "$GITHUB_WORKSPACE/web/api/.coverage/e2e-impact" \
            --snapshot-sha "${{ github.sha }}" \
            --out "$GITHUB_WORKSPACE/web/api/.coverage/e2e-impact/coverage-tree.json" "${INCOMPLETE_ARGS[@]}"
          # Only a complete tree may replace the trusted master baseline.
          COMPLETE=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('$GITHUB_WORKSPACE/web/api/.coverage/e2e-impact/coverage-tree.json','utf8')).complete === true)")
          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"

      # Shadow-mode parity (#2085): score the pre-run selection against the
      # outcomes this full run observed — an unselected failure is the parity
      # miss the rollout gate counts before enforcement. Pure diagnostics:
      # missing or mismatched inputs produce a problem report, never a red job.
      - name: Verify shadow selection parity
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          node devops/github/ci/e2e-impact/e2e-impact.ts verify \
            --manifest "$GITHUB_WORKSPACE/web/api/.coverage/e2e-impact/selection-manifest.json" \
            --tree "$GITHUB_WORKSPACE/web/api/.coverage/e2e-impact/coverage-tree.json" \
            --out "$GITHUB_WORKSPACE/web/api/.coverage/e2e-impact/selection-verify.json"

      # Selection manifest + collected tree for shadow-mode inspection.
      - name: Store e2e-impact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-e2e-impact-${{ github.run_id }}
          path: |
            web/api/.coverage/e2e-impact/selection-manifest.json
            web/api/.coverage/e2e-impact/selection-verify.json
            web/api/.coverage/e2e-impact/coverage-tree.json
            web/api/.coverage/e2e-impact/test-results.json
            web/api/.coverage/e2e-impact/discovered.json
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

      # The authoritative baseline is published only from a completed,
      # successful default-branch run; PR and merge-queue evidence stays
      # provisional inside the run's diagnostics artifact.
      - name: Publish e2e-impact coverage baseline
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.api-e2e.outcome == 'success' && steps.impact-collect.outcome == 'success' && steps.impact-collect.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.API_E2E_IMPACT_ARTIFACT_NAME_MASTER }}
          path: web/api/.coverage/e2e-impact/coverage-tree.json
          retention-days: 90
          overwrite: true

      - name: Show E2E Debug Logs
        if: ${{ always() }}
        working-directory: ${{ env.API_DIRECTORY }}
        run: |
          echo "=== API E2E Debug Logs ==="
          echo "--- Global Setup Log ---"
          cat tests/.log/global-setup.log 2>/dev/null || echo "(no global-setup.log)"
          echo "--- API Server Log ---"
          cat tests/.log/api.log 2>/dev/null || echo "(no api.log)"
          echo "--- API Launcher Log ---"
          cat tests/.log/api_launcher.log 2>/dev/null || echo "(no api_launcher.log)"
          echo "========================="

      - name: Build lcov Docker image
        uses: ./.github/actions/lcov-image

      - name: Merge Test Coverage (Unit + E2E)
        working-directory: ${{ env.API_DIRECTORY }}
        run: cargo make coverage-merge

      - name: Store API Unit JUnit Report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.API_UNIT_JUNIT_REPORT_ARTIFACT_NAME }}
          path: ${{ env.API_DIRECTORY }}/.junit-report/unit/results.xml
          retention-days: 1
          overwrite: true

      - name: Store API E2E JUnit Report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.API_E2E_JUNIT_REPORT_ARTIFACT_NAME }}
          path: ${{ env.API_DIRECTORY }}/.playwright-report/e2e/junit/results.xml
          retention-days: 1
          overwrite: true

      - name: List API JUnit files
        id: list_api_junit_files
        run: |
          files="${{ env.API_DIRECTORY }}/.junit-report/unit/results.xml,${{ env.API_DIRECTORY }}/.playwright-report/e2e/junit/results.xml"
          echo "junit_files=$files" >> $GITHUB_OUTPUT

      - name: Publish API Unit/E2E Report To Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.list_api_junit_files.outputs.junit_files }}
          flags: api
          report_type: test_results


      - name: Store API Coverage Report (wf)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.API_COVERAGE_ARTIFACT_NAME_WF }}
          path: ${{ env.API_COVERAGE_REPORT }}
          retention-days: 90
          overwrite: true

      - name: Store API Coverage Report (master)
        if: ${{ env.IS_MASTER_BRANCH == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.API_COVERAGE_ARTIFACT_NAME_MASTER }}
          path: ${{ env.API_COVERAGE_REPORT }}
          retention-days: 90
          overwrite: true

  app_ci:
    name: App CI
    runs-on: ubuntu-latest
    needs:
      [
        setup_env,
        determine_changes,
        determine_baseline_availability,
        determine_docker_image_availability,
      ]
    if: ${{ always() && !cancelled() && !failure() && (needs.determine_changes.outputs.app_module_changed == 'true' || needs.determine_changes.outputs.app_ci_changed == 'true' || needs.determine_baseline_availability.outputs.is_app_master_coverage_available == 'false') }}
    defaults:
      run:
        working-directory: ${{ env.APP_DIRECTORY }}
    permissions:
      contents: read

    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Hash NuGet dependency inputs
        id: nuget-key
        run: node ${{ github.workspace }}/devops/github/ci/nuget-cache-key.mjs

      - name: Restore NuGet packages
        id: nuget-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ steps.nuget-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Setup Java for Android release validation
        uses: actions/setup-java@v6
        with:
          distribution: "microsoft"
          java-version: "17"

      - name: Setup Python for recitation extension packaging
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Restore original recitation audio cache
        uses: actions/cache@v6
        with:
          path: .cache/recitation-assets
          key: recitation-audio-v1-${{ hashFiles('data/recitation/recitation.sqlite') }}
          restore-keys: recitation-audio-v1-

      - name: Prepare release recitation book packs
        run: python3 devops/prepare_recitation_assets.py --platform Android

      - name: Verify Android release package
        run: |
          # Workload set 10.0.402.1 pins Android SDK 36.1.118 — the first servicing
          # release honoring AndroidR8ObfuscationMode and emitting r8.json (#2708).
          dotnet workload install maui-android --version 10.0.402.1
          dotnet restore BibleOnSite/BibleOnSite.csproj -p:TargetFramework=net10.0-android -p:RuntimeIdentifiers=android-arm64 -r android-arm64
          # Compile with the checked-in notes fixture; store packages use the paired release artifact.
          NOTES_GZ="BibleOnSite/Platforms/Android/AssetPacks/perushim_notes/sefaria-dump-5784-sivan-4.perushim_notes.sqlite.gz"
          if [ -f "$NOTES_GZ" ] && [ ! -f "${NOTES_GZ%.gz}" ]; then
            gzip -dc "$NOTES_GZ" > "${NOTES_GZ%.gz}"
          fi
          # Exercise D8 and release linking before merging, without store signing keys.
          dotnet build BibleOnSite/BibleOnSite.csproj --no-restore -c Release -f net10.0-android -r android-arm64 -p:RuntimeIdentifiers=android-arm64 -p:AndroidPackageFormats=aab
          # #2708: the bundle must carry r8.json (enabled stages plus the
          # no*Percentage stats Play scores) and proguard.map; the verifier
          # enforces each Play score ≥25% over the 10 MB DEX threshold.
          python3 devops/verify_android_dex_metadata.py --package "$(find BibleOnSite/bin/Release -name '*.aab' -print -quit)"

      - name: Verify native canonical recitation word identities
        run: python3 ../data/recitation/audit_native.py

      - name: Verify packaged Android recitation modules
        run: python3 devops/verify_recitation_assets.py --platform Android --catalog BibleOnSite/Resources/Raw/recitation-catalog.json --package "$(find BibleOnSite/bin/Release -name '*.aab' -print -quit)"

      - name: Test recitation extension packaging
        run: python3 -m unittest discover -s devops -p 'test_*recitation_assets.py'

      - name: Test paired Perushim release assets
        run: python3 -m unittest discover -s devops -p test_prepare_perushim_assets.py

      - name: Test Android DEX metadata verification
        run: python3 -m unittest discover -s devops -p test_verify_android_dex_metadata.py

      - name: Setup Python for signing validation tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Test iOS distribution signing validation
        run: |
          python3 -m pip install --disable-pip-version-check --no-input -r devops/requirements-signing.txt
          python3 -m unittest discover -s devops -p test_verify_ios_signing.py
          python3 -m unittest discover -s devops -p test_ios_signing_requirements.py

      - name: Test downloader extension signing preparation
        run: python3 -m unittest discover -s extensions -p 'test_*.py'

      - name: Run Unit Tests with Coverage
        run: dotnet run --project devops -- CoverageUnit --configuration Release

      # Pure fixture tests for the E2E coverage apply/merge helpers (#1232).
      - name: Run devops Unit Tests
        run: dotnet test devops.Tests/devops.Tests.csproj --configuration Release

      - name: Save NuGet packages
        if: ${{ github.ref == 'refs/heads/master' && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - name: Store App Unit JUnit Report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_UNIT_JUNIT_REPORT_ARTIFACT_NAME }}
          path: ${{ env.APP_DIRECTORY }}/BibleOnSite.Tests/TestResults/test-results.xml
          retention-days: 1
          overwrite: true

      # ============ Integration Tests Setup ============
      # rust-cache hashes CC_* env vars; keep it before codecov-action, which exports CC_SHA.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          # Current CLI ZIP dependency tracking: https://github.com/bible-on-site/bible-on-site/issues/2826
          tool: cargo-make@0.37.24

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: |
            ${{ env.API_DIRECTORY }}
            ${{ env.DATA_DIRECTORY }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Publish App Unit Report To Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.APP_DIRECTORY }}/BibleOnSite.Tests/TestResults/test-results.xml
          flags: app
          report_type: test_results

      - name: Install and start MySQL
        id: mysql
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: "8.4"
          root-password: test_123
          distribution: "mysql"
          auto-start: true

      - name: Run Integration Tests with Coverage
        env:
          DB_URL: mysql://root:test_123@127.0.0.1:3306/tanah_test
          API_URL: http://127.0.0.1:3003
        run: dotnet run --project devops -- CoverageIntegration --configuration Release

      - name: Store App Integration JUnit Report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_INTEGRATION_JUNIT_REPORT_ARTIFACT_NAME }}
          path: ${{ env.APP_DIRECTORY }}/BibleOnSite.Tests/TestResults/test-results.xml
          retention-days: 1
          overwrite: true

      - name: Publish App Integration Report To Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.APP_DIRECTORY }}/BibleOnSite.Tests/TestResults/test-results.xml
          flags: app
          report_type: test_results

      # ============ Coverage Merge ============
      # CoverageMerge merges LCOV via ReportGenerator — no lcov-cli image needed.
      - name: Merge Coverage Reports
        run: dotnet run --project devops -- CoverageMerge --configuration Release

      # Unit+integration layer only. The mobile E2E legs contribute their own
      # app-process coverage (#1232) and cross_module_ci merges every layer
      # before publishing the authoritative app report and the master baseline.
      - name: Store App Coverage Report (wf)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_COVERAGE_ARTIFACT_NAME_WF }}
          path: ${{ env.APP_COVERAGE_REPORT }}
          retention-days: 90
          overwrite: true
          if-no-files-found: error

  app_mobile_e2e:
    name: App Mobile E2E
    # Wait for perushim_data so the app under test packages the same catalog/notes
    # pair package_app ships — the run artifact when the pipeline regenerated it,
    # the master baseline otherwise — never a stale committed fixture.
    # determine_baseline_availability: a missing app-coverage.master forces a
    # full recovery run, and the rebuilt baseline must include the E2E layer
    # (#1232), not just unit+integration.
    needs: [setup_env, determine_changes, perushim_data, determine_baseline_availability]
    if: ${{ always() && !cancelled() && !failure() && (needs.determine_changes.outputs.app_module_changed == 'true' || needs.determine_changes.outputs.app_ci_changed == 'true' || needs.determine_baseline_availability.outputs.is_app_master_coverage_available == 'false') }}
    permissions:
      contents: read
      # Reads the master coverage-tree baseline artifacts through the REST API (#2085).
      actions: read
    uses: ./.github/workflows/app-mobile-e2e.yml
    with:
      force_full_suite: ${{ github.event_name == 'merge_group' }}
      perushim_notes_sqlite_artifact: ${{ needs.perushim_data.result != 'skipped' && format('perushim-sqlite-v2-indexed.{0}', github.run_id) || 'perushim-sqlite-v2-indexed.master' }}

  app_ios_ci:
    name: App iOS native audio CI
    runs-on: ubuntu-latest
    needs: [setup_env, determine_changes]
    # PR and combined queue heads need native audio precision as well as the signed build.
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && always() && !cancelled() && !failure() && (needs.determine_changes.outputs.app_module_changed == 'true' || needs.determine_changes.outputs.app_ci_changed == 'true') }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node for native audio precision checks
        uses: actions/setup-node@v7
        with:
          node-version-file: web/bible-on-site/package.json

      # Needs webkit on top of the chromium headless shell. A first-run miss
      # still restores the website jobs' master-seeded shell entry so only
      # webkit downloads; the webkit-keyed entry holds both and is PR-scoped
      # by design: a save on miss speeds up reruns and later pushes of the
      # same pull request.
      - name: Restore playwright binaries
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-shell-webkit-${{ needs.setup_env.outputs.website_playwright_version }}

      - name: Restore shared chromium binaries
        id: playwright-chromium-cache
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-shell-${{ needs.setup_env.outputs.website_playwright_version }}

      - name: Verify native audio time origin on Chromium and Apple WebKit
        working-directory: web/bible-on-site
        run: |
          bun install --frozen-lockfile --ignore-scripts
          # The native decoder check rebuilds the shipped asset through the
          # app-owned manifest's esbuild (#2391).
          bun install --cwd ../../app/devops/recitation-decoder --frozen-lockfile
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            bun x playwright install-deps chromium webkit
          else
            bun x playwright install --with-deps --only-shell chromium webkit
          fi
          bun x playwright test --config playwright.recitation.config.ts

      - name: Save playwright binaries
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-shell-webkit-${{ needs.setup_env.outputs.website_playwright_version }}

  bulletin_ci:
    name: Bulletin CI
    runs-on: ubuntu-latest
    needs: [setup_env, determine_changes, determine_baseline_availability]
    if: ${{ needs.determine_changes.outputs.bulletin_module_changed == 'true' || needs.determine_changes.outputs.bulletin_ci_changed == 'true' || needs.determine_baseline_availability.outputs.is_bulletin_master_coverage_available == 'false' }}
    defaults:
      run:
        working-directory: ${{ env.BULLETIN_DIRECTORY }}
    permissions:
      contents: read

    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: taiki-e/install-action@v2
        with:
          # Current CLI ZIP dependency tracking: https://github.com/bible-on-site/bible-on-site/issues/2826
          tool: cargo-make@0.37.24, cargo-llvm-cov, cargo-nextest

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: ${{ env.BULLETIN_DIRECTORY }}
          cache-on-failure: true
          shared-key: "bulletin-rust"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Lint
        id: lint
        run: cargo make lint

      - name: Format Check
        id: fmt-check
        run: cargo make fmt-check

      - name: Unit Test with Coverage
        id: unit-test
        run: cargo make coverage-unit

      - name: Store Bulletin Unit JUnit Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BULLETIN_UNIT_JUNIT_REPORT_ARTIFACT_NAME }}
          path: ${{ env.BULLETIN_DIRECTORY }}/.junit-report/unit/results.xml
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Publish Bulletin Unit Report To Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.BULLETIN_DIRECTORY }}/.junit-report/unit/results.xml
          flags: bulletin
          report_type: test_results

      - name: Store Bulletin Coverage Report (workflow)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BULLETIN_COVERAGE_ARTIFACT_NAME_WF }}
          path: ${{ env.BULLETIN_COVERAGE_REPORT }}
          retention-days: 1
          overwrite: true

      - name: Store Bulletin Coverage Report (master baseline)
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BULLETIN_COVERAGE_ARTIFACT_NAME_MASTER }}
          path: ${{ env.BULLETIN_COVERAGE_REPORT }}
          retention-days: 90
          overwrite: true

  recitation_ci:
    name: Recitation alignment and RustFS
    runs-on: ubuntu-latest
    needs: [setup_env, determine_changes]
    if: ${{ always() && !cancelled() && needs.setup_env.result == 'success' && needs.determine_changes.result == 'success' && (needs.determine_changes.outputs.data_module_changed == 'true' || needs.determine_changes.outputs.website_module_changed == 'true' || needs.determine_changes.outputs.data_ci_changed == 'true') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
      - name: Test alignment invariants without downloading GPU models
        run: |
          python -m venv data/recitation/.venv
          data/recitation/.venv/bin/python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          data/recitation/.venv/bin/python -m pip install numpy==2.5.4 transformers==5.19.0
          cd data/recitation
          .venv/bin/python -m unittest -v
          .venv/bin/python publish.py
          .venv/bin/python audit.py
      - name: Score the mention-annotation pipeline against its golden set
        run: |
          python3 -m unittest discover -s data/annotations -p 'test_*.py'
          python3 data/annotations/golden_eval.py --check
      - name: Verify canonical text preprocessing
        run: node --test data/sefaria/pipelines/tanah-view/tests/preprocessor.test.mjs
      - name: Verify module release and shared decoder check routing
        run: node --test devops/github/ci/determine-changes.test.ts devops/github/ci/auto-create-pr.test.mjs devops/github/ci/nuget-cache-key.test.mjs
      - name: Verify daily bulletin mail infrastructure and assets
        run: bun test devops/daily-bulletin-infra.test.mjs
      - name: Install storage test dependencies
        run: bun install --cwd devops --frozen-lockfile
      - name: Verify repeatable deployment recovery
        working-directory: devops
        run: node --test deploy/ecr-deploy/resume-image.test.mts deploy/ecr-deploy/ecr-client.test.mts
      - name: Start RustFS
        run: docker compose -f devops/docker-compose.yml up -d --wait --wait-timeout 180 rustfs
      - name: Verify MP3 and Opus byte-range seeking
        run: |
          node data/recitation/check_storage.mjs
          node data/recitation/check_storage.mjs data/recitation/fixtures/seek.ogg

  deploy_verifier:
    name: CD verifier dependency contract
    runs-on: ubuntu-latest
    needs: [setup_env, determine_changes]
    # The website's post-deploy verifier resolves its imports through
    # NODE_PATH -> devops/node_modules (cd-aws.yml). Guard that contract:
    # verifier or deployment-workflow changes select it via website flags,
    # devops manifest changes via admin_ci_changed (#2372).
    if: ${{ always() && !cancelled() && needs.setup_env.result == 'success' && needs.determine_changes.result == 'success' && (needs.determine_changes.outputs.website_module_changed == 'true' || needs.determine_changes.outputs.website_ci_changed == 'true' || needs.determine_changes.outputs.admin_ci_changed == 'true') }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: devops/package.json
      # Same install layout as the deploy job: only devops deps, no website
      # node_modules — resolution can only succeed through NODE_PATH.
      - name: Install deployment dependencies
        run: bun install --cwd devops --frozen-lockfile
      # The nginx guard reads docs/ outside the website's Docker build context.
      - name: Verify canonical hosts and nginx configuration
        run: node --test web/bible-on-site/scripts/verify-canonical-hosts.test.mjs
      - name: Exercise the real deployment verifier entry point
        run: |
          node web/bible-on-site/scripts/verify-public-content.fixture.mjs 48123 &
          FIXTURE_PID=$!
          trap 'if kill -0 $FIXTURE_PID 2>/dev/null; then kill $FIXTURE_PID; fi' EXIT
          for attempt in $(seq 50); do
            curl -fsS http://127.0.0.1:48123/api/health/ready > /dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:48123/api/health/ready > /dev/null
          NODE_PATH="$GITHUB_WORKSPACE/devops/node_modules" \
            node web/bible-on-site/scripts/verify-public-content.mjs --origin http://127.0.0.1:48123

  data_ci:
    name: Data CI
    runs-on: ubuntu-26.04
    needs:
      [
        setup_env,
        determine_changes,
        determine_docker_image_availability,
        build_sefaria_mongo_docker,
        determine_baseline_availability,
      ]
    if: ${{ always() && !cancelled() && !failure() && (needs.determine_changes.outputs.data_module_changed == 'true' || needs.determine_changes.outputs.data_ci_changed == 'true' || needs.determine_baseline_availability.outputs.is_data_master_coverage_available == 'false') }}
    defaults:
      run:
        working-directory: ${{ env.DATA_DIRECTORY }}
    permissions:
      contents: read
      packages: read

    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: taiki-e/install-action@v2
        with:
          # Current CLI ZIP dependency tracking: https://github.com/bible-on-site/bible-on-site/issues/2826
          tool: cargo-make@0.37.24, cargo-llvm-cov, cargo-nextest

      # Per-job key: rust-cache never overwrites an existing key, so a shared key is owned by whichever job saves first.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: ${{ env.DATA_DIRECTORY }}
          cache-on-failure: true
          shared-key: "data-ci-rust"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Overlap the image pull with lint/unit coverage; integration tests wait below.
      - name: Pull Sefaria MongoDB Docker Image
        id: pull-sefaria-mongo
        background: true
        env:
          GH_TOKEN: ${{ github.token }}
          SEFARIA_MONGO_IMAGE: ${{ needs.determine_docker_image_availability.outputs.sefaria_mongo_image }}
        run: |
          if [ "${{ needs.determine_docker_image_availability.outputs.is_sefaria_mongo_available }}" != "true" ] && [ "${{ needs.determine_docker_image_availability.outputs.can_publish_sefaria_mongo }}" != "true" ]; then
            gh run download ${{ github.run_id }} -n ${{ env.SEFARIA_MONGO_IMAGE_ARTIFACT_NAME }} -D /tmp
            docker load --input /tmp/sefaria-mongo-image.tar
            rm -f /tmp/sefaria-mongo-image.tar
          else
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull "$SEFARIA_MONGO_IMAGE"
          fi
          df -h /

      - name: Lint
        id: lint
        run: cargo make lint

      - name: Format Check
        id: fmt-check
        run: cargo make fmt-check

      - name: Install and start MySQL
        id: mysql
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: "8.4"
          root-password: test_123
          distribution: "mysql"
          auto-start: true

      - name: Validate Production SQL Parser Compatibility
        working-directory: ${{ github.workspace }}
        run: python devops/deploy/data-deploy/validate_lambda_parser.py --parse-only

      - name: Unit Test
        id: unit-test
        env:
          DB_POPULATOR_TEST_DB_URL: mysql://root:test_123@127.0.0.1:3306/tanah_db_populator_test
        run: cargo make coverage-unit

      - name: Store Data Unit JUnit Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DATA_UNIT_JUNIT_REPORT_ARTIFACT_NAME }}
          path: ${{ env.DATA_DIRECTORY }}/.junit-report/unit/results.xml
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Publish Data Unit Report To Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.DATA_DIRECTORY }}/.junit-report/unit/results.xml
          flags: data
          report_type: test_results

      - name: Wait for Sefaria MongoDB Docker Image
        wait: pull-sefaria-mongo

      # ============ Integration Test Setup: MongoDB Container ============
      - name: Setup MongoDB Container for Integration Tests
        id: setup-mongodb
        env:
          SEFARIA_MONGO_IMAGE: ${{ needs.determine_docker_image_availability.outputs.sefaria_mongo_image }}
        run: |
          docker run -d --name sefaria-mongo -p 27017:27017 "$SEFARIA_MONGO_IMAGE"
          echo "Waiting for MongoDB to be ready..."
          # Data was restored at Docker BUILD time to /mongodb-data
          # On first container startup, entrypoint.sh copies it to /data/db
          # This should take ~15-30 seconds vs 5+ minutes for runtime mongorestore
          for i in {1..60}; do
            count=$(docker exec sefaria-mongo mongosh --quiet --eval "db.getSiblingDB('sefaria').texts.countDocuments({})" 2>/dev/null || echo "0")
            if [ "$count" != "0" ] && [ -n "$count" ]; then
              echo "MongoDB is ready with $count documents in sefaria.texts collection!"
              # Regression check: the running server must match the version pinned
              # in the Dockerfile, so a stale cached GHCR image cannot slip through.
              expected=$(grep -oP 'FROM mongo:\K[0-9]+\.[0-9]+\.[0-9]+' "$GITHUB_WORKSPACE/${{ env.SEFARIA_MONGO_DOCKER_DIRECTORY }}/Dockerfile")
              actual=$(docker exec sefaria-mongo mongosh --quiet --eval "db.version()")
              echo "Image: $SEFARIA_MONGO_IMAGE | mongod: $actual | Dockerfile FROM: mongo:$expected"
              test "$actual" = "$expected"
              exit 0
            fi
            echo "Attempt $i/60: Waiting for MongoDB (count: $count)..."
            sleep 2
          done
          echo "MongoDB failed to be ready within timeout"
          docker logs sefaria-mongo
          exit 1

      # ============ Integration Tests ============
      - name: Integration Test
        id: integration-test
        env:
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          DUMP_NAME: sefaria
        run: cargo make coverage-integration

      - name: Store Data Integration JUnit Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DATA_INTEGRATION_JUNIT_REPORT_ARTIFACT_NAME }}
          path: ${{ env.DATA_DIRECTORY }}/.junit-report/integration/results.xml
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Publish Data Integration Report To Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.DATA_DIRECTORY }}/.junit-report/integration/results.xml
          flags: data-integration
          report_type: test_results

      - name: Build lcov Docker image
        uses: ./.github/actions/lcov-image

      - name: Merge Test Coverage (Unit + Integration)
        run: cargo make coverage-merge

      - name: Store Data Coverage Report (wf)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DATA_COVERAGE_ARTIFACT_NAME_WF }}
          path: ${{ env.DATA_COVERAGE_REPORT }}
          retention-days: 90
          overwrite: true

      - name: Store Data Coverage Report (master)
        if: ${{ env.IS_MASTER_BRANCH == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DATA_COVERAGE_ARTIFACT_NAME_MASTER }}
          path: ${{ env.DATA_COVERAGE_REPORT }}
          retention-days: 90
          overwrite: true

      - name: Stop MongoDB Container
        if: ${{ always() }}
        run: docker stop sefaria-mongo || true

  # ====================================================================================
  # PERUSHIM DATA JOB - Single job for all perushim SQL concerns
  # ====================================================================================
  # Generates perushim SQL from Sefaria MongoDB and stores artifacts for:
  #   1. CD deployment (per-run artifact: perushim-data-sql)
  #   2. Website CI/Perf baseline (master artifact: perushim-data-sql.master)
  # ====================================================================================
  perushim_data:
    name: Perushim Data
    runs-on: ubuntu-26.04
    needs:
      [
        setup_env,
        determine_changes,
        determine_baseline_availability,
        determine_docker_image_availability,
        build_sefaria_mongo_docker,
      ]
    if: >-
      ${{ always() && !cancelled() && !failure() && (
        needs.determine_changes.outputs.perushim_pipeline_module_changed == 'true' ||
        (github.event_name == 'merge_group' && needs.determine_changes.outputs.perushim_pipeline_ci_changed == 'true') ||
        needs.determine_baseline_availability.outputs.is_perushim_data_sql_available != 'true' ||
        needs.determine_baseline_availability.outputs.is_perushim_notes_sqlite_available != 'true'
      ) }}
    defaults:
      run:
        working-directory: ${{ env.DATA_DIRECTORY }}
    permissions:
      contents: read
      packages: read

    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # Same overlap as data_ci: the image pull (or artifact download + load)
      # only depends on the needs/ outputs, so it runs in the background while
      # the toolchain installs; `wait` below is the gate before the container.
      - name: Pull Sefaria MongoDB Docker Image
        id: pull-sefaria-mongo
        background: true
        env:
          GH_TOKEN: ${{ github.token }}
          SEFARIA_MONGO_IMAGE: ${{ needs.determine_docker_image_availability.outputs.sefaria_mongo_image }}
        run: |
          if [ "${{ needs.determine_docker_image_availability.outputs.is_sefaria_mongo_available }}" != "true" ] && [ "${{ needs.determine_docker_image_availability.outputs.can_publish_sefaria_mongo }}" != "true" ]; then
            gh run download ${{ github.run_id }} -n ${{ env.SEFARIA_MONGO_IMAGE_ARTIFACT_NAME }} -D /tmp
            docker load --input /tmp/sefaria-mongo-image.tar
            rm -f /tmp/sefaria-mongo-image.tar
          else
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull "$SEFARIA_MONGO_IMAGE"
          fi
          df -h /

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: ${{ env.DATA_DIRECTORY }}
          cache-on-failure: true
          shared-key: "perushim-data-rust"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Wait for Sefaria MongoDB Docker Image
        wait: pull-sefaria-mongo

      - name: Start MongoDB Container
        id: setup-mongodb
        env:
          SEFARIA_MONGO_IMAGE: ${{ needs.determine_docker_image_availability.outputs.sefaria_mongo_image }}
        run: |
          docker run -d --name sefaria-mongo -p 27017:27017 "$SEFARIA_MONGO_IMAGE"
          echo "Waiting for MongoDB to be ready..."
          for i in {1..60}; do
            count=$(docker exec sefaria-mongo mongosh --quiet --eval "db.getSiblingDB('sefaria').texts.countDocuments({})" 2>/dev/null || echo "0")
            if [ "$count" != "0" ] && [ -n "$count" ]; then
              echo "MongoDB is ready with $count documents in sefaria.texts collection!"
              # Regression check: the running server must match the version pinned
              # in the Dockerfile, so a stale cached GHCR image cannot slip through.
              expected=$(grep -oP 'FROM mongo:\K[0-9]+\.[0-9]+\.[0-9]+' "$GITHUB_WORKSPACE/${{ env.SEFARIA_MONGO_DOCKER_DIRECTORY }}/Dockerfile")
              actual=$(docker exec sefaria-mongo mongosh --quiet --eval "db.version()")
              echo "Image: $SEFARIA_MONGO_IMAGE | mongod: $actual | Dockerfile FROM: mongo:$expected"
              test "$actual" = "$expected"
              exit 0
            fi
            echo "Attempt $i/60: Waiting for MongoDB (count: $count)..."
            sleep 2
          done
          echo "MongoDB failed to be ready within timeout"
          docker logs sefaria-mongo
          exit 1

      - name: Generate Perushim MySQL Data
        env:
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          DUMP_NAME: sefaria
        run: cargo run --release --manifest-path sefaria/pipelines/perushim-view/Cargo.toml -- --format mysql --output-to-dependant-modules --dump-name "$DUMP_NAME"

      - name: Upload Perushim SQL Artifact
        uses: actions/upload-artifact@v7
        with:
          name: perushim-data-sql
          path: ${{ env.DATA_DIRECTORY }}/mysql/perushim_data.sql
          retention-days: 30
          overwrite: true

      - name: Upload Perushim SQL Artifact (master baseline)
        if: ${{ env.IS_MASTER_BRANCH == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PERUSHIM_DATA_SQL_ARTIFACT_NAME_MASTER }}
          path: ${{ env.DATA_DIRECTORY }}/mysql/perushim_data.sql
          retention-days: 90
          overwrite: true

      - name: Generate Perushim SQLite Data
        env:
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          DUMP_NAME: sefaria
        run: |
          cargo run --release --manifest-path sefaria/pipelines/perushim-view/Cargo.toml -- --format sqlite --dump-name "$DUMP_NAME"
          SQLITE_DIR="${GITHUB_WORKSPACE}/${{ env.PERUSHIM_PIPELINE_DIRECTORY }}/.output"
          mv "$SQLITE_DIR/${DUMP_NAME}.perushim_notes.sqlite" \
             "$SQLITE_DIR/${{ env.PERUSHIM_NOTES_SQLITE_FILENAME }}"
          mv "$SQLITE_DIR/${DUMP_NAME}.perushim_catalog.sqlite" \
             "$SQLITE_DIR/${{ env.PERUSHIM_CATALOG_SQLITE_FILENAME }}"
          mv "$SQLITE_DIR/${DUMP_NAME}.hebrew_search.sqlite" \
             "$SQLITE_DIR/${{ env.PERUSHIM_SEARCH_SQLITE_FILENAME }}"

      - name: Upload Perushim Notes SQLite Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_WF }}
          path: |
            ${{ env.PERUSHIM_PIPELINE_DIRECTORY }}/.output/${{ env.PERUSHIM_NOTES_SQLITE_FILENAME }}
            ${{ env.PERUSHIM_PIPELINE_DIRECTORY }}/.output/${{ env.PERUSHIM_CATALOG_SQLITE_FILENAME }}
            ${{ env.PERUSHIM_PIPELINE_DIRECTORY }}/.output/${{ env.PERUSHIM_SEARCH_SQLITE_FILENAME }}
          retention-days: 30
          overwrite: true

      - name: Upload Perushim Notes SQLite Artifact (master baseline)
        if: ${{ env.IS_MASTER_BRANCH == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_MASTER }}
          path: |
            ${{ env.PERUSHIM_PIPELINE_DIRECTORY }}/.output/${{ env.PERUSHIM_NOTES_SQLITE_FILENAME }}
            ${{ env.PERUSHIM_PIPELINE_DIRECTORY }}/.output/${{ env.PERUSHIM_CATALOG_SQLITE_FILENAME }}
            ${{ env.PERUSHIM_PIPELINE_DIRECTORY }}/.output/${{ env.PERUSHIM_SEARCH_SQLITE_FILENAME }}
          retention-days: 90
          overwrite: true

      - name: Stop MongoDB Container
        if: ${{ always() }}
        run: docker stop sefaria-mongo || true

  website_publish_test_results_to_codecov:
    name: Publish Website Test Results To Codecov
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [website_e2e, website_performance]
    if: ${{ always() && !cancelled() && (needs.website_e2e.result != 'skipped' || needs.website_performance.result != 'skipped') }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Restore Website JUnit Reports
        uses: actions/download-artifact@v8
        with:
          pattern: website-*-junit-report-${{ github.run_id }}
          path: ${{ env.TMP_WEBSITE_JUNIT_REPORTS_DIRECTORY }}
          merge-multiple: true

      - name: List JUnit files
        id: list_files
        run: |
          cd ${{ env.TMP_WEBSITE_JUNIT_REPORTS_DIRECTORY }}
          files=$(ls -1 | paste -sd,)
          echo "junit_files=$files" >> $GITHUB_OUTPUT

      - name: Publish Website Unit/E2E/Perf Report To Codecov
        if: ${{ needs.website_e2e.result != 'skipped' }}
        uses: codecov/codecov-action@v7
        with:
          working-directory: ${{ env.TMP_WEBSITE_JUNIT_REPORTS_DIRECTORY }}
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.list_files.outputs.junit_files }}
          flags: website # Assuming you want to flag these as website tests
          report_type: test_results

  cross_module_ci:
    name: Cross Module CI
    runs-on: ubuntu-latest
    needs:
      [
        determine_changes,
        website_performance,
        website_e2e,
        api_e2e,
        app_ci,
        admin_ci,
        app_ios_ci,
        package_ios_pr,
        package_windows_pr,
        package_api,
        package_bulletin,
        package_admin,
        app_mobile_e2e,
        bulletin_ci,
        data_ci,
        recitation_ci,
        deploy_verifier,
        perushim_data,
        determine_baseline_availability,
        determine_docker_image_availability,
        calendar_pdf_artifacts,
        validate_website_architectures,
        validate_api_architectures,
        validate_admin_architectures,
      ]
    # Evaluate failures, but release the PR concurrency slot when replaced.
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: read
      # Reads the master baseline coverage artifacts through the REST API.
      actions: read
    steps:
      - name: Check Prerequisites
        id: check_prerequisites
        run: |
          if [ "${{ needs.determine_changes.result }}" != "success" ]; then
            echo "Could not determine module changes."
            echo "Overall status: failure"
            exit 1
          fi

          # Module jobs skip silently when these prerequisite lookups fail.
          if [ "${{ needs.determine_baseline_availability.result }}" != "success" ]; then
            echo "Could not determine master coverage baselines."
            echo "Overall status: failure"
            exit 1
          fi

          if [ "${{ needs.determine_docker_image_availability.result }}" != "success" ]; then
            echo "Could not determine Docker image availability."
            echo "Overall status: failure"
            exit 1
          fi

          if [ "${{ needs.determine_changes.outputs.data_module_changed }}" = "true" ] || [ "${{ needs.determine_changes.outputs.website_module_changed }}" = "true" ] || [ "${{ needs.determine_changes.outputs.data_ci_changed }}" = "true" ]; then
            if [ "${{ needs.recitation_ci.result }}" != "success" ]; then
              echo "Recitation alignment and RustFS validation did not pass."
              exit 1
            fi
          fi

          # Same condition as the deploy_verifier job's `if` — a triggered
          # guard that failed or could not run blocks the merge (#2372).
          if [ "${{ needs.determine_changes.outputs.website_module_changed }}" = "true" ] || [ "${{ needs.determine_changes.outputs.website_ci_changed }}" = "true" ] || [ "${{ needs.determine_changes.outputs.admin_ci_changed }}" = "true" ]; then
            if [ "${{ needs.deploy_verifier.result }}" != "success" ]; then
              echo "CD verifier dependency contract did not pass."
              exit 1
            fi
          fi

          # Match validate_website_architectures exactly: a triggered native
          # image check must succeed even when it was skipped or cancelled.
          if [ "${{ needs.determine_changes.outputs.website_module_changed }}" = "true" ] || [ "${{ needs.determine_changes.outputs.website_ci_changed }}" = "true" ]; then
            if [ "${{ needs.validate_website_architectures.result }}" != "success" ]; then
              echo "Website native image validation failed or did not run"
              exit 1
            fi
          fi

          # Match validate_api_architectures exactly: a triggered native
          # image check must succeed even when it was skipped or cancelled.
          if [ "${{ needs.determine_changes.outputs.api_module_changed }}" = "true" ] || [ "${{ needs.determine_changes.outputs.api_ci_changed }}" = "true" ]; then
            if [ "${{ needs.validate_api_architectures.result }}" != "success" ]; then
              echo "API native image validation failed or did not run"
              exit 1
            fi
          fi

          # Match validate_admin_architectures exactly: a triggered native
          # image check must succeed even when it was skipped or cancelled.
          if [ "${{ needs.determine_changes.outputs.admin_module_changed }}" = "true" ] || [ "${{ needs.determine_changes.outputs.admin_ci_changed }}" = "true" ]; then
            if [ "${{ needs.validate_admin_architectures.result }}" != "success" ]; then
              echo "Admin native image validation failed or did not run"
              exit 1
            fi
          fi

          WEBSITE_MODULE_CHANGED=$([ "${{ needs.determine_changes.outputs.website_module_changed }}" = "true" ] && echo "true" || echo "false") # Generated
          WEBSITE_CI_CHANGED=$([ "${{ needs.determine_changes.outputs.website_ci_changed }}" = "true" ] && echo "true" || echo "false") # Generated
          WEBSITE_MASTER_COVERAGE_AVAILABLE=$([ "${{ needs.determine_baseline_availability.outputs.is_website_master_coverage_available }}" = "true" ] && echo "true" || echo "false") # Generated
          if [ "$WEBSITE_MODULE_CHANGED" = "true" ] || [ "$WEBSITE_CI_CHANGED" = "true" ] || [ "$WEBSITE_MASTER_COVERAGE_AVAILABLE" = "false" ]; then
            E2E_STATUS=$([ "${{ needs.website_e2e.result }}" = "success" ] && echo "success" || echo "failure") # Generated
            # The performance job owns production-build validation, including
            # coverage-baseline recovery runs with no source changes.
            PERFORMANCE_STATUS=$([ "${{ needs.website_performance.result }}" = "success" ] && echo "success" || echo "failure") # Generated
            if [ "$E2E_STATUS" = "failure" ] || [ "$PERFORMANCE_STATUS" = "failure" ]; then
              echo "Overall status: failure"
              exit 1
            fi
          fi

          # The artifacts job is only triggered by website module/CI changes —
          # the same condition that gates it — so check it only then (#2608).
          if [ "$WEBSITE_MODULE_CHANGED" = "true" ] || [ "$WEBSITE_CI_CHANGED" = "true" ]; then
            if [ "${{ needs.calendar_pdf_artifacts.result }}" != "success" ]; then
              echo "Calendar PDF artifact verification did not pass."
              exit 1
            fi
          fi

          API_MODULE_CHANGED=$([ "${{ needs.determine_changes.outputs.api_module_changed }}" = "true" ] && echo "true" || echo "false") # Generated
          API_CI_CHANGED=$([ "${{ needs.determine_changes.outputs.api_ci_changed }}" = "true" ] && echo "true" || echo "false") # Generated
          API_MASTER_COVERAGE_AVAILABLE=$([ "${{ needs.determine_baseline_availability.outputs.is_api_master_coverage_available }}" = "true" ] && echo "true" || echo "false") # Generated
          if [ "$API_MODULE_CHANGED" = "true" ] || [ "$API_CI_CHANGED" = "true" ] || [ "$API_MASTER_COVERAGE_AVAILABLE" = "false" ]; then
            API_STATUS=$([ "${{ needs.api_e2e.result }}" = "success" ] && echo "success" || echo "failure") # Generated
            if [ "$API_STATUS" = "failure" ]; then
              echo "Overall status: failure"
              exit 1
            fi
          fi
          if [ "${{ github.event_name }}" != "push" ] && { [ "$API_MODULE_CHANGED" = "true" ] || [ "$API_CI_CHANGED" = "true" ]; }; then
            if [ "${{ needs.package_api.result }}" != "success" ]; then
              echo "API release Docker build failed or did not run"
              exit 1
            fi
          fi

          APP_MODULE_CHANGED=$([ "${{ needs.determine_changes.outputs.app_module_changed }}" = "true" ] && echo "true" || echo "false") # Generated
          APP_CI_CHANGED=$([ "${{ needs.determine_changes.outputs.app_ci_changed }}" = "true" ] && echo "true" || echo "false") # Generated
          if [ "${{ github.event_name }}" != "push" ] && { [ "$APP_MODULE_CHANGED" = "true" ] || [ "$APP_CI_CHANGED" = "true" ]; }; then
            if [ "${{ needs.package_ios_pr.result }}" != "success" ]; then
              echo "Signed iOS distribution validation failed or did not run"
              exit 1
            fi
            if [ "${{ needs.package_windows_pr.result }}" != "success" ]; then
              echo "Windows compile validation failed or did not run"
              exit 1
            fi
          fi
          APP_MASTER_COVERAGE_AVAILABLE=$([ "${{ needs.determine_baseline_availability.outputs.is_app_master_coverage_available }}" = "true" ] && echo "true" || echo "false") # Generated
          if [ "$APP_MODULE_CHANGED" = "true" ] || [ "$APP_CI_CHANGED" = "true" ] || [ "$APP_MASTER_COVERAGE_AVAILABLE" = "false" ]; then
            APP_STATUS=$([ "${{ needs.app_ci.result }}" = "success" ] && echo "success" || echo "failure") # Generated
            if [ "$APP_STATUS" = "failure" ]; then
              echo "Overall status: failure"
              exit 1
            fi
          fi

          if [ "$APP_MODULE_CHANGED" = "true" ] || [ "$APP_CI_CHANGED" = "true" ] || [ "$APP_MASTER_COVERAGE_AVAILABLE" = "false" ]; then
            if [ "${{ needs.app_mobile_e2e.result }}" != "success" ]; then
              echo "Appium mobile E2E matrix failed or did not run"
              exit 1
            fi
            APP_IOS_RESULT="${{ needs.app_ios_ci.result }}"
            # Match app_ios_ci: a triggered PR or queue precision suite must succeed.
            if { [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "merge_group" ]; } && { [ "$APP_MODULE_CHANGED" = "true" ] || [ "$APP_CI_CHANGED" = "true" ]; } && [ "$APP_IOS_RESULT" != "success" ]; then
              echo "App iOS CI failed"
              echo "Overall status: failure"
              exit 1
            fi
          fi

          BULLETIN_MODULE_CHANGED=$([ "${{ needs.determine_changes.outputs.bulletin_module_changed }}" = "true" ] && echo "true" || echo "false") # Generated
          BULLETIN_CI_CHANGED=$([ "${{ needs.determine_changes.outputs.bulletin_ci_changed }}" = "true" ] && echo "true" || echo "false") # Generated
          BULLETIN_MASTER_COVERAGE_AVAILABLE=$([ "${{ needs.determine_baseline_availability.outputs.is_bulletin_master_coverage_available }}" = "true" ] && echo "true" || echo "false") # Generated
          if [ "$BULLETIN_MODULE_CHANGED" = "true" ] || [ "$BULLETIN_CI_CHANGED" = "true" ] || [ "$BULLETIN_MASTER_COVERAGE_AVAILABLE" = "false" ]; then
            # A triggered suite that did not complete (failure, skip, cancel) blocks the merge.
            BULLETIN_STATUS=$([ "${{ needs.bulletin_ci.result }}" = "success" ] && echo "success" || echo "failure") # Generated
            if [ "$BULLETIN_STATUS" = "failure" ]; then
              echo "Overall status: failure"
              exit 1
            fi
          fi
          if [ "${{ github.event_name }}" != "push" ] && { [ "$BULLETIN_MODULE_CHANGED" = "true" ] || [ "$BULLETIN_CI_CHANGED" = "true" ]; }; then
            if [ "${{ needs.package_bulletin.result }}" != "success" ]; then
              echo "Bulletin release Docker build failed or did not run"
              exit 1
            fi
          fi

          ADMIN_MODULE_CHANGED=$([ "${{ needs.determine_changes.outputs.admin_module_changed }}" = "true" ] && echo "true" || echo "false") # Generated
          ADMIN_CI_CHANGED=$([ "${{ needs.determine_changes.outputs.admin_ci_changed }}" = "true" ] && echo "true" || echo "false") # Generated
          ADMIN_MASTER_COVERAGE_AVAILABLE=$([ "${{ needs.determine_baseline_availability.outputs.is_admin_master_coverage_available }}" = "true" ] && echo "true" || echo "false") # Generated
          if [ "$ADMIN_MODULE_CHANGED" = "true" ] || [ "$ADMIN_CI_CHANGED" = "true" ] || [ "$ADMIN_MASTER_COVERAGE_AVAILABLE" = "false" ]; then
            ADMIN_STATUS=$([ "${{ needs.admin_ci.result }}" = "success" ] && echo "success" || echo "failure") # Generated
            if [ "$ADMIN_STATUS" = "failure" ]; then
              echo "Overall status: failure"
              exit 1
            fi
          fi
          if [ "${{ github.event_name }}" != "push" ] && { [ "$ADMIN_MODULE_CHANGED" = "true" ] || [ "$ADMIN_CI_CHANGED" = "true" ]; }; then
            if [ "${{ needs.package_admin.result }}" != "success" ]; then
              echo "Admin release Docker build failed or did not run"
              exit 1
            fi
          fi

          DATA_MODULE_CHANGED=$([ "${{ needs.determine_changes.outputs.data_module_changed }}" = "true" ] && echo "true" || echo "false") # Generated
          DATA_CI_CHANGED=$([ "${{ needs.determine_changes.outputs.data_ci_changed }}" = "true" ] && echo "true" || echo "false") # Generated
          DATA_MASTER_COVERAGE_AVAILABLE=$([ "${{ needs.determine_baseline_availability.outputs.is_data_master_coverage_available }}" = "true" ] && echo "true" || echo "false") # Generated
          if [ "$DATA_MODULE_CHANGED" = "true" ] || [ "$DATA_CI_CHANGED" = "true" ] || [ "$DATA_MASTER_COVERAGE_AVAILABLE" = "false" ]; then
            DATA_STATUS=$([ "${{ needs.data_ci.result }}" = "success" ] && echo "success" || echo "failure") # Generated
            if [ "$DATA_STATUS" = "failure" ]; then
              echo "Overall status: failure"
              exit 1
            fi
          fi

          PERUSHIM_PIPELINE_CI_CHANGED=$([ "${{ needs.determine_changes.outputs.perushim_pipeline_ci_changed }}" = "true" ] && echo "true" || echo "false") # Generated
          PERUSHIM_PIPELINE_MODULE_CHANGED=$([ "${{ needs.determine_changes.outputs.perushim_pipeline_module_changed }}" = "true" ] && echo "true" || echo "false") # Generated
          PERUSHIM_DATA_SQL_AVAILABLE=$([ "${{ needs.determine_baseline_availability.outputs.is_perushim_data_sql_available }}" = "true" ] && echo "true" || echo "false") # Generated
          PERUSHIM_NOTES_SQLITE_AVAILABLE=$([ "${{ needs.determine_baseline_availability.outputs.is_perushim_notes_sqlite_available }}" = "true" ] && echo "true" || echo "false") # Generated
          if [ "$PERUSHIM_PIPELINE_MODULE_CHANGED" = "true" ] || { [ "${{ github.event_name }}" = "merge_group" ] && [ "$PERUSHIM_PIPELINE_CI_CHANGED" = "true" ]; } || [ "$PERUSHIM_DATA_SQL_AVAILABLE" = "false" ] || [ "$PERUSHIM_NOTES_SQLITE_AVAILABLE" = "false" ]; then
            PERUSHIM_STATUS=$([ "${{ needs.perushim_data.result }}" = "success" ] && echo "success" || echo "failure") # Generated
            if [ "$PERUSHIM_STATUS" = "failure" ]; then
              echo "Overall status: failure"
              exit 1
            fi
          fi

          echo "Overall status: success"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Restore Website Coverage Report
        if: needs.website_e2e.result != 'skipped'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WEBSITE_COVERAGE_ARTIFACT_NAME_WF }}
          path: ${{ env.WEBSITE_MERGED_COVERAGE_DIRECTORY }}

      - name: Restore Website Coverage Report (master baseline)
        if: needs.website_e2e.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="${{ env.WEBSITE_COVERAGE_ARTIFACT_NAME_MASTER }}"
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME" \
            --jq "[.artifacts[] | select(.expired == false)] | first | .id")
          test -n "$ARTIFACT_ID" && test "$ARTIFACT_ID" != "null"
          mkdir -p "${{ env.WEBSITE_MERGED_COVERAGE_DIRECTORY }}"
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/$ARTIFACT_NAME.zip"
          unzip -o "$RUNNER_TEMP/$ARTIFACT_NAME.zip" -d "${{ env.WEBSITE_MERGED_COVERAGE_DIRECTORY }}"

      - name: Publish Website Coverage To Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.WEBSITE_MERGED_COVERAGE_REPORT }}
          disable_search: true
          flags: website
          fail_ci_if_error: false

      - name: Restore API Coverage Report
        if: needs.api_e2e.result != 'skipped'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.API_COVERAGE_ARTIFACT_NAME_WF }}
          path: ${{ env.API_MERGED_COVERAGE_DIRECTORY }}

      - name: Restore API Coverage Report (master baseline)
        if: needs.api_e2e.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="${{ env.API_COVERAGE_ARTIFACT_NAME_MASTER }}"
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME" \
            --jq "[.artifacts[] | select(.expired == false)] | first | .id")
          test -n "$ARTIFACT_ID" && test "$ARTIFACT_ID" != "null"
          mkdir -p "${{ env.API_MERGED_COVERAGE_DIRECTORY }}"
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/$ARTIFACT_NAME.zip"
          unzip -o "$RUNNER_TEMP/$ARTIFACT_NAME.zip" -d "${{ env.API_MERGED_COVERAGE_DIRECTORY }}"

      - name: Publish API Coverage To Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.API_COVERAGE_REPORT }}
          disable_search: true
          flags: api
          fail_ci_if_error: false

      - name: Restore App Coverage Report
        if: needs.app_ci.result != 'skipped'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_COVERAGE_ARTIFACT_NAME_WF }}
          path: ${{ env.APP_MERGED_COVERAGE_DIRECTORY }}

      - name: Restore App Coverage Report (master baseline)
        if: needs.app_ci.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="${{ env.APP_COVERAGE_ARTIFACT_NAME_MASTER }}"
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME" \
            --jq "[.artifacts[] | select(.expired == false)] | first | .id")
          test -n "$ARTIFACT_ID" && test "$ARTIFACT_ID" != "null"
          mkdir -p "${{ env.APP_MERGED_COVERAGE_DIRECTORY }}"
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/$ARTIFACT_NAME.zip"
          unzip -o "$RUNNER_TEMP/$ARTIFACT_NAME.zip" -d "${{ env.APP_MERGED_COVERAGE_DIRECTORY }}"

      - name: Restore Bulletin Coverage Report
        if: needs.bulletin_ci.result != 'skipped'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BULLETIN_COVERAGE_ARTIFACT_NAME_WF }}
          path: ${{ env.BULLETIN_COVERAGE_DIRECTORY }}

      - name: Restore Bulletin Coverage Report (master baseline)
        if: needs.bulletin_ci.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="${{ env.BULLETIN_COVERAGE_ARTIFACT_NAME_MASTER }}"
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME" \
            --jq "[.artifacts[] | select(.expired == false)] | first | .id")
          test -n "$ARTIFACT_ID" && test "$ARTIFACT_ID" != "null"
          mkdir -p "${{ env.BULLETIN_COVERAGE_DIRECTORY }}"
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/$ARTIFACT_NAME.zip"
          unzip -o "$RUNNER_TEMP/$ARTIFACT_NAME.zip" -d "${{ env.BULLETIN_COVERAGE_DIRECTORY }}"

      - name: Publish Bulletin Coverage To Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.BULLETIN_COVERAGE_REPORT }}
          disable_search: true
          flags: bulletin
          fail_ci_if_error: false

      - name: Restore Admin Coverage Report
        if: needs.admin_ci.result != 'skipped'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ADMIN_COVERAGE_ARTIFACT_NAME_WF }}
          path: ${{ env.ADMIN_COVERAGE_DIRECTORY }}

      - name: Restore Admin Coverage Report (master baseline)
        if: needs.admin_ci.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="${{ env.ADMIN_COVERAGE_ARTIFACT_NAME_MASTER }}"
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME" \
            --jq "[.artifacts[] | select(.expired == false)] | first | .id")
          test -n "$ARTIFACT_ID" && test "$ARTIFACT_ID" != "null"
          mkdir -p "${{ env.ADMIN_COVERAGE_DIRECTORY }}"
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/$ARTIFACT_NAME.zip"
          unzip -o "$RUNNER_TEMP/$ARTIFACT_NAME.zip" -d "${{ env.ADMIN_COVERAGE_DIRECTORY }}"

      # The `admin` flag carries one merged report: unit's canonical V8
      # universe plus the hits the E2E layer confirmed on shared coordinates
      # (merged in the Admin CI job). Per-layer files stay in the coverage
      # artifact as diagnostics only.
      - name: Publish Admin Coverage To Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.ADMIN_MERGED_COVERAGE_REPORT }}
          disable_search: true
          flags: admin
          fail_ci_if_error: false

      - name: Restore Data Coverage Report
        if: needs.data_ci.result != 'skipped'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DATA_COVERAGE_ARTIFACT_NAME_WF }}
          path: ${{ env.DATA_MERGED_COVERAGE_DIRECTORY }}

      - name: Restore Data Coverage Report (master baseline)
        if: needs.data_ci.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="${{ env.DATA_COVERAGE_ARTIFACT_NAME_MASTER }}"
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME" \
            --jq "[.artifacts[] | select(.expired == false)] | first | .id")
          test -n "$ARTIFACT_ID" && test "$ARTIFACT_ID" != "null"
          mkdir -p "${{ env.DATA_MERGED_COVERAGE_DIRECTORY }}"
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/$ARTIFACT_NAME.zip"
          unzip -o "$RUNNER_TEMP/$ARTIFACT_NAME.zip" -d "${{ env.DATA_MERGED_COVERAGE_DIRECTORY }}"

      - name: Publish Data Coverage To Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.DATA_COVERAGE_REPORT }}
          disable_search: true
          flags: data
          fail_ci_if_error: false

      - name: Setup devops bun, Node.js and dependencies
        id: devops-bun-cache
        uses: ./.github/actions/setup-js
        with:
          module: devops
          directory: ${{ env.DEVOPS_DIRECTORY }}

      # bun install --frozen-lockfile is done here, so ~/.bun/install/cache is frozen — the tar+upload can run in
      # the background; the implicit wait-all before job cleanup completes it.
      - name: Save bun store cache
        if: ${{ github.ref == 'refs/heads/master' && steps.devops-bun-cache.outputs.cache-hit != 'true' }}
        background: true
        uses: ./.github/actions/save-bun-store
        with:
          key: ${{ steps.devops-bun-cache.outputs.cache-primary-key }}

      - name: Test release, deployment, and CI reporting guards
        working-directory: ${{ env.DEVOPS_DIRECTORY }}
        run: |
          bun run test:version
          bun run test:review-audit
          bun run test:coverage-gaps
          # Whole-tree generic-catch audit — the catch-boundary pre-commit
          # hook is local-only; this keeps hook-less commits honest.
          node review-audit/scan-catch.cjs
          node --test github/ci/codecov-report-state.test.mjs github/ci/bencher-comparison.test.mjs github/ci/bencher-thresholds.test.mjs github/ci/e2e-impact/e2e-impact.test.ts github/ci/e2e-impact/playwright-impact.test.ts github/ci/e2e-impact/shard-plan.test.ts github/ci/e2e-impact/timings.test.ts github/ci/e2e-impact/verify.test.ts e2e-coverage-trees/e2e-coverage-trees.test.ts

      # Real app-process coverage from the instrumented mobile E2E legs
      # (#1232). A successful mobile run must contribute both platform reports;
      # when the suite was not applicable this falls back to the trusted
      # per-platform baselines fetched by name through the REST API.
      - name: Restore App E2E coverage (this run, Android)
        if: needs.app_mobile_e2e.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_E2E_COVERAGE_ARTIFACT_NAME_WF }}.android
          path: ${{ env.APP_E2E_COVERAGE_DIRECTORY }}/android

      - name: Restore App E2E coverage (this run, iOS)
        if: needs.app_mobile_e2e.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_E2E_COVERAGE_ARTIFACT_NAME_WF }}.ios
          path: ${{ env.APP_E2E_COVERAGE_DIRECTORY }}/ios

      - name: Restore App E2E coverage (master baseline, Android)
        if: needs.app_mobile_e2e.result != 'success' && needs.determine_baseline_availability.outputs.is_app_e2e_android_coverage_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="${{ env.APP_E2E_COVERAGE_ARTIFACT_NAME_MASTER_ANDROID }}"
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME" \
            --jq "[.artifacts[] | select(.expired == false)] | first | .id")
          test -n "$ARTIFACT_ID" && test "$ARTIFACT_ID" != "null"
          mkdir -p "${{ env.APP_E2E_COVERAGE_DIRECTORY }}/android"
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/$ARTIFACT_NAME.zip"
          unzip -o "$RUNNER_TEMP/$ARTIFACT_NAME.zip" -d "${{ env.APP_E2E_COVERAGE_DIRECTORY }}/android"

      - name: Restore App E2E coverage (master baseline, iOS)
        if: needs.app_mobile_e2e.result != 'success' && needs.determine_baseline_availability.outputs.is_app_e2e_ios_coverage_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="${{ env.APP_E2E_COVERAGE_ARTIFACT_NAME_MASTER_IOS }}"
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME" \
            --jq "[.artifacts[] | select(.expired == false)] | first | .id")
          test -n "$ARTIFACT_ID" && test "$ARTIFACT_ID" != "null"
          mkdir -p "${{ env.APP_E2E_COVERAGE_DIRECTORY }}/ios"
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/$ARTIFACT_NAME.zip"
          unzip -o "$RUNNER_TEMP/$ARTIFACT_NAME.zip" -d "${{ env.APP_E2E_COVERAGE_DIRECTORY }}/ios"

      # Merge unit + integration + E2E layers by covered locations, never by
      # percentage. --relocate canonicalizes absolute runner paths (Linux and
      # macOS legs differ) so the same source line counts exactly once. The E2E
      # layers come from a separately instrumented app build whose OpenCover
      # template enumerates a different sequence-point universe — more lines
      # than the unit/integration report knows about, plus e2e-only files.
      # --hits-only intersects them onto the canonical universe: their hits
      # confirm lines unit/integration already list, while the foreign
      # enumeration — hit or not — never extends the merged denominator.
      # E2E branch arms never merge: BRDA indices are per-instrumenter and
      # an identical tuple can name a different arm (#2270).
      - name: Merge App coverage layers
        if: needs.app_ci.result == 'success'
        working-directory: ${{ env.DEVOPS_DIRECTORY }}
        run: |
          REPORT="${{ github.workspace }}/${{ env.APP_COVERAGE_REPORT }}"
          MERGE_ARGS=(--out "$REPORT" --relocate app/BibleOnSite/ --require "$REPORT")
          FOUND=0
          for platform in android ios; do
            LCOV="${{ github.workspace }}/${{ env.APP_E2E_COVERAGE_DIRECTORY }}/$platform/lcov.info"
            if [ -f "$LCOV" ]; then
              MERGE_ARGS+=(--hits-only "$LCOV")
              FOUND=$((FOUND+1))
            fi
          done
          if [ "${{ needs.app_mobile_e2e.result }}" = "success" ] && [ "$FOUND" -lt 2 ]; then
            echo "::error::Mobile E2E succeeded but its coverage reports are missing (found $FOUND/2)."
            exit 1
          fi
          if [ "$FOUND" -eq 0 ]; then
            echo "::warning::No mobile E2E coverage layer available; merging unit + integration only."
          fi
          node merge-lcov.mts "${MERGE_ARGS[@]}"

      # The combined report replaces the unit+integration artifact: the
      # authoritative app report and the master baseline always contain every
      # layer, so a partial run can never overwrite a complete baseline.
      - name: Store App Coverage Report (wf)
        if: needs.app_ci.result == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_COVERAGE_ARTIFACT_NAME_WF }}
          path: ${{ env.APP_COVERAGE_REPORT }}
          retention-days: 90
          overwrite: true

      - name: Store App Coverage Report (master)
        if: needs.app_ci.result == 'success' && env.IS_MASTER_BRANCH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_COVERAGE_ARTIFACT_NAME_MASTER }}
          path: ${{ env.APP_COVERAGE_REPORT }}
          retention-days: 90
          overwrite: true

      - name: Publish App Coverage To Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.APP_COVERAGE_REPORT }}
          disable_search: true
          flags: app
          fail_ci_if_error: false

      - name: Merge Test Coverage (Website + API)
        run: bun run coverage:merge
        working-directory: ${{ env.DEVOPS_DIRECTORY }}

      - name: Publish Cross Module Coverage To Codacy
        uses: codacy/codacy-coverage-reporter-action@master
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ env.CROSS_MODULE_COVERAGE_REPORT }}

      - name: Verify Coverage 3rd Party Reporting
        run: |
          # ci_passed is upstream CI, not proof of coverage uploads. Inspect the
          # actual completed report before classifying unresolved CI as lost uploads.
          # Retain the existing outage/backlog policy and explicit-failure gate.
            MAX_RETRIES=6
            RETRY_COUNT=0
            SLEEP_SECONDS=15
            OWNER_REPO=(${GITHUB_REPOSITORY/\// })
            if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
              COMMIT_SHA=$(cat $GITHUB_EVENT_PATH | jq -r .pull_request.head.sha)
            else
              COMMIT_SHA=${{ github.sha }}
            fi
            echo "Checking Codecov for commit: $COMMIT_SHA"
            CODECOV_URL="https://api.codecov.io/api/v2/github/${OWNER_REPO[0]}/repos/${OWNER_REPO[1]}/commits/$COMMIT_SHA"
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              CODECOV_JSON=""
              CI_PASSED="null"
              STATE="null"
              REPORT_STATE="pending"
              # A transport failure (DNS/TLS, e.g. a codecov.io certificate
              # outage) makes curl exit non-zero; run it inside a condition so
              # the step reaches the retry/warn path instead of dying under -e.
              if HTTP_CODE=$(curl -s -o /tmp/codecov_response.json -w "%{http_code}" -H "Authorization: token ${{ secrets.CODECOV_API_TOKEN }}" "$CODECOV_URL"); then
                CODECOV_JSON=$(cat /tmp/codecov_response.json)
              else
                HTTP_CODE="000"
              fi
              if [ "$HTTP_CODE" != "200" ]; then
                echo "Codecov API returned HTTP $HTTP_CODE (attempt $((RETRY_COUNT+1))/$MAX_RETRIES)"
              else
                CI_PASSED=$(echo "$CODECOV_JSON" | jq -r 'if .ci_passed == null then "null" else .ci_passed end')
                STATE=$(echo "$CODECOV_JSON" | jq -r '.state // "null"')
                REPORT_STATE=$(node devops/github/ci/codecov-report-state.mjs /tmp/codecov_response.json)
                echo "Codecov ci_passed=$CI_PASSED state=$STATE report=$REPORT_STATE (attempt $((RETRY_COUNT+1))/$MAX_RETRIES)"
                if [ "$REPORT_STATE" = "passed" ]; then
                  echo "Codecov check passed"
                  break
                elif [ "$REPORT_STATE" = "failed" ]; then
                  echo "Codecov check failed (ci_passed=false)"
                  echo "status=failure" >> $GITHUB_OUTPUT
                  exit 1
                fi
              fi
              if [ $RETRY_COUNT -eq $((MAX_RETRIES-1)) ]; then
                echo "Codecov ci_passed not resolved after $MAX_RETRIES attempts (ci_passed=$CI_PASSED, state=$STATE)"
                # Log metadata only; the full line-by-line report is very large.
                echo "Last response (HTTP $HTTP_CODE): $(echo "$CODECOV_JSON" | jq -c '{ci_passed, state, totals}')"
                if [ "$CI_PASSED" = "false" ]; then
                  echo "Codecov explicitly failed"
                  exit 1
                fi
                if [ "$REPORT_STATE" = "missing" ]; then
                  # Processing completed, but the actual coverage report is empty.
                  # Distinguish missing uploads from completed reports whose CI
                  # status has not resolved yet (including this polling job).
                  echo "::error::Codecov processed this commit but has no coverage reports — uploads failed while the service was reachable"
                  exit 1
                fi
                if [ "$REPORT_STATE" = "reported" ]; then
                  echo "::warning::Codecov coverage report is complete; upstream CI is still unresolved"
                else
                  echo "::warning::Codecov did not resolve processing — proceeding under the existing outage/backlog policy"
                fi
                break
              fi
              sleep $SLEEP_SECONDS
              RETRY_COUNT=$((RETRY_COUNT+1))
              SLEEP_SECONDS=$((SLEEP_SECONDS + 15))
            done

  release_website:
    name: Release Website
    needs: [setup_env, determine_changes, cross_module_ci, package_website]
    # Note: Using always() + output check as a workaround for reusable workflow result evaluation issues (see #1065)
    # Also verify cross_module_ci and package_website passed to ensure quality gate
    if: ${{ always() && needs.cross_module_ci.result == 'success' && needs.package_website.result == 'success' && needs.package_website.outputs.module_version != '' && needs.determine_changes.outputs.website_module_changed == 'true' && needs.setup_env.outputs.is_master_branch == 'true' && github.event_name == 'push' }}
    permissions:
      contents: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/shared-release.yml
    with:
      module_name: website
      module_directory: ${{ needs.setup_env.outputs.website_directory }}
      # Keep in sync with website extraModulePaths in devops/github/ci/determine-changes.ts
      extra_module_paths: '["data/recitation/recitation.sqlite", "app/BibleOnSite/Resources/Raw/recitation-audio.html"]'
      module_version: ${{ needs.package_website.outputs.module_version }}
      artifacts_json: '[{"name": "${{ needs.package_website.outputs.docker_artifact_name }}", "path": "web/bible-on-site/.release", "glob": "*.tar.gz"}]'
      cd_event_type: deploy-aws

  release_api:
    name: Release API
    needs: [setup_env, determine_changes, cross_module_ci, package_api]
    # Note: Using always() + output check as a workaround for reusable workflow result evaluation issues (see #1065)
    # Also verify cross_module_ci and package_api passed to ensure quality gate
    if: ${{ always() && needs.cross_module_ci.result == 'success' && needs.package_api.result == 'success' && needs.package_api.outputs.module_version != '' && needs.determine_changes.outputs.api_module_changed == 'true' && needs.setup_env.outputs.is_master_branch == 'true' && github.event_name == 'push' }}
    permissions:
      contents: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/shared-release.yml
    with:
      module_name: api
      module_directory: ${{ needs.setup_env.outputs.api_directory }}
      module_version: ${{ needs.package_api.outputs.module_version }}
      artifacts_json: '[{"name": "${{ needs.package_api.outputs.docker_artifact_name }}", "path": "web/api/.release", "glob": "*.tar.gz"}]'
      cd_event_type: deploy-aws

  release_app:
    name: Release App
    needs: [setup_env, determine_changes, cross_module_ci, package_app]
    # Note: Using always() + output check as a workaround for reusable workflow result evaluation issues (see #1065)
    # Also verify cross_module_ci and package_app passed to ensure quality gate
    if: ${{ always() && needs.cross_module_ci.result == 'success' && needs.package_app.result == 'success' && needs.package_app.outputs.module_version != '' && needs.determine_changes.outputs.app_module_changed == 'true' && needs.setup_env.outputs.is_master_branch == 'true' && github.event_name == 'push' }}
    permissions:
      contents: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/shared-release.yml
    with:
      module_name: app
      module_directory: app
      # Keep in sync with app extraModulePaths in devops/github/ci/determine-changes.ts
      extra_module_paths: '["data/recitation/recitation.sqlite", "web/bible-on-site/src/data/recitation/opus-playback.json"]'
      module_version: ${{ needs.package_app.outputs.module_version }}
      artifacts_json: |
        [
          {"name": "${{ needs.package_app.outputs.windows_artifact_name }}", "path": "app/.artifacts/windows", "glob": "**/BibleOnSite*.msix", "label": "Windows (MSIX)", "cd_key": "windows_artifact_name"},
          {"name": "${{ needs.package_app.outputs.android_artifact_name }}", "path": "app/.artifacts/android", "glob": "**/*.aab", "label": "Android (AAB)", "cd_key": "android_artifact_name"},
          {"name": "${{ needs.package_app.outputs.ios_artifact_name }}", "path": "app/.artifacts/ios", "glob": "**/*.ipa", "label": "iOS (IPA)", "cd_key": "ios_artifact_name"},
          {"name": "${{ needs.package_app.outputs.ios_artifact_name }}", "path": "app/.artifacts/ios", "glob": "**/*.aar", "label": "iOS asset packs (.aar — Apple-hosted Background Assets)", "cd_key": "ios_assetpacks_artifact_name"},
          {"name": "${{ needs.package_app.outputs.ios_artifact_name }}", "path": "app/.artifacts/ios", "glob": "**/asset-packs.json", "label": "iOS asset-pack plan (verified pack manifest for release-time reuse)", "cd_key": "ios_packplan_artifact_name"},
          {"name": "${{ needs.package_app.outputs.ios_artifact_name }}", "path": "app/.artifacts/ios", "glob": "payloads/*", "label": "iOS pack payloads (HTTPS delivery below iOS 26)", "cd_key": "ios_payloads_artifact_name"}
        ]
      cd_event_type: deploy-app

  release_bulletin:
    name: Release Bulletin
    needs: [setup_env, determine_changes, cross_module_ci, package_bulletin]
    # Note: Using always() + output check as a workaround for reusable workflow result evaluation issues (see #1065)
    # Also verify cross_module_ci and package_bulletin passed to ensure quality gate
    if: ${{ always() && needs.cross_module_ci.result == 'success' && needs.package_bulletin.result == 'success' && needs.package_bulletin.outputs.module_version != '' && needs.determine_changes.outputs.bulletin_module_changed == 'true' && needs.setup_env.outputs.is_master_branch == 'true' && github.event_name == 'push' }}
    permissions:
      contents: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/shared-release.yml
    with:
      module_name: bulletin
      module_directory: web/bulletin
      module_version: ${{ needs.package_bulletin.outputs.module_version }}
      artifacts_json: '[{"name": "${{ needs.package_bulletin.outputs.lambda_zip_artifact_name }}", "path": "web/bulletin/.release", "glob": "*.zip"}]'
      cd_event_type: deploy-bulletin

  release_admin:
    name: Release Admin
    needs: [setup_env, determine_changes, cross_module_ci, package_admin]
    if: ${{ always() && needs.cross_module_ci.result == 'success' && needs.package_admin.result == 'success' && needs.package_admin.outputs.module_version != '' && needs.determine_changes.outputs.admin_module_changed == 'true' && needs.setup_env.outputs.is_master_branch == 'true' && github.event_name == 'push' }}
    permissions:
      contents: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/shared-release.yml
    with:
      module_name: admin
      module_directory: web/admin
      module_version: ${{ needs.package_admin.outputs.module_version }}
      artifacts_json: '[{"name": "${{ needs.package_admin.outputs.docker_artifact_name }}", "path": "web/admin/.release", "glob": "*.tar.gz"}]'
      cd_event_type: deploy-aws

  release_data:
    name: Release Data
    needs: [setup_env, determine_changes, cross_module_ci, data_ci, perushim_data]
    # Note: Using always() as a workaround for reusable workflow result evaluation issues (see #1065)
    # Delivery intent tracks the released payload only: data content, perushim
    # pipeline inputs, or the data-deploy tooling itself. Shared CI plumbing
    # (data_ci_changed covers ci.yml, composite actions and the detector) is
    # never delivery intent — the producer rightly skips those runs, leaving
    # no current-run SQL artifact to bind (#2730).
    # When perushim_data is skipped but delivery is intended, the bind step
    # resolves the trusted master baseline archive instead — pinned by
    # immutable ID/digest and bound to its producing master CI run and to
    # identical pipeline inputs (devops/github/release/data-artifact.mjs).
    # data_ci may be skipped when only perushim inputs changed; cross_module_ci
    # already forces data_ci success whenever data checks were needed.
    # Schema-only changes require a separately approved, selective migration.
    # Skip this entire job: success would supersede older queued data deployments.
    if: ${{ always() && needs.cross_module_ci.result == 'success' && (needs.data_ci.result == 'success' || needs.data_ci.result == 'skipped') && (needs.perushim_data.result == 'success' || needs.perushim_data.result == 'skipped') && (needs.determine_changes.outputs.data_module_changed == 'true' || needs.determine_changes.outputs.data_deploy_changed == 'true' || needs.determine_changes.outputs.perushim_pipeline_module_changed == 'true') && needs.determine_changes.outputs.data_schema_only_changed == 'false' && needs.setup_env.outputs.is_master_branch == 'true' && github.event_name == 'push' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v7
      - name: Bind SQL artifact source
        id: sql_source
        env:
          GH_TOKEN: ${{ github.token }}
          # Skipped producer = generated SQL is unchanged; bind the trusted
          # master baseline archive produced by an earlier master CI run.
          SQL_FROM_BASELINE: ${{ needs.perushim_data.result == 'skipped' }}
        run: node devops/github/release/data-artifact.mjs
      - name: Trigger Data CD Workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.BOT_PAT }}
          event-type: deploy-data
          client-payload: ${{ steps.sql_source.outputs.payload }}

  # ====================================================================================
  # VERSION BUMP JOB - Post-release version bumps on master
  # ====================================================================================
  # Released versions are bumped on master, including website. If a tag already
  # belongs to another commit, a retry bump without [skip ci] starts a new release run.
  # ====================================================================================
  bump_versions:
    name: Bump Versions
    needs: [setup_env, release_website, release_api, release_app, release_admin, release_bulletin]
    # Note: Using always() and success checks as a workaround for reusable workflow result evaluation issues (see #1065)
    if: >-
      ${{ always() && needs.setup_env.outputs.is_master_branch == 'true' && github.event_name == 'push' &&
      ((needs.release_website.result == 'success' && (needs.release_website.outputs.released == 'true' || needs.release_website.outputs.needs_bump == 'true')) ||
       (needs.release_api.result == 'success' && (needs.release_api.outputs.released == 'true' || needs.release_api.outputs.needs_bump == 'true')) ||
       (needs.release_app.result == 'success' && (needs.release_app.outputs.released == 'true' || needs.release_app.outputs.needs_bump == 'true')) ||
       (needs.release_admin.result == 'success' && (needs.release_admin.outputs.released == 'true' || needs.release_admin.outputs.needs_bump == 'true')) ||
       (needs.release_bulletin.result == 'success' && (needs.release_bulletin.outputs.released == 'true' || needs.release_bulletin.outputs.needs_bump == 'true')))}}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # Single concurrency group for all version bumps to prevent any race conditions
    concurrency:
      group: ${{ github.repository }}-version-bump
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Setup devops bun, Node.js and dependencies
        id: devops-bun-cache
        uses: ./.github/actions/setup-js
        with:
          module: devops
          directory: ${{ env.DEVOPS_DIRECTORY }}

      - name: Save bun store cache
        if: ${{ github.ref == 'refs/heads/master' && steps.devops-bun-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/save-bun-store
        with:
          key: ${{ steps.devops-bun-cache.outputs.cache-primary-key }}

      - name: Publish release and collision version bumps together
        working-directory: ${{ env.DEVOPS_DIRECTORY }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bun run bump:module-versions -- --mode all --publish

