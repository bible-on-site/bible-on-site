# Dependency Submission (NuGet)
#
# Replaces GitHub's managed "Automatic dependency submission" job, which runs a bare
# `dotnet restore` on every project under Ubuntu and fails on this repo:
# BibleOnSite.csproj targets MAUI platforms whose workloads are not installed (and the
# ios/maccatalyst workloads do not exist for Linux at all), while the Windows-only E2E
# test project requires EnableWindowsTargeting. This workflow restores each project in
# a form that works on Ubuntu, then submits the resolved graph with the same
# component-detection action the managed job uses.
#
# Source repository: https://github.com/advanced-security/component-detection-dependency-submission-action
name: 'Dependency submission'
on:
  push:
    branches: [ "master" ]
  workflow_call:
  merge_group:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  submit-snapshots:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        source: ${{ github.event_name == 'pull_request' && fromJSON('["base", "head"]') || fromJSON('["head"]') }}
    env:
      SNAPSHOT_SHA: ${{ matrix.source == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha || github.sha }}
      SNAPSHOT_REF: ${{ matrix.source == 'base' && format('refs/heads/{0}', github.event.pull_request.base.ref) || github.event.pull_request.head.ref && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7
        with:
          # Dependency review compares the PR head, not its synthetic merge commit.
          ref: ${{ env.SNAPSHOT_SHA }}
          # Review compares the common ancestor, which can precede the base tip.
          fetch-depth: ${{ matrix.source == 'base' && '0' || '1' }}
      - name: 'Resolve dependency comparison base'
        if: matrix.source == 'base'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          comparison_base=$(git merge-base "$SNAPSHOT_SHA" "$PR_HEAD_SHA")
          git checkout --detach "$comparison_base"
          echo "SNAPSHOT_SHA=$comparison_base" >> "$GITHUB_ENV"
      - name: 'Setup .NET'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: 'Setup Java for the Android workload'
        uses: actions/setup-java@v6
        with:
          distribution: "microsoft"
          java-version: "17"
      - name: 'Install MAUI Android workload'
        run: dotnet workload install maui-android
      - name: 'Restore NuGet projects'
        run: |
          dotnet restore app/BibleOnSite/BibleOnSite.csproj -p:TargetFramework=net10.0-android -p:RuntimeIdentifiers=android-arm64 -r android-arm64
          dotnet restore app/BibleOnSite.Core/BibleOnSite.Core.csproj
          dotnet restore app/BibleOnSite.Tests/BibleOnSite.Tests.csproj
          dotnet restore app/BibleOnSite.Tests.E2E/BibleOnSite.Tests.E2E.csproj -p:EnableWindowsTargeting=true
          dotnet restore app/BibleOnSite.Tests.MobileE2E/BibleOnSite.Tests.MobileE2E.csproj
          dotnet restore app/devops/_build.csproj
      - name: 'Submit NuGet dependencies'
        uses: advanced-security/component-detection-dependency-submission-action@v0.2.0
        with:
          detectorsCategories: NuGet
          # Stable across PR, merge queue and master workflow contexts.
          correlator: nuget
          snapshot-sha: ${{ env.SNAPSHOT_SHA }}
          snapshot-ref: ${{ env.SNAPSHOT_REF }}

  # Repository rules require this exact check name in merge-group/master runs.
  submit-nuget:
    needs: submit-snapshots
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify every snapshot submission succeeded
        env:
          SUBMISSION_RESULT: ${{ needs.submit-snapshots.result }}
        run: test "$SUBMISSION_RESULT" = success
