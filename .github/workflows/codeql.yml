# ====================================================================================
# CodeQL (advanced setup)
# ====================================================================================
# Migrated from CodeQL "default setup" to an advanced workflow so that `[skip ci]` in a
# commit message is honored (default setup ignores it). Post-release version-bump commits
# use "[skip ci]" (e.g. "chore(release): Bump versions ... [skip ci]"), while retry bumps
# intentionally trigger CI and CodeQL. See
# https://stackoverflow.com/questions/74030852.
#
# NOTE: We deliberately do NOT add a `paths-ignore` guard for version/lockfile paths.
# Skipping post-release bumps already avoids scanning their files, and a version bump
# also rewrites lockfiles (e.g. bun.lock). Ignoring lockfile paths would be
# unsafe — a dependency-only push (e.g. from Renovate) must still be scanned for newly
# introduced vulnerabilities.
#
# Languages mirror the previous default setup: actions, csharp, javascript-typescript
# (covers both JS and TS), and python. All use build-mode `none` (buildless analysis),
# matching default setup and avoiding a heavy MAUI/.NET build in CI.
# ====================================================================================
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Scan the merge queue's synthetic commit, not only the original PR merge.
  # https://docs.github.com/en/code-security/reference/code-scanning/workflow-configuration-options#scanning-pull-requests
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "27 3 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Shared router classification (#3795): a pull request runs a real scan
  # only for the languages its diff can actually alter — dependency
  # manifests stay in scope so dependency changes are still scanned.
  # Out-of-scope languages still owe the required code-scanning ruleset an
  # analysis result for the merge ref, so their legs upload an empty result
  # instead of scanning. Scheduled, push and merge-group scans keep the
  # full matrix — the queue's real scan gates the actual merge.
  detect:
    timeout-minutes: 10
    name: Language scope detection
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: devops/package.json
      - name: Detect module changes
        id: detect
        run: node devops/github/ci/determine-changes.ts
      - name: Scope the language matrix
        id: scope
        env:
          LANGUAGES: ${{ steps.detect.outputs.codeql_languages }}
        # The code-scanning ruleset waits for a result per language
        # category configured on the base branch, so every leg runs —
        # `scan` only decides whether it analyzes or reports empty.
        run: >-
          node -e 'const wanted = new Set(JSON.parse(process.env.LANGUAGES));
          const include = ["actions", "csharp", "javascript-typescript", "python"]
          .map((language) => ({ language, "build-mode": "none",
          scan: wanted.has(language) }));
          console.log(`matrix=${JSON.stringify(include)}`);'
          >> "$GITHUB_OUTPUT"

  analyze:
    timeout-minutes: 60
    name: Analyze (${{ matrix.language }})
    needs: detect
    # detect only runs on pull requests, so on merge groups, master pushes and
    # scheduled scans its result is `skipped` — a bare `needs:` would then
    # skip this job before the fallback matrix is even evaluated. The status
    # check keeps the full scan on those events while failing closed when
    # detection fails or is cancelled on a PR (#3795).
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.detect.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ github.event_name == 'pull_request' && fromJSON(needs.detect.outputs.matrix) || fromJSON('[{"language":"actions","build-mode":"none","scan":true},{"language":"csharp","build-mode":"none","scan":true},{"language":"javascript-typescript","build-mode":"none","scan":true},{"language":"python","build-mode":"none","scan":true}]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        if: matrix.scan
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        if: matrix.scan
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      # A diff that cannot alter a language still owes the code-scanning
      # ruleset a result for the merge ref, or the merge queue stays
      # "expecting results" and never enqueues (#3795). An empty run uploads
      # in seconds; the merge-group event re-scans everything for real.
      - name: Upload out-of-scope empty result
        if: ${{ !matrix.scan }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: devops/github/ci/codeql-empty.sarif.json
          category: "/language:${{ matrix.language }}"
