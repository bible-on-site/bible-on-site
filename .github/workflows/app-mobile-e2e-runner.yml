name: Mobile E2E Runner

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      platform_id:
        type: string
        required: true
      artifact:
        type: string
        required: true
      runner:
        type: string
        required: true
      workload:
        type: string
        required: true
      shard:
        type: string
        default: ""
      ios_plan_artifact:
        description: "Shard-plan artifact; its shards/shard-N.json assigns this leg's cases (#2263)"
        type: string
        default: ""
      mode:
        # release-smoke (#2373): build the Release APK and launch it on the
        # emulator — the only leg that executes the production startup path.
        description: "build, prebuilt-run, build-and-run, or release-smoke"
        type: string
        required: true
      e2e_selection_mode:
        type: string
        default: shadow
      force_full_suite:
        type: boolean
        default: false
      perushim_notes_sqlite_artifact:
        type: string
        default: ""

permissions:
  contents: read
  actions: read

env:
  PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_MASTER: perushim-sqlite-v2-indexed.master

jobs:
  runner:
    name: ${{ inputs.platform }} ${{ inputs.mode }}${{ inputs.shard != '' && format(' shard {0}', inputs.shard) || '' }}
    runs-on: ${{ inputs.runner }}
    # Keep the original job/pilot budgets for build and device hosts.
    timeout-minutes: 60
    env:
      MOBILE_PLATFORM: ${{ inputs.platform }}
      MOBILE_E2E_ARTIFACTS: ${{ github.workspace }}/app/.artifacts/mobile-e2e/${{ inputs.artifact }}
      # Instruments the app build and makes the harness pull real app-process
      # coverage dumps after every scenario (#1232).
      MOBILE_E2E_COVERAGE: "1"
      # The builder preflight compiles the Debug harness and build tool once.
      MOBILE_E2E_PREBUILT: "1"
      # Android emulator coordinates shared by the sdkmanager install, the
      # cache keys and the runner action, so any bump invalidates the caches.
      ANDROID_API_LEVEL: "36"
      ANDROID_TARGET: google_apis
      ANDROID_ABI: x86_64
      ANDROID_BUILD_TOOLS: "37.0.0"
      AVD_NAME: mobile_e2e
      AVD_PROFILE: pixel_7
      # Bump when the clean-snapshot recipe changes (boot options, readiness
      # flow, runner-action version) so stale snapshots cannot be restored.
      AVD_SNAPSHOT_RECIPE: r3
      # Same idea for the iOS device-state capture below: bump when the quiesce
      # or restore semantics change so a differently-captured dir cannot load.
      IOS_SIM_STATE_RECIPE: r1
      # Single source for the .NET SDK and workload-set pins (see #1871):
      # the toolchain cache id and the workload install read from here, and the
      # Verify step asserts the resolved SDK matches. SDK installation itself
      # is pinned by the root global.json, which must stay identical to this.
      DOTNET_SDK_VERSION: "10.0.403"
      # Workload sets are band-scoped (10.0.4xx), not SDK-locked: 10.0.401.1 is
      # the last set selecting iOS 27.0, which the xcode-27 image's Xcode 27.0
      # supports. 10.0.402.1 selects iOS 27.1 requiring Xcode 27.1 — deferred
      # until the runner image ships it; see #2566.
      MAUI_WORKLOAD_SET: "10.0.401.1"
      # The Android legs are not Xcode-bound: 10.0.402.1 pins Android SDK
      # 36.1.118, the first servicing release honoring AndroidR8ObfuscationMode
      # and emitting the r8.json metadata Play scores — the Release smoke APK is
      # the pre-merge guard that obfuscated builds still launch (#2708, #2373).
      MAUI_WORKLOAD_SET_ANDROID: "10.0.402.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Keep aligned with Xcode 27 and the iOS packaging workload; see #1871.
          global-json-file: global.json

      # Regression check (#2542): the muxer must resolve the pinned SDK, not a
      # newer image-baked one. global.json (rollForward: disable) enforces this
      # at resolution time; this assertion makes a selection skew fail loudly
      # here instead of surfacing as an ios-build manifest mismatch on a retry.
      - name: Verify .NET SDK selection
        run: |
          resolved=$(dotnet --version)
          echo "Resolved .NET SDK: $resolved (pinned: $DOTNET_SDK_VERSION)"
          test "$resolved" = "$DOTNET_SDK_VERSION"

      - name: Prepare managed test-host stack capture
        env:
          # Keep this diagnostic tool outside the empty prebuilt-runtime cache.
          NUGET_PACKAGES: ${{ runner.temp }}/native-stack-tool-nuget
        run: |
          dotnet tool install dotnet-stack --version 10.0.750501 --tool-path "${{ runner.temp }}/native-stack-tools"
          # Validate and load the report command before the five-second live-capture window.
          "${{ runner.temp }}/native-stack-tools/dotnet-stack" report --help
          echo "MOBILE_E2E_DOTNET_STACK=${{ runner.temp }}/native-stack-tools/dotnet-stack" >> "$GITHUB_ENV"

      - name: Hash NuGet dependency inputs
        id: nuget-key
        run: node ${{ github.workspace }}/devops/github/ci/nuget-cache-key.mjs

      # hashFiles() in step templates dies on a hard 120s budget on loaded
      # runners (#2184); a run step computes the same input without the clock.
      - name: Hash dependency inputs
        if: inputs.mode != 'build'
        id: deps-key
        # package.json is hashed too: a manifest edit (e.g. an install script)
        # without a lockfile change must still rotate the node_modules key.
        run: node ${{ github.workspace }}/devops/github/ci/files-hash.mjs devops/package.json devops/bun.lock app/mobile-e2e/package.json app/mobile-e2e/bun.lock

      - name: Hash AVD readiness script inputs
        id: readiness-key
        if: inputs.platform == 'Android'
        run: node ${{ github.workspace }}/devops/github/ci/files-hash.mjs app/mobile-e2e/android-readiness.mjs app/mobile-e2e/android-ready.mjs app/mobile-e2e/configure-avd-display.mjs

      - name: Restore NuGet packages
        id: nuget-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-mobile-e2e-${{ inputs.platform }}-${{ steps.nuget-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-mobile-e2e-${{ inputs.platform }}-
            ${{ runner.os }}-nuget-

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: devops/package.json

      - name: Select compatible Xcode
        if: inputs.platform == 'iOS'
        run: sudo xcode-select --switch /Applications/Xcode_27.app/Contents/Developer

      # Xcode or the workload invalidates compiled intermediates — stamp every
      # iOS cache key with the toolchain so a mismatched restore can't happen.
      - name: Compute iOS toolchain cache id
        id: toolchain
        if: inputs.platform == 'iOS'
        run: |
          XCODE_VER=$(xcodebuild -version | tr '\n' '-' | tr -d ' ')
          # `dotnet --version` rolls forward to the newest SDK baked into the
          # image, which can differ between jobs on the same runner label; the
          # pinned SDK above is the version actually installed and used.
          echo "id=xcode${XCODE_VER}-dotnet${{ env.DOTNET_SDK_VERSION }}-mauiios${{ env.MAUI_WORKLOAD_SET }}" >> "$GITHUB_OUTPUT"

      # Resolve-before-restore: the same selection boot uses, without the
      # runtime download — a miss leaves boot's download fallback untouched.
      - name: Resolve iOS simulator device
        if: inputs.mode != 'build' && (inputs.platform == 'iOS')
        id: ios-device
        run: bun run --cwd app/mobile-e2e ios:boot:resolve

      # The image bakes a fixed UDID per version, so the key self-invalidates on
      # every image update; the toolchain stamp covers updates that keep the
      # UDID, and the recipe covers capture-logic changes. Exact key only:
      # another device's state must never restore over this one.
      - name: Restore iOS simulator state
        if: inputs.mode != 'build' && (inputs.platform == 'iOS' && steps.ios-device.outputs.udid != '')
        id: ios-sim-cache
        uses: actions/cache/restore@v6
        env:
          # Optional state must not stall device startup on a stuck segment.
          # A timeout is a cache miss; boot's existing cold path still validates
          # the explicit simulator and the full native suite still runs.
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          path: ~/Library/Developer/CoreSimulator/Devices/${{ steps.ios-device.outputs.udid }}
          key: ${{ runner.os }}-ios-sim-${{ steps.ios-device.outputs.udid }}-${{ steps.toolchain.outputs.id }}-${{ env.IOS_SIM_STATE_RECIPE }}


      # node_modules keyed on the lockfile hash is the exact install result —
      # a hit lets bun install --frozen-lockfile skip entirely. The bun cache cacache this replaces kept
      # every tarball under a rolling prefix and took ~4.5 min to restore.
      - name: Restore node_modules
        if: inputs.mode != 'build'
        id: node-modules-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            devops/node_modules
            app/mobile-e2e/node_modules
          key: ${{ runner.os }}-node-modules-e2e-${{ steps.deps-key.outputs.hash }}

      # The coverage tree baseline is published only by successful master push
      # runs; its REST download sees 1s–2m20s transfer variance, so the whole
      # resolve+select runs in the background and never stalls bun install --frozen-lockfile, the boot
      # or the build. Missing or unreadable baselines are not an error — the
      # selector falls back to the full applicable suite (#2085). Shadow mode
      # computes the deterministic subset for evidence while the suite still
      # runs everything; a discovery problem resolves to selectAll — never to
      # a silently empty run. iOS shard legs skip this entirely: the plan job
      # already selected and partitioned the suite once for the whole matrix,
      # and each leg stages its assigned manifest below (#2263).
      - name: Download baseline and select affected tests
        if: inputs.mode != 'build' && inputs.mode != 'release-smoke' && inputs.ios_plan_artifact == ''
        id: selection
        background: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node devops/github/ci/e2e-impact/e2e-impact.ts baseline-download \
            --name "app-mobile-e2e-coverage.master.${{ inputs.platform_id }}" \
            --out "$MOBILE_E2E_ARTIFACTS/baseline"
          BASELINE_ARGS=()
          if [ -f "$MOBILE_E2E_ARTIFACTS/baseline/coverage-tree.json" ]; then
            BASELINE_ARGS=(--baseline "$MOBILE_E2E_ARTIFACTS/baseline/coverage-tree.json")
          fi
          FORCE_ARGS=()
          if [ "${{ inputs.force_full_suite }}" == "true" ]; then
            FORCE_ARGS=(--force-full)
          fi
          node devops/github/ci/e2e-impact/e2e-impact.ts select \
            --suite app/mobile-e2e \
            --platform "${{ inputs.platform_id }}" \
            --tested-sha "${{ github.sha }}" \
            --out "$MOBILE_E2E_ARTIFACTS/selection-manifest.json" \
            --compare "${BASELINE_ARGS[@]}" "${FORCE_ARGS[@]}"

      # The smoke leg builds the app too: devops/node_modules carries the tsx
      # the csproj's perushim decompress target runs. Its own scripts are
      # dependency-free, so the Appium/mobile-e2e install stays out of it.
      - name: Install build and Appium dependencies
        if: inputs.mode != 'build' && (steps.node-modules-cache.outputs.cache-hit != 'true')
        run: |
          bun install --cwd devops --frozen-lockfile
          if [ "${{ inputs.mode }}" != "release-smoke" ]; then
            bun install --cwd app/mobile-e2e --frozen-lockfile
          fi

      # .NET's DerivedData equivalent: obj intermediates from the last master
      # build turn the harness compile incremental. Restored before the
      # harness so its devops compile reuses them too. Master-only saves
      # below; PR runs restore through the toolchain-prefixed fallback key.
      # app/BibleOnSite/obj is deliberately excluded: its codesign skip-stamps
      # let a cross-commit restore emit a .app whose signature no longer
      # covers its pages — the run dies at launch with SIGKILL Invalid Page
      # (observed on this branch's first completed pilot, twice).
      - name: Restore iOS obj intermediates
        id: obj-cache
        if: inputs.mode != 'prebuilt-run' && (inputs.platform == 'iOS')
        uses: actions/cache/restore@v6
        with:
          path: |
            app/BibleOnSite.Tests.MobileE2E/obj
            app/devops/obj
          key: ios-e2e-obj-${{ steps.toolchain.outputs.id }}-${{ github.sha }}
          restore-keys: |
            ios-e2e-obj-${{ steps.toolchain.outputs.id }}-

      - name: Validate the test harness
        if: inputs.mode != 'prebuilt-run' && inputs.mode != 'release-smoke'
        working-directory: app
        shell: bash
        run: |
          mkdir -p "$MOBILE_E2E_ARTIFACTS"
          dotnet run --project devops -- TestMobileE2EUnit 2>&1 | tee -a "$MOBILE_E2E_ARTIFACTS/harness-validation.log"
          dotnet test --project devops.Tests/devops.Tests.csproj --configuration Release 2>&1 | tee -a "$MOBILE_E2E_ARTIFACTS/harness-validation.log"

      # Validate once per platform before any device job starts. The iOS
      # consumers verify the identical delivered runtime and configuration.
      - name: Verify real test-host reporting and shutdown
        if: inputs.mode != 'prebuilt-run' && inputs.mode != 'release-smoke'
        run: node app/mobile-e2e/verify-reporting.mjs app/BibleOnSite.Tests.MobileE2E/bin/Debug/net10.0/BibleOnSite.Tests.MobileE2E.dll "$MOBILE_E2E_DOTNET_STACK" "$MOBILE_E2E_ARTIFACTS"

      # Validate before booting either device: cold simulator startup competes
      # with cache extraction and subprocess tests. The asynchronous boot still
      # overlaps shared-build transfer or Android-independent setup.
      - name: Validate mobile helper scripts
        if: inputs.mode != 'build' && inputs.mode != 'release-smoke'
        shell: bash
        run: |
          mkdir -p "$MOBILE_E2E_ARTIFACTS"
          bun run --cwd app/mobile-e2e test:unit 2>&1 | tee -a "$MOBILE_E2E_ARTIFACTS/harness-validation.log"

      # The full helper suite needs bun install --frozen-lockfile (Appium driver resolution); the
      # smoke leg is dependency-free, so it validates only its own script.
      - name: Validate Release smoke script
        if: inputs.mode == 'release-smoke'
        shell: bash
        run: |
          mkdir -p "$MOBILE_E2E_ARTIFACTS"
          node --test app/mobile-e2e/release-smoke.test.mjs 2>&1 | tee -a "$MOBILE_E2E_ARTIFACTS/harness-validation.log"

      - name: Start iPhone simulator boot
        id: ios-boot
        if: inputs.mode != 'build' && (inputs.platform == 'iOS')
        shell: bash
        run: bun run --cwd app/mobile-e2e ios:boot:start 2>&1 | tee "$MOBILE_E2E_ARTIFACTS/ios-boot-start.log"

      # The boot kicked above is still in flight; the wait also warms Appium's
      # CoreSimulator bridge and exports MOBILE_UDID plus MOBILE_OS_VERSION —
      # each shard is its own runner with a single simulator (#2263). Running
      # it as a background step overlaps all of that with the shared-build
      # archive transfer; `wait` below is the gate that surfaces the
      # finished boot and the exported variables to the test step.
      - name: Finish iPhone simulator setup
        id: simulator
        if: inputs.mode != 'build' && (inputs.platform == 'iOS')
        background: true
        env:
          # Keep the exact device selected by start; listing all devices again
          # can stall CoreSimulator while that device is already booting.
          MOBILE_UDID: ${{ steps.ios-boot.outputs.udid }}
          MOBILE_OS_VERSION: ${{ steps.ios-boot.outputs.version }}
        shell: bash
        run: bun run --cwd app/mobile-e2e ios:boot:wait 2>&1 | tee "$MOBILE_E2E_ARTIFACTS/ios-boot-wait.log"

      # WebDriverAgent preparation only needs node_modules and the selected
      # Xcode, so it runs in the background too, overlapping
      # shared-build transfer. MOBILE_WDA_PATH is exported to
      # GITHUB_ENV and lands after the wait-all gate, before the test step.
      - name: Prepare prebuilt iOS automation agent
        id: wda
        if: inputs.mode != 'build' && (inputs.platform == 'iOS')
        background: true
        run: bun run --cwd app/mobile-e2e ios:wda

      # Dynamic iOS shards (#2263): the plan job decided this leg's cases once
      # for the whole matrix, so the leg stages its assigned manifest verbatim
      # instead of selecting again. A missing or mismatched manifest fails here
      # — never widens silently to the full suite.
      - name: Download iOS shard plan
        if: inputs.mode != 'build' && inputs.ios_plan_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.ios_plan_artifact }}
          path: ${{ runner.temp }}/ios-plan

      - name: Stage assigned iOS shard manifest
        if: inputs.mode != 'build' && inputs.ios_plan_artifact != ''
        id: shard_manifest
        run: |
          MANIFEST="${{ runner.temp }}/ios-plan/shards/shard-${{ inputs.shard }}.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::No shard manifest for iOS shard ${{ inputs.shard }} in ${{ inputs.ios_plan_artifact }}."
            exit 1
          fi
          node -e '
            const m = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const problems = [];
            if (m.shard !== Number(process.argv[2])) problems.push(`manifest is for shard ${m.shard}`);
            if (m.testedSha !== process.argv[3]) problems.push(`manifest tested ${m.testedSha}`);
            if (!Array.isArray(m.selected) || m.selected.length === 0) problems.push("manifest assigns no cases");
            if (problems.length > 0) throw new Error(`Bad iOS shard manifest: ${problems.join("; ")}.`);
          ' "$MANIFEST" "${{ inputs.shard }}" "${{ github.sha }}"
          mkdir -p "$MOBILE_E2E_ARTIFACTS"
          cp "$MANIFEST" "$MOBILE_E2E_ARTIFACTS/case-manifest.json"
          cp "${{ runner.temp }}/ios-plan/ios-shard-plan.json" "$MOBILE_E2E_ARTIFACTS/ios-shard-plan.json"
          echo "manifest=$MOBILE_E2E_ARTIFACTS/case-manifest.json" >> "$GITHUB_OUTPUT"

      # The simulator and WDA are already warming while the archive transfers.
      - name: Download shared iOS build
        if: inputs.mode == 'prebuilt-run'
        uses: actions/download-artifact@v8
        with:
          name: app-mobile-e2e-build.${{ github.run_id }}.ios
          path: ${{ runner.temp }}/ios-e2e-build

      - name: Restore and verify shared iOS build
        id: restore-build
        if: inputs.mode == 'prebuilt-run'
        run: |
          node app/mobile-e2e/ios-build-artifact.mjs restore "$GITHUB_WORKSPACE" "${{ runner.temp }}/ios-e2e-build" "$MOBILE_E2E_ARTIFACTS" "${{ github.sha }}" "${{ steps.toolchain.outputs.id }}"
          codesign --verify --deep --strict app/BibleOnSite/bin/Debug/net10.0-ios/iossimulator-arm64/BibleOnSite.app

      - name: Validate restored runtimes without NuGet cache
        if: inputs.mode == 'prebuilt-run'
        working-directory: app
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/ios-prebuilt-empty-nuget
        run: |
          dotnet devops/bin/Debug/_build.dll ListMobileE2E --configuration Debug
          dotnet BibleOnSite.Tests.MobileE2E/bin/Debug/net10.0/BibleOnSite.Tests.MobileE2E.dll --filter-query '/[(Category=Unit)]' --progress off
          echo "NUGET_PACKAGES=$NUGET_PACKAGES" >> "$GITHUB_ENV"

      # bun install --frozen-lockfile is done, so node_modules is frozen. Background cache publication
      # finishes at the wait-all gate before device tests.
      - name: Save node_modules
        if: inputs.mode != 'build' && inputs.mode != 'release-smoke' && (github.ref == 'refs/heads/master' && steps.node-modules-cache.outputs.cache-hit != 'true')
        background: true
        uses: actions/cache/save@v6
        with:
          path: |
            devops/node_modules
            app/mobile-e2e/node_modules
          key: ${{ runner.os }}-node-modules-e2e-${{ steps.deps-key.outputs.hash }}

      - name: Setup Java
        if: inputs.platform == 'Android'
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: "21"
          verify-signature: true

      # iOS legs stay on the Xcode-27-compatible set; Android legs take the
      # newer set carrying Android SDK 36.1.118 (#2708). Resolve once so the
      # cache key and the install can never disagree.
      - name: Resolve workload set pin
        if: inputs.mode != 'prebuilt-run'
        id: workload-set
        run: |
          if [ "${{ inputs.workload }}" = "maui-android" ]; then
            echo "version=${{ env.MAUI_WORKLOAD_SET_ANDROID }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ env.MAUI_WORKLOAD_SET }}" >> "$GITHUB_OUTPUT"
          fi

      # Linux images include root-owned SDK directories; tar must be able to
      # restore their metadata as the runner, just like the Android SDK below.
      - name: Make cached MAUI workload packs writable by the runner
        if: inputs.mode != 'prebuilt-run' && runner.os == 'Linux'
        run: |
          : "${DOTNET_ROOT:?DOTNET_ROOT is required}"
          sdk_owner="$(id -u):$(id -g)"
          for component in packs metadata sdk-manifests template-packs; do
            sudo mkdir -p "$DOTNET_ROOT/$component"
            sudo chown -R "$sdk_owner" "$DOTNET_ROOT/$component"
          done

      # The workload set is a multi-GB silent NuGet download (~6 min cold in
      # run 38438842693); restored packs turn the install into a verify no-op.
      # Exact key only — a partial restore is worse than downloading.
      - name: Restore MAUI workload packs
        if: inputs.mode != 'prebuilt-run'
        id: workload-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.DOTNET_ROOT }}/packs
            ${{ env.DOTNET_ROOT }}/metadata
            ${{ env.DOTNET_ROOT }}/sdk-manifests
            ${{ env.DOTNET_ROOT }}/template-packs
          key: ${{ runner.os }}-${{ runner.arch }}-dotnet-${{ env.DOTNET_SDK_VERSION }}-${{ inputs.workload }}-${{ steps.workload-set.outputs.version }}

      - name: Install MAUI workload
        if: inputs.mode != 'prebuilt-run'
        # 10.0.401.1 selects the iOS 27.0 SDK, which requires Xcode 27.0; see #1871.
        # maui-android resolves to 10.0.402.1 (Android SDK 36.1.118) for #2708's
        # obfuscation support; iOS stays pinned until #2566 ships Xcode 27.1.
        run: dotnet workload install ${{ inputs.workload }} --version ${{ steps.workload-set.outputs.version }}

      # Background like the other cache saves: compression and upload stay off
      # the build's critical path; the wait-all gate still bounds it.
      - name: Save MAUI workload packs
        if: inputs.mode != 'prebuilt-run' && (github.event_name != 'pull_request' && github.event_name != 'merge_group' && steps.workload-cache.outputs.cache-hit != 'true')
        background: true
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.DOTNET_ROOT }}/packs
            ${{ env.DOTNET_ROOT }}/metadata
            ${{ env.DOTNET_ROOT }}/sdk-manifests
            ${{ env.DOTNET_ROOT }}/template-packs
          key: ${{ steps.workload-cache.outputs.cache-primary-key }}

      # The Debug build bundles perushim data from the checkout's packaged
      # paths, but the committed .gz fixture is only a local-dev fallback — the
      # pair a release ships always comes from the perushim_data artifacts.
      # Install the same validated catalog+notes pair package_app uses so E2E
      # exercises the commentary data this commit would actually ship. The
      # Shared commentary-search pilot builds the notes FTS index, so a missing
      # or mismatched pair must fail here — before the build, not mid-suite.
      - name: Download perushim SQLite pair
        if: inputs.mode != 'prebuilt-run' && inputs.mode != 'release-smoke' && inputs.perushim_notes_sqlite_artifact != '' && inputs.perushim_notes_sqlite_artifact != env.PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_MASTER
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.perushim_notes_sqlite_artifact }}
          path: ${{ runner.temp }}/perushim-sqlite

      # Master baseline lives outside this run's artifact namespace: fetch it
      # through the REST API (no gh binary dependency on the xcode-27 legs).
      - name: Download perushim SQLite pair (master baseline)
        if: inputs.mode != 'prebuilt-run' && inputs.mode != 'release-smoke' && (inputs.perushim_notes_sqlite_artifact == '' || inputs.perushim_notes_sqlite_artifact == env.PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_MASTER)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node devops/github/ci/e2e-impact/e2e-impact.ts baseline-download \
            --name "${{ env.PERUSHIM_NOTES_SQLITE_ARTIFACT_NAME_MASTER }}" \
            --out "${{ runner.temp }}/perushim-sqlite"
          # baseline-download is nonfatal on a missing artifact, but this pair
          # is required: assert the extraction produced files.
          test -n "$(ls -A "${{ runner.temp }}/perushim-sqlite" 2>/dev/null)"

      - name: Install matching perushim catalog and notes
        if: inputs.mode != 'prebuilt-run' && inputs.mode != 'release-smoke'
        run: python3 app/devops/prepare_perushim_assets.py --source "${{ runner.temp }}/perushim-sqlite" --app-directory app/BibleOnSite --platform ${{ inputs.platform }}

      - name: Build complete simulator app
        if: inputs.mode != 'prebuilt-run' && inputs.mode != 'release-smoke'
        id: build-app
        # Explicit bash enables pipefail, preserving bun failures through tee.
        shell: bash
        run: |
          mkdir -p "$MOBILE_E2E_ARTIFACTS"
          bun run --cwd app/mobile-e2e build:app 2>&1 | tee "$MOBILE_E2E_ARTIFACTS/build.log"

      # Release-configuration startup guard (#2373): only a packaged Release
      # build executes the analytics initialization that killed #2247 store
      # launches — every Debug/e2e artifact compiles that branch out under
      # DISABLE_ANALYTICS, so the Appium suite can never see this class of
      # failure. The target deliberately keeps DisableAnalytics unset.
      - name: Build Android Release smoke APK
        if: inputs.platform == 'Android' && inputs.mode == 'release-smoke'
        id: build-release-smoke
        shell: bash
        run: |
          mkdir -p "$MOBILE_E2E_ARTIFACTS"
          bun run --cwd app/mobile-e2e build:release-smoke 2>&1 | tee "$MOBILE_E2E_ARTIFACTS/build-release-smoke.log"

      # Cached native outputs can retain stale code-signing pages. Sign the
      # final simulator payload inside out and verify it before any launch.
      - name: Sign and verify iOS simulator app
        if: inputs.mode != 'prebuilt-run' && (inputs.platform == 'iOS')
        run: bun run --cwd app/mobile-e2e ios:sign

      - name: Package shared iOS build with coverage and harness
        if: inputs.mode == 'build'
        run: node app/mobile-e2e/ios-build-artifact.mjs pack "$GITHUB_WORKSPACE" "$MOBILE_E2E_ARTIFACTS/coverage-app" "${{ runner.temp }}/ios-e2e-build" "${{ github.sha }}" "${{ steps.toolchain.outputs.id }}"

      - name: Upload shared iOS build
        if: inputs.mode == 'build'
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: app-mobile-e2e-build.${{ github.run_id }}.ios
          path: ${{ runner.temp }}/ios-e2e-build/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Save iOS obj intermediates
        if: inputs.mode != 'prebuilt-run' && (inputs.platform == 'iOS' && github.ref == 'refs/heads/master' && steps.obj-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@v6
        with:
          path: |
            app/BibleOnSite.Tests.MobileE2E/obj
            app/devops/obj
          key: ios-e2e-obj-${{ steps.toolchain.outputs.id }}-${{ github.sha }}

      - name: Save NuGet packages
        if: inputs.mode != 'prebuilt-run' && (github.ref == 'refs/heads/master' && steps.nuget-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@v6
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - name: Prepare Android emulator runtime and hardware acceleration
        if: inputs.platform == 'Android'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0
          sudo chmod 666 /dev/kvm

      # Caches resolve before any install: the action always asks sdkmanager for
      # the newest stable emulator and system image, so keys must track what
      # Google's manifests currently serve. An unresolved key never matches a
      # saved cache and is never saved back; the install step then takes the
      # same bounded sdkmanager fallback it would without caching.
      - name: Resolve Android SDK cache coordinates
        if: inputs.platform == 'Android'
        id: sdk-key
        run: node devops/github/ci/android-sdk-manifest.mjs

      # Hosted images include root-owned SDK directories. The cache restores
      # their modes, so the task owner must own them before extraction/install.
      - name: Make cached Android SDK packages writable by the runner
        if: inputs.platform == 'Android'
        run: |
          sdk_owner="$(id -u):$(id -g)"
          sudo chown "$sdk_owner" "$ANDROID_HOME"
          for component in emulator system-images platforms build-tools platform-tools; do
            if [ -e "$ANDROID_HOME/$component" ]; then
              sudo chown -R "$sdk_owner" "$ANDROID_HOME/$component"
            fi
          done

      # Package metadata (package.xml) is cached inside each directory so
      # sdkmanager recognizes installed packages. The narrow restore-key
      # intentionally allows an older emulator revision: sdkmanager updates it
      # in place while the large system image stays usable.
      - name: Restore Android SDK packages
        if: inputs.platform == 'Android'
        id: sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.sdk-key.outputs.sdk-home }}/emulator
            ${{ steps.sdk-key.outputs.sdk-home }}/system-images/android-${{ env.ANDROID_API_LEVEL }}
            ${{ steps.sdk-key.outputs.sdk-home }}/platforms/android-${{ env.ANDROID_API_LEVEL }}
            ${{ steps.sdk-key.outputs.sdk-home }}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
            ${{ steps.sdk-key.outputs.sdk-home }}/platform-tools
          key: android-sdk-${{ steps.sdk-key.outputs.os-tag }}-${{ runner.arch }}-${{ steps.sdk-key.outputs.sdk-key }}
          restore-keys: |
            android-sdk-${{ steps.sdk-key.outputs.os-tag }}-${{ runner.arch }}-

      # sdkmanager trusts package.xml even when the payload is truncated, so the
      # script verifies content first, removes corrupt restorations, and only
      # then downloads with bounded retries.
      - name: Install or repair Android SDK packages
        if: inputs.platform == 'Android'
        run: node devops/github/ci/android-sdk-install.mjs

      # Exact-key only: a snapshot built under different coordinates can be
      # worse than a cold boot, so misses rebuild through the snapshot stage.
      - name: Restore clean AVD snapshot
        if: inputs.platform == 'Android'
        id: avd-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.sdk-key.outputs.avd-home }}
          key: android-avd-${{ steps.sdk-key.outputs.os-tag }}-${{ runner.arch }}-api${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_TARGET }}-${{ env.ANDROID_ABI }}-${{ env.AVD_PROFILE }}-swiftshader-${{ steps.sdk-key.outputs.emulator-key }}-${{ env.AVD_SNAPSHOT_RECIPE }}-${{ steps.readiness-key.outputs.hash }}

      - name: Validate restored AVD snapshot
        if: inputs.platform == 'Android' && steps.avd-cache.outputs.cache-hit == 'true'
        id: avd-check
        env:
          MOBILE_UDID: emulator-5554
        run: node app/mobile-e2e/android-snapshot-check.mjs validate-restored

      # Two-stage snapshot pattern: on a cache miss the action creates the AVD,
      # cold-boots it and runs only the device readiness check — never the app
      # install or an Appium session — so the saved state stays clean.
      - name: Create clean AVD snapshot
        if: inputs.platform == 'Android' && (steps.avd-cache.outputs.cache-hit != 'true' || steps.avd-check.outputs.usable == 'false')
        id: avd-snapshot
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          MOBILE_UDID: emulator-5554
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: ${{ env.ANDROID_ABI }}
          target: ${{ env.ANDROID_TARGET }}
          profile: ${{ env.AVD_PROFILE }}
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: false
          pre-emulator-launch-script: node app/mobile-e2e/configure-avd-display.mjs
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-metrics -memory 4096
          script: bun run --cwd app/mobile-e2e android:ready

      # `emu kill` is graceful but asynchronous; the snapshot payload must reach
      # the AVD directory before the save step may capture it.
      - name: Confirm snapshot persisted
        if: inputs.platform == 'Android' && steps.avd-snapshot.outcome == 'success'
        id: snapshot-files
        env:
          MOBILE_UDID: emulator-5554
        run: node app/mobile-e2e/android-snapshot-check.mjs confirm-saved

      # Caches are written from push/workflow_dispatch runs: default-branch runs
      # publish for every PR, while PR and merge-queue runs only restore.
      - name: Save clean AVD snapshot
        if: inputs.platform == 'Android' && github.event_name != 'pull_request' && github.event_name != 'merge_group' && steps.sdk-key.outputs.resolved == 'true' && steps.avd-cache.outputs.cache-hit != 'true' && steps.snapshot-files.outputs.saved == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.sdk-key.outputs.avd-home }}
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}

      # The Android pilot's env consumes the selection manifest, so its leg
      # cannot start until the background selection finishes. A planned iOS
      # leg skips that step — its shard manifest is staged synchronously
      # above — and waits at the simulator gate below instead.
      - name: Wait for test selection
        wait-all:

      - name: Run shared pilot on Android
        if: inputs.platform == 'Android' && inputs.mode != 'release-smoke'
        id: pilot
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          MOBILE_UDID: emulator-5554
          # Empty in shadow mode: the manifest is reported, not enforced.
          MOBILE_E2E_SELECTION: ${{ inputs.e2e_selection_mode == 'enforce' && steps.selection.outputs.manifest || '' }}
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: ${{ env.ANDROID_ABI }}
          target: ${{ env.ANDROID_TARGET }}
          profile: ${{ env.AVD_PROFILE }}
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: false
          pre-emulator-launch-script: node app/mobile-e2e/configure-avd-display.mjs
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot-save -no-metrics -memory 4096
          # The wrapper retains the existing supervised pilot, then ends only
          # this no-snapshot-save QEMU tree before the action can retain its pipes.
          script: node app/mobile-e2e/android-pilot.mjs

      # Release startup guard (#2373): install the packaged Release APK and
      # cold-start it with the suite's analytics-isolation marker, then again
      # over retained data and after a reinstall. The leg fails on any app
      # crash, ANR or startup hang — the exact failure class #2247 shipped
      # while every Debug-configured check stayed green. The staged APK next
      # to its build-manifest.json is the artifact this leg attests.
      - name: Run Android Release startup smoke
        if: inputs.platform == 'Android' && inputs.mode == 'release-smoke'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          MOBILE_UDID: emulator-5554
          MOBILE_RELEASE_APK: ${{ github.workspace }}/app/.artifacts/mobile-e2e/${{ inputs.artifact }}/release-smoke/app-release-smoke.apk
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: ${{ env.ANDROID_ABI }}
          target: ${{ env.ANDROID_TARGET }}
          profile: ${{ env.AVD_PROFILE }}
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: false
          pre-emulator-launch-script: node app/mobile-e2e/configure-avd-display.mjs
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot-save -no-metrics -memory 4096
          script: bun run --cwd app/mobile-e2e release-smoke

      # The SDK save waits for a genuinely booted device (any stage's readiness
      # log) rather than trusting installed packages, and stays disabled for
      # PR/merge-queue runs so only default-branch scope publishes caches.
      - name: Record device readiness for cache validation
        if: inputs.platform == 'Android' && always()
        id: device-ready
        run: |
          if grep -q '"ready":true' "$MOBILE_E2E_ARTIFACTS/device-readiness.jsonl" 2>/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Android SDK packages
        if: inputs.platform == 'Android' && always() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && steps.sdk-key.outputs.resolved == 'true' && steps.sdk-cache.outputs.cache-hit != 'true' && steps.device-ready.outputs.ready == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.sdk-key.outputs.sdk-home }}/emulator
            ${{ steps.sdk-key.outputs.sdk-home }}/system-images/android-${{ env.ANDROID_API_LEVEL }}
            ${{ steps.sdk-key.outputs.sdk-home }}/platforms/android-${{ env.ANDROID_API_LEVEL }}
            ${{ steps.sdk-key.outputs.sdk-home }}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
            ${{ steps.sdk-key.outputs.sdk-home }}/platform-tools
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      # Gates both background steps: simulator readiness + env exports and the
      # prebuilt WebDriverAgent. A no-op on the Android leg, which has none.
      - name: Wait for iPhone simulator
        wait-all:

      # Each runner owns one simulator/session and the case manifest the plan
      # assigned it (#2263). The final merge verifies the executed union equals
      # the planned run set exactly once.
      - name: Run iOS runner shard
        if: inputs.mode != 'build' && (inputs.platform == 'iOS')
        id: pilot-ios
        # The independent supervisor stops the full process tree at its deadline
        # (15 minutes, scaled with a planned shard's estimate up to 45 minutes);
        # this outer limit also bounds a blocked supervisor or runner step.
        timeout-minutes: 50
        env:
          # A planned leg always enforces its shard manifest — the partition is
          # the assignment, not a narrowing hint. Android legs keep shadow-mode
          # reporting: empty unless enforce passes the selection manifest.
          MOBILE_E2E_SELECTION: ${{ inputs.ios_plan_artifact != '' && steps.shard_manifest.outputs.manifest || (inputs.e2e_selection_mode == 'enforce' && steps.selection.outputs.manifest || '') }}
        run: bun run --cwd app/mobile-e2e test

      # Coverage resets, dump pulls and device-diagnostics captures are
      # diagnostic-only by design — a failure writes to the trx and never
      # decides the scenario. That silence let every Android scenario's reset
      # 403 for months. One occurrence warns as a plausible transient; the
      # same signature twice is systematic and fails the leg. Artifacts still
      # upload via the always() steps below.
      - name: Flag systematic harness diagnostics
        if: inputs.mode != 'build' && inputs.mode != 'release-smoke' && always() && !cancelled()
        id: silent-failures
        env:
          # A green pilot that produced no trx left this gate with nothing to
          # scan — that absence is itself a systematic failure, so the outcome
          # decides whether an empty results dir is an error or just expected
          # fallout of a pilot that already failed loudly.
          PILOT_OUTCOME: ${{ inputs.platform == 'iOS' && steps['pilot-ios'].outcome || steps.pilot.outcome }}
        run: node app/mobile-e2e/silent-failures.mjs "$MOBILE_E2E_ARTIFACTS/results" "$PILOT_OUTCOME"

      # Real app-process coverage (#1232): the harness pulled a live hit dump
      # from the instrumented app at the end of every scenario. This applies
      # them onto the build's OpenCover template and emits lcov.info. The step
      # also runs after a failed pilot so partial coverage stays diagnosable;
      # a missing template or a run with zero dumps fails loudly here. Canceled
      # runs skip processing so they release the runner for the replacement;
      # the unconditional diagnostic upload below still preserves raw evidence.
      - name: Apply app-process coverage dumps
        if: inputs.mode != 'build' && always() && !cancelled() && (steps.build-app.outcome == 'success' || steps.restore-build.outcome == 'success')
        id: coverage-apply
        working-directory: app
        run: dotnet devops/bin/Debug/_build.dll CoverageMobileE2E

      - name: Upload app coverage report
        if: always() && steps.coverage-apply.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: app-e2e-coverage.${{ github.run_id }}.${{ inputs.artifact }}
          path: app/.artifacts/mobile-e2e/${{ inputs.artifact }}/coverage-app/
          retention-days: 90
          if-no-files-found: error
      # Captured post-test so the saved device keeps session warm-state, but
      # quiesced first: test apps are removed and the device is shut down so
      # the directory is a consistent Shutdown image. A device that does not
      # match the resolved UDID is never captured under its key.
      - name: Quiesce iOS simulator for state capture
        if: inputs.mode != 'build' && (inputs.platform == 'iOS' && always() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && steps.ios-device.outputs.udid != '' && steps.ios-sim-cache.outputs.cache-hit != 'true' && steps.simulator.outcome == 'success')
        id: ios-sim-quiesce
        run: node app/mobile-e2e/ios-sim-state.mjs quiesce "${{ steps.ios-device.outputs.udid }}"

      - name: Save iOS simulator state
        if: inputs.mode != 'build' && (inputs.platform == 'iOS' && always() && steps.ios-sim-quiesce.outputs.saved == 'true')
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Developer/CoreSimulator/Devices/${{ steps.ios-device.outputs.udid }}
          key: ${{ steps.ios-sim-cache.outputs.cache-primary-key }}

      # Real executed-code coverage (#2085): the AltCover template, per-test
      # app-coverage dumps and the run reports become the exec tree, which the
      # collect step unions into coverage-tree.json. Runs without the
      # instrumented-coverage artifacts (pre-#2156 layout) skip extraction —
      # the automation-id channel stands alone.
      - name: Extract executable coverage tree
        if: inputs.mode != 'build' && inputs.mode != 'release-smoke' && (always() && !cancelled())
        id: exec-tree
        env:
          # Each device host runs exactly one pilot; the other's outcome is
          # "skipped" — a truthy string that would win an || chain — so route
          # by platform instead of relying on fallback order.
          PILOT_OUTCOME: ${{ inputs.platform == 'iOS' && steps['pilot-ios'].outcome || steps.pilot.outcome }}
        run: |
          # The extractor prefers the applied report and falls back to the
          # template — extraction is possible when either exists.
          if [ ! -f "$MOBILE_E2E_ARTIFACTS/coverage-app/coverage.opencover.xml" ] \
            && [ ! -f "$MOBILE_E2E_ARTIFACTS/coverage-app/template.opencover.xml" ]; then
            echo "[e2e-coverage-trees] no coverage-app OpenCover input — exec coverage unavailable this run"
            exit 0
          fi
          INCOMPLETE_ARGS=()
          if [ "$PILOT_OUTCOME" != "success" ] || [ "${{ inputs.platform }}" = "iOS" ]; then
            INCOMPLETE_ARGS=(--incomplete)
          fi
          node devops/e2e-coverage-trees/e2e-coverage-trees.ts extract \
            --suite app/mobile-e2e \
            --platform "${{ inputs.platform_id }}" \
            --artifacts "$MOBILE_E2E_ARTIFACTS" \
            --snapshot-sha "${{ github.sha }}" \
            --out "$MOBILE_E2E_ARTIFACTS/exec-coverage-tree.json" "${INCOMPLETE_ARGS[@]}"
          echo "exec-coverage-tree=$MOBILE_E2E_ARTIFACTS/exec-coverage-tree.json" >> "$GITHUB_OUTPUT"

      # Evidence is collected even after a failed run — passed tests keep their
      # coverage — but the tree is marked incomplete so a partial run can never
      # shrink the trusted baseline.
      - name: Collect per-test coverage evidence
        if: inputs.mode != 'build' && inputs.mode != 'release-smoke' && (always() && !cancelled())
        id: collect
        env:
          # Each device host runs exactly one pilot; the other's outcome is
          # "skipped" — a truthy string that would win an || chain — so route
          # by platform instead of relying on fallback order.
          PILOT_OUTCOME: ${{ inputs.platform == 'iOS' && steps['pilot-ios'].outcome || steps.pilot.outcome }}
        run: |
          INCOMPLETE_ARGS=()
          if [ "$PILOT_OUTCOME" != "success" ] || [ "${{ inputs.platform }}" = "iOS" ]; then
            INCOMPLETE_ARGS=(--incomplete)
          fi
          EXEC_ARGS=()
          if [ -f "$MOBILE_E2E_ARTIFACTS/exec-coverage-tree.json" ]; then
            EXEC_ARGS=(--exec-tree "$MOBILE_E2E_ARTIFACTS/exec-coverage-tree.json")
          fi
          node devops/github/ci/e2e-impact/e2e-impact.ts collect-appium \
            --suite app/mobile-e2e \
            --platform "${{ inputs.platform_id }}" \
            --artifacts "$MOBILE_E2E_ARTIFACTS" \
            --snapshot-sha "${{ github.sha }}" \
            --out "$MOBILE_E2E_ARTIFACTS/coverage-tree.json" "${INCOMPLETE_ARGS[@]}" "${EXEC_ARGS[@]}"

      # Shadow-mode parity (#2085): score this leg's selection manifest
      # against the outcomes the full run observed — an unselected failure is
      # the parity miss the rollout gate counts before enforcement. Android
      # only: iOS legs execute a shard assignment, and suite-level parity is
      # scored by merge_ios against the merged tree. Pure diagnostics.
      - name: Verify shadow selection parity
        if: inputs.mode != 'build' && inputs.platform == 'Android' && (always() && !cancelled())
        run: |
          node devops/github/ci/e2e-impact/e2e-impact.ts verify \
            --manifest "$MOBILE_E2E_ARTIFACTS/selection-manifest.json" \
            --tree "$MOBILE_E2E_ARTIFACTS/coverage-tree.json" \
            --out "$MOBILE_E2E_ARTIFACTS/selection-verify.json"

      # The authoritative baseline is published only from a completed,
      # successful default-branch run; PR and merge-queue evidence stays
      # provisional inside the run's appium artifact.
      - name: Publish coverage-tree baseline
        if: inputs.platform == 'Android' && always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && (steps.pilot.outcome == 'success' || steps['pilot-ios'].outcome == 'success') && steps.collect.outcome == 'success' && steps['silent-failures'].outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: app-mobile-e2e-coverage.master.${{ inputs.platform_id }}
          path: app/.artifacts/mobile-e2e/${{ inputs.artifact }}/coverage-tree.json
          retention-days: 90
          overwrite: true

      # Executable coverage baseline (#1232): published under the same trust
      # rules as the coverage tree — only a completed, successful
      # default-branch run refreshes it, so a partial or selected run can
      # never overwrite a complete baseline.
      - name: Publish app coverage baseline
        if: inputs.platform == 'Android' && always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && (steps.pilot.outcome == 'success' || steps['pilot-ios'].outcome == 'success') && steps.coverage-apply.outcome == 'success' && steps['silent-failures'].outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-coverage.master.${{ inputs.artifact }}
          path: app/.artifacts/mobile-e2e/${{ inputs.artifact }}/coverage-app/
          retention-days: 90
          overwrite: true

      # The exec tree gets its own baseline artifact per the storage policy
      # in docs/devops/e2e-test-selection.md — same trust rule as the
      # automation-id baseline above. Runs without exec coverage (no
      # template → no extracted tree) skip the publish.
      - name: Publish exec coverage-tree baseline
        if: inputs.platform == 'Android' && always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && (steps.pilot.outcome == 'success' || steps['pilot-ios'].outcome == 'success') && steps['exec-tree'].outcome == 'success' && steps['exec-tree'].outputs.exec-coverage-tree != '' && steps['silent-failures'].outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: app-mobile-e2e-exec-coverage.master.${{ inputs.artifact }}
          path: app/.artifacts/mobile-e2e/${{ inputs.artifact }}/exec-coverage-tree.json
          retention-days: 90
          overwrite: true

      - name: Upload iOS runner merge inputs
        if: inputs.mode != 'build' && (inputs.platform == 'iOS' && always() && !cancelled())
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: app-mobile-e2e-shard.${{ github.run_id }}.${{ inputs.artifact }}
          path: app/.artifacts/mobile-e2e/${{ inputs.artifact }}/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload platform results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appium-${{ inputs.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/.artifacts/mobile-e2e/${{ inputs.artifact }}/
            app/.nuke/temp/build*.log
          retention-days: 14
          # Only the explicit diagnostics paths above are included.
          include-hidden-files: true

