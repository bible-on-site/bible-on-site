# Dependabot covers security updates only — Renovate (renovate.json) owns
# version updates. Every entry sets open-pull-requests-limit: 0 so no
# version-update PRs are opened, while security-update PRs remain enabled.
# See docs/devops/devops.md for the role split.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/devops"
      - "/devops/perek-images"
      - "/web/admin"
      - "/web/api/tests"
      - "/web/bible-on-site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "npm"
    directory: "/app/mobile-e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "cargo"
    directories:
      - "/data"
      - "/web/api"
      - "/web/bulletin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "nuget"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "docker"
    directories:
      - "/data/sefaria/mongodb-docker"
      - "/devops/coverage/lcov-docker"
      - "/devops/rustfs"
      - "/web/admin"
      - "/web/api"
      - "/web/bible-on-site"
      - "/web/bulletin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "pip"
    directory: "/data/recitation"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"
