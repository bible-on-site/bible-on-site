name: Build lcov Docker image
description: >-
  Builds lcov-cli:0.0.2 into the job's Docker daemon with BuildKit and the
  GitHub Actions layer cache — replaces the artifact build/restore/re-upload
  fan-out while keeping `docker run lcov-cli:0.0.2` invocations identical.
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver-opts: |
          network=host
          image=moby/buildkit:v0.22.0

    - name: Build lcov Docker image
      uses: docker/build-push-action@v7
      with:
        context: devops/coverage/lcov-docker/
        file: devops/coverage/lcov-docker/Dockerfile
        tags: lcov-cli:0.0.2
        load: true
        cache-from: type=gha,scope=lcov-cli
        cache-to: type=gha,scope=lcov-cli,mode=max
